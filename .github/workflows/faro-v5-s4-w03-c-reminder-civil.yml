name: FARO V5 W03-C Reminder Civil Due

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/owner/reminders/src/main/kotlin/ar/com/faro/v5/owner/reminders/api/ReminderCivilExpansion.kt
      - v5/owner/reminders/src/test/kotlin/ar/com/faro/v5/owner/reminders/api/S4W03ReminderCivilExpansionTest.kt
      - .github/workflows/faro-v5-s4-w03-c-reminder-civil.yml

permissions:
  contents: read

jobs:
  reminder-civil:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: W03-C exact-route protocol preflight against parent
        run: |
          set -euo pipefail
          UNIT=S4_W03_C_REMINDER_CIVIL_DUE
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count + 1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -eq 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for multi-project Gradle config
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Test pure civil recurrence on JVM
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :owner:reminders:test --tests ar.com.faro.v5.owner.reminders.api.S4W03ReminderCivilExpansionTest
      - name: Verify exactly 10 W03-C JUnit XML tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          reports = list(Path('v5/owner/reminders/build/test-results/test').glob(
              'TEST-*S4W03ReminderCivilExpansionTest.xml'))
          assert len(reports) == 1, reports
          suite = ElementTree.parse(reports[0]).getroot()
          totals = tuple(int(suite.attrib[k]) for k in ('tests','failures','errors','skipped'))
          assert totals == (10,0,0,0), totals
          print('W03_C_REMINDER_CIVIL_XML_PASS 10/10')
          PY
      - name: Preserve W03-C JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-c-reminder-civil-xml
          if-no-files-found: error
          path: v5/owner/reminders/build/test-results/test/TEST-*S4W03ReminderCivilExpansionTest.xml
