name: FARO V5 W04-F2C1A DEV foreground session Android lifecycle
on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - "v5/app/src/w04CommercialDev/kotlin/ar/com/faro/v5/app/FaroV5W04CommercialDevForegroundSessionGate.kt"
      - "v5/app/src/w04CommercialDev/kotlin/ar/com/faro/v5/app/FaroV5W04CommercialDevActivity.kt"
      - "v5/app/src/w04AndroidTest/kotlin/ar/com/faro/v5/app/S4W04CommercialForegroundSessionAndroidTest.kt"
      - ".github/workflows/faro-v5-s4-w04-f2c1a-foreground-session.yml"
permissions:
  contents: read
jobs:
  android-w04-f2c1a:
    if: contains(github.event.head_commit.message, 'FARO-UNIT:S4_W04_F2C1A_ANDROID_FOREGROUND_SESSION_GATE_DEV')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mandatory exact-four-path READY and protocol
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/faro-protocol-gate.py --mode ci --head HEAD
          UNIT=S4_W04_F2C1A_ANDROID_FOREGROUND_SESSION_GATE_DEV
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count+1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -eq 4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Emulator acceleration
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: DEV foreground session lifecycle, API35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 600
          script: >-
            cd v5 && ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache
            -Pkotlin.compiler.execution.strategy=in-process
            "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
            -PfaroW04AndroidTest=true
            -Pandroid.testInstrumentationRunnerArguments.class=ar.com.faro.v5.app.S4W04CommercialForegroundSessionAndroidTest
            :app:connectedW04CommercialDevAndroidTest
      - name: Verify four distinct real Android XML cases and isolated APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports = list(Path("v5/app/build/outputs/androidTest-results").rglob("TEST-*.xml"))
          cases = [c for p in reports for c in ET.parse(p).getroot().iter("testcase")]
          names = {c.attrib.get("name") for c in cases}
          required = {
              "t01DefaultLauncherHasNoTrustedSessionOrInjectedCommercialData",
              "t02ExplicitChoiceAndIndependentGrantsAreRequiredForEveryRead",
              "t03PauseClosesSessionAndResumeCannotReopenOrRestoreReview",
              "t04EpochAbaDuplicateAttachAndThrowingCallbackFailClosed",
          }
          assert len(cases) == len(names) == 4, (names, reports)
          assert names == required
          assert all(c.attrib.get("classname") ==
              "ar.com.faro.v5.app.S4W04CommercialForegroundSessionAndroidTest" for c in cases)
          assert all(c.find(k) is None for c in cases for k in ("failure","error","skipped"))
          print("FARO_W04_F2C1A_ANDROID35_FOREGROUND_XML_PASS_4_4")
          PY
          apk="$(find v5/app/build/outputs/apk/w04CommercialDev -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" >/tmp/w04-f2c1a-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          text=Path("/tmp/w04-f2c1a-badging.txt").read_text()
          assert "package: name='ar.com.faro.alpha.w04commercialdev'" in text
          assert text.count("launchable-activity:") == 1
          for p in ("INTERNET","POST_NOTIFICATIONS","SCHEDULE_EXACT_ALARM",
                    "RECEIVE_BOOT_COMPLETED","ACCESS_NETWORK_STATE","WAKE_LOCK"):
              assert "android.permission."+p not in text,p
          print("FARO_W04_F2C1A_OFFLINE_PACKAGE_PASS")
          PY
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w04-f2c1a-android35-xml-apk
          if-no-files-found: warn
          path: |
            v5/app/build/outputs/androidTest-results/**/TEST-*.xml
            v5/app/build/outputs/apk/w04CommercialDev/*.apk
