name: FARO V5 W04-F2A isolated Household10 Evidence2 STAGED copy upgrade JVM DEV
on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5CommercialEvidence2StagedUpgrade.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5CommercialEvidence2StagedUpgradeTest.kt"
      - ".github/workflows/faro-v5-s4-w04-f2a-staged-upgrade.yml"
permissions:
  contents: read
jobs:
  f2a-staged-upgrade:
    if: contains(github.event.head_commit.message, 'FARO-UNIT:S4_W04_F2A_HOUSEHOLD10_EVIDENCE2_STAGED_UPGRADE_DEV')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce READY exact3 and protocol
        run: |
          set -euo pipefail
          python3 scripts/quality/faro-protocol-gate.py --mode ci --head HEAD
          UNIT=S4_W04_F2A_HOUSEHOLD10_EVIDENCE2_STAGED_UPGRADE_DEV
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count+1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -ge 1
          test "$count" -le 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Android SDK 37
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Run F2A real five-store STAGED upgrade JUnit5
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:generation:test --tests ar.com.faro.v5.generation.FaroV5CommercialEvidence2StagedUpgradeTest
      - name: Exact F2A XML eight cases and no skip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths=list(Path("v5/store/generation/build/test-results").rglob(
              "TEST-*FaroV5CommercialEvidence2StagedUpgradeTest.xml"))
          assert len(paths)==1, paths
          root=ET.parse(paths[0]).getroot()
          counts=tuple(int(root.attrib[x]) for x in ("tests","failures","errors","skipped"))
          assert counts==(8,0,0,0),counts
          cases=root.findall(".//testcase")
          names={c.attrib.get("name") for c in cases}
          assert len(cases)==len(names)==8
          assert all(c.find(x) is None for c in cases for x in ("failure","error","skipped"))
          print("W04_F2A_STAGED_HOUSEHOLD10_EVIDENCE2_JVM_XML_PASS_8_8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w04-f2a-staged-upgrade-xml
          if-no-files-found: warn
          path: v5/store/generation/build/test-results/**/TEST-*FaroV5CommercialEvidence2StagedUpgradeTest.xml
