name: FARO V5 private cloud compile gate

on:
  push:
    branches:
      - work/cloud-afternoon-pilot-20261030
      - work/cierre-noche-pilot-20261030
    paths:
      - ".github/workflows/faro-v5-cloud-ci.yml"
      - "v5/**"

permissions:
  contents: read

concurrency:
  group: faro-v5-cloud-trial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-only:
    if: github.repository == 'etacsantafe-source/FARO-V5'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
    steps:
      - name: Checkout exact trial commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android 37 compile platform using runner SDK
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Structural, composition and Android compiler gates
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            v5StructuralCheck appCompositionPolicyCheck \
            :surface:compileDebugKotlin :app:compileDebugKotlin :app:compileDebugJavaWithJavac
      - name: Surface navigation and projection regressions
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :surface:testDebugUnitTest
      - name: Directed F3 backup external-effect tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :maintenance:test --tests 'ar.com.faro.v5.maintenance.BackupExternalWriteT2Test'
      - name: Directed F1 reviewed Apply and F2 pre-switch recovery tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :app:testDebugUnitTest \
            --tests 'ar.com.faro.v5.app.FaroV5ReviewedApplyHostAdapterTest' \
            --tests 'ar.com.faro.v5.app.FaroV5ReviewedApplyHostIntegrationTest' \
            --tests 'ar.com.faro.v5.app.FaroV5PreSwitchHostAdmissionT2Test' \
            --tests 'ar.com.faro.v5.app.FaroV5QuarantinedRecoveryVsV1GateT2Test' \
            --tests 'ar.com.faro.v5.app.FaroV5ChatToReviewedApplyFlowT2Test' \
            --tests 'ar.com.faro.v5.app.FaroV5ActiveChatReasoningSessionT2Test'
      - name: Check exact directed JUnit XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          expected = {
            'v5/maintenance/build/test-results/test/TEST-ar.com.faro.v5.maintenance.BackupExternalWriteT2Test.xml': 4,
            'v5/app/build/test-results/testDebugUnitTest/TEST-ar.com.faro.v5.app.FaroV5ReviewedApplyHostAdapterTest.xml': 3,
            'v5/app/build/test-results/testDebugUnitTest/TEST-ar.com.faro.v5.app.FaroV5ReviewedApplyHostIntegrationTest.xml': 2,
            'v5/app/build/test-results/testDebugUnitTest/TEST-ar.com.faro.v5.app.FaroV5PreSwitchHostAdmissionT2Test.xml': 7,
            'v5/app/build/test-results/testDebugUnitTest/TEST-ar.com.faro.v5.app.FaroV5QuarantinedRecoveryVsV1GateT2Test.xml': 3,
            'v5/app/build/test-results/testDebugUnitTest/TEST-ar.com.faro.v5.app.FaroV5ChatToReviewedApplyFlowT2Test.xml': 1,
            'v5/app/build/test-results/testDebugUnitTest/TEST-ar.com.faro.v5.app.FaroV5ActiveChatReasoningSessionT2Test.xml': 7,
          }
          for path, tests in expected.items():
            p = Path(path)
            if not p.is_file():
              raise SystemExit(f'MISSING_XML {path}')
            root = ET.parse(p).getroot()
            got = tuple(int(root.attrib.get(k, '-1')) for k in ('tests', 'failures', 'errors', 'skipped'))
            if got != (tests, 0, 0, 0):
              raise SystemExit(f'FAIL_XML {path} {got}, expected {(tests,0,0,0)}')
            print(f'PASS_XML {path}: {got}')
          surface = list(Path('v5/surface/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          if not surface:
            raise SystemExit('MISSING_SURFACE_XML')
          total_surface = 0
          for p in surface:
            root = ET.parse(p).getroot()
            got = tuple(int(root.attrib.get(k, '-1')) for k in ('tests', 'failures', 'errors', 'skipped'))
            if got[0] <= 0 or got[1:] != (0, 0, 0):
              raise SystemExit(f'FAIL_SURFACE_XML {p}: {got}')
            total_surface += got[0]
            print(f'PASS_SURFACE_XML {p}: {got}')
          print(f'FARO_V5_SURFACE_XML_PASS {total_surface}/{total_surface}')
          print('FARO_V5_NEW_REPO_DIRECTED_XML_PASS 27/27')
          PY
