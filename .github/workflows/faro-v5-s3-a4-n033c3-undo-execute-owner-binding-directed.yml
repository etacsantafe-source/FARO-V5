name: FARO V5 S3 A4 N033C3 Undo execute internal Reality8 owner binding
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityPlanningUndoExecuteBinding.kt"
      - "v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityStore.kt"
      - "v5/store/reality/src/test/kotlin/ar/com/faro/v5/store/reality/RealityPlanningUndoExecuteBindingT2Test.kt"
      - ".github/workflows/faro-v5-s3-a4-n033c3-undo-execute-owner-binding-directed.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: faro-v5-s3-a4-n033c3-undo-execute-owner-binding
  cancel-in-progress: false

jobs:
  undo-owner-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          set -eu
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: REAL Reality8 Undo binding source receipt owner CAS and new receipt
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:reality:test --tests "ar.com.faro.v5.store.reality.RealityPlanningUndoExecuteBindingT2Test"
      - name: Strict exact seven tests JUnit XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          path=Path('v5/store/reality/build/test-results/test')
          matches=list(path.glob('TEST-*RealityPlanningUndoExecuteBindingT2Test.xml'))
          if len(matches)!=1: raise SystemExit('N033C3_UNDO_BINDING_XML_MISSING')
          node=ET.parse(matches[0]).getroot()
          values=tuple(int(node.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
          if values!=(7,0,0,0): raise SystemExit('N033C3_UNDO_BINDING_XML_FAIL '+str(values))
          print('N033C3_UNDO_BINDING_XML_PASS 7/7')
          PY
