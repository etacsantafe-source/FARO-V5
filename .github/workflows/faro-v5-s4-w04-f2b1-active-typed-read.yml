name: FARO V5 W04-F2B1 already-selected Household10 typed Evidence2 active read DEV
on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5GenerationStoreGraph.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Household10Evidence2ActiveReadSessionTest.kt"
      - ".github/workflows/faro-v5-s4-w04-f2b1-active-typed-read.yml"
permissions:
  contents: read
jobs:
  f2b1-active-typed-read:
    if: contains(github.event.head_commit.message, 'FARO-UNIT:S4_W04_F2B1_HOUSEHOLD10_TYPED_ACTIVE_READ_SESSION_DEV')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact READY parent and protocol
        run: |
          set -euo pipefail
          python3 scripts/quality/faro-protocol-gate.py --mode ci --head HEAD
          UNIT=S4_W04_F2B1_HOUSEHOLD10_TYPED_ACTIVE_READ_SESSION_DEV
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count+1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -ge 1
          test "$count" -le 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SDK37 for Kotlin JVM compilation
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Run F2B1 isolated ACTIVE typed-session JUnit5 directed
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:generation:test --tests ar.com.faro.v5.generation.FaroV5Household10Evidence2ActiveReadSessionTest
      - name: XML exact six and no failure error skip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path("v5/store/generation/build/test-results").rglob(
              "TEST-*FaroV5Household10Evidence2ActiveReadSessionTest.xml"))
          assert len(files)==1, files
          root=ET.parse(files[0]).getroot()
          values=tuple(int(root.attrib[k]) for k in ("tests","failures","errors","skipped"))
          assert values==(6,0,0,0),values
          cases=root.findall(".//testcase")
          assert len(cases)==len({x.attrib.get("name") for x in cases})==6
          assert all(c.find(k) is None for c in cases for k in ("failure","error","skipped"))
          print("W04_F2B1_ALREADY_ACTIVE_TYPED_SESSION_JVM_XML_PASS_6_6")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w04-f2b1-already-active-typed-xml
          if-no-files-found: warn
          path: v5/store/generation/build/test-results/**/TEST-*FaroV5Household10Evidence2ActiveReadSessionTest.xml
