name: FARO V5 W01 B3B1B1B0 observed read fence DEV
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W01B3B1B1B0ObservedReadFence.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W01B3B1B1B0ObservedReadFenceTest.kt"
      - ".github/workflows/faro-v5-s4-w01-b3b1b1b0-fence-directed.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faro-v5-w01-b3b1b1b0-read-fence
  cancel-in-progress: false
jobs:
  fence-jvm-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run eight exact new read fence JVM cases
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache :app:testDebugUnitTest --tests "ar.com.faro.v5.app.S4W01B3B1B1B0ObservedReadFenceTest"
      - name: Compile isolated DEV Android app without product wiring
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache :app:compileV2CoreDevKotlin
      - name: Verify exactly eight JUnit cases and no shipping use
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          folder = Path("v5/app/build/test-results/testDebugUnitTest")
          files = list(folder.glob("TEST-*S4W01B3B1B1B0ObservedReadFenceTest.xml"))
          if len(files) != 1: raise SystemExit("B3B1B1B0_XML_MISSING")
          root = ET.parse(files[0]).getroot()
          counts = tuple(int(root.get(k, "-1")) for k in ("tests", "failures", "errors", "skipped"))
          if counts != (8,0,0,0): raise SystemExit("B3B1B1B0_XML_FAIL " + str(counts))
          expected = {
            "f01MissingOrMalformedPrincipalCannotCallSource",
            "f02TwoIdenticalFreshObservationsReturnOnlyObservedDto",
            "f03RevocationBetweenSnapshotsFailsClosed",
            "f04PointerAbaWithSameGenerationIdDenies",
            "f05HostEpochReadinessOrPrincipalChangeDenies",
            "f06GlobalPolicyOrSourceRevisionChangedDenies",
            "f07ExceptionsNegativeClockAndExpiredSecondSnapshotDeny",
            "f08CloseAndPostFailureCannotReuseOrRetainBalances",
          }
          actual = {x.get("name","").removesuffix("()") for x in root.findall("testcase")}
          if actual != expected: raise SystemExit("B3B1B1B0_NAMED_CASE_MISMATCH " + str(actual))
          targets = (
            "v5/app/src/main/java/ar/com/faro/v5/app/FaroV5CompositionRoot.java",
            "v5/surface/src/main/kotlin/ar/com/faro/v5/surface/FaroV5ShellNavigation.kt",
            "v5/surface/src/main/kotlin/ar/com/faro/v5/surface/FaroV5AdaptiveShell.kt",
          )
          for target in targets:
            if "S4W01B3B1B1B0ObservedReadFence" in Path(target).read_text():
              raise SystemExit("B3B1B1B0_SHIPPING_MOUNT_FOUND " + target)
          print("W01_B3B1B1B0_INERT_READ_FENCE_8_OF_8")
          print("NO_HUMAN_IDENTITY_CROSS_PROCESS_ZERO_LATENCY_OR_G15_ATTESTED")
          PY
      - name: Archive exact JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-v5-w01-b3b1b1b0-fence-junit
          path: v5/app/build/test-results/testDebugUnitTest/TEST-*S4W01B3B1B1B0ObservedReadFenceTest.xml
          if-no-files-found: warn
