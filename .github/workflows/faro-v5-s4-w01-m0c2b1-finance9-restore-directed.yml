name: FARO V5 S4 W01-M0C2B1 authenticated Finance9 stage-section restore
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityFinance9StagedRowsRestorePort.kt"
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Finance9AuthenticatedSectionRestore.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Finance9AuthenticatedSectionRestoreTest.kt"
      - ".github/workflows/faro-v5-s4-w01-m0c2b1-finance9-restore-directed.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faro-v5-s4-w01-m0c2b1
  cancel-in-progress: false
jobs:
  authenticated-stage-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run seven stage-only authenticated Finance9 restore cases
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:generation:test --tests "ar.com.faro.v5.generation.FaroV5Finance9AuthenticatedSectionRestoreTest"
      - name: Assert exact seven JUnit XML cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path("v5/store/generation/build/test-results/test").glob("TEST-*FaroV5Finance9AuthenticatedSectionRestoreTest.xml"))
          if len(files)!=1: raise SystemExit("W01_M0C2B1_XML_MISSING "+str(len(files)))
          node=ET.parse(files[0]).getroot()
          counts=tuple(int(node.get(k,"-1")) for k in ("tests","failures","errors","skipped"))
          expected={
              "authenticatedV4RestoresRealBudgetAndDebtOnSealedStageNine",
              "exactArchiveReplayIsVerifiedWithoutDuplicateOrReapply",
              "incorrectPasswordOrTamperedArchiveNeverWritesRows",
              "v3ArchiveOrMissingFinance9SectionIsRejected",
              "foreignNonfreshMoneyOrPersistedAclRejectsOverwrite",
              "foreignAccountDependencyRollsBackAllFinance9Inserts",
              "activeTargetAbaOrSidecarCannotReturnVerifiedStage",
          }
          names=[(c.get("name") or "").removesuffix("()") for c in node.findall("testcase")]
          if counts!=(7,0,0,0) or len(names)!=7 or set(names)!=expected:
              raise SystemExit("W01_M0C2B1_XML_FAIL "+str((counts,names)))
          print("S4_W01_M0C2B1_AUTH_FINANCE9_SECTION_RESTORE_PASS 7/7")
          print("NOT_CERTIFIED: complete five-store replay, archive pin/journal, cross-process ACL, Android, G15")
          PY
      - name: Preserve exact M0C2B1 JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-v5-w01-m0c2b1-finance9-stage-restore-junit
          path: v5/store/generation/build/test-results/test/TEST-*FaroV5Finance9AuthenticatedSectionRestoreTest.xml
          if-no-files-found: warn
