name: FARO V5 S3 A3 Guardados typed contracts JVM directed

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/kernel/contracts/src/main/kotlin/ar/com/faro/v5/kernel/contracts/BookmarkContracts.kt"
      - "v5/kernel/contracts/src/test/kotlin/ar/com/faro/v5/kernel/contracts/BookmarkContractsTest.kt"
      - ".github/workflows/faro-v5-s3-a3-bookmark-contracts-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-a3-bookmark-contracts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bookmark-contracts-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run only eight new typed Guardados contracts tests
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :kernel:contracts:test --tests "ar.com.faro.v5.kernel.contracts.BookmarkContractsTest"
      - name: Verify exactly eight JUnit results without skips
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path('v5/kernel/contracts/build/test-results/test')
          files = sorted(root.glob('TEST-*BookmarkContractsTest.xml'))
          if len(files) != 1:
              raise SystemExit('S3_A3_BOOKMARK_CONTRACTS_XML_MISSING ' + str(files))
          suite = ET.parse(files[0]).getroot()
          observed = tuple(int(suite.attrib.get(k, '-1'))
                           for k in ('tests','failures','errors','skipped'))
          if observed != (8,0,0,0):
              raise SystemExit('S3_A3_BOOKMARK_CONTRACTS_XML_FAILED ' + str(observed))
          print('S3_A3_BOOKMARK_CONTRACTS_JVM_PASS 8/8')
          PY
