name: FARO V5 S4 W01-B2C2 Finance receipt-only recovery JUnit
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W01B2C2FinanceReceiptRecoveryTest.kt"
      - ".github/workflows/faro-v5-s4-w01-b2c2-receipt-recovery-directed.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faro-v5-s4-w01-b2c2
  cancel-in-progress: false
jobs:
  w01-b2c2-finance-receipt-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android compile SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Run five Finance crash receipt-only recovery cases
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:testDebugUnitTest --tests "ar.com.faro.v5.app.S4W01B2C2FinanceReceiptRecoveryTest"
      - name: Verify exact five JUnit XML cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path("v5/app/build/test-results/testDebugUnitTest").glob("TEST-*S4W01B2C2FinanceReceiptRecoveryTest.xml"))
          if len(files)!=1: raise SystemExit("W01_B2C2_XML_MISSING "+str(len(files)))
          root=ET.parse(files[0]).getroot()
          counts=tuple(int(root.get(k,"-1")) for k in ("tests","failures","errors","skipped"))
          expected={
              "committedRealityReceiptRecoversWorkspaceAfterReopenWithoutSecondApply",
              "approvedWithoutStartedAttemptDoesNotAllocatePreparedOrReceipt",
              "applyingWithoutCommittedReceiptStaysRecoveryRequired",
              "wrongFingerprintOrAuthorityCannotRecoverAnotherReview",
              "secondRecoveryDoesNotDuplicateFinanceLedgerOrReceipt",
          }
          names=[(x.get("name") or "").removesuffix("()") for x in root.findall("testcase")]
          if counts!=(5,0,0,0) or len(names)!=5 or set(names)!=expected:
              raise SystemExit("W01_B2C2_XML_FAIL "+str((counts,names)))
          print("S4_W01_B2C2_FINANCE_RECEIPT_ONLY_RECOVERY_XML_PASS 5/5")
          print("NOT_CERTIFIED: user identity, cross-process policy, G15, productive Finance Apply, C1")
          PY
      - name: Preserve W01-B2C2 exact XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-v5-w01-b2c2-finance-recovery-junit
          path: v5/app/build/test-results/testDebugUnitTest/TEST-*S4W01B2C2FinanceReceiptRecoveryTest.xml
          if-no-files-found: warn
