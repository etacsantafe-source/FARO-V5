name: FARO V5 S4 W01-M0C2B2B Finance9 full FBS2v4 staged archive
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5FiveStoreBackupCapture.kt"
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5FiveStoreStagedRestore.kt"
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Finance9FullArchiveCoordinator.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Finance9FullArchiveCoordinatorTest.kt"
      - ".github/workflows/faro-v5-s4-w01-m0c2b2b-finance9-full-archive-directed.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faro-v5-s4-w01-m0c2b2b
  cancel-in-progress: false
jobs:
  full-finance9-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run ten full Finance9 archive tests
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:generation:test --tests "ar.com.faro.v5.generation.FaroV5Finance9FullArchiveCoordinatorTest"
      - name: Assert exactly ten JUnit XML cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path("v5/store/generation/build/test-results/test").glob(
              "TEST-*FaroV5Finance9FullArchiveCoordinatorTest.xml"))
          if len(files)!=1:
              raise SystemExit("W01_M0C2B2B_XML_MISSING "+str(len(files)))
          node=ET.parse(files[0]).getroot()
          counts=tuple(int(node.get(k,"-1")) for k in (
              "tests","failures","errors","skipped"))
          expected={
              "fullV4CaptureContainsAllFiveOwnersAndFinance9Data",
              "captureExcludesFinanceAclPolicyAndGrantTables",
              "fullRestoreReplaysLedgerG4PlanningWorkspaceAndFinance9WithoutCutover",
              "exactArchiveReplayIsIdempotentAcrossStoreOwners",
              "crashAfterRealityBaseCanReplayPinnedArchiveWithoutActivation",
              "crashAfterFinanceCommitCanVerifyAndReplay",
              "archiveAndTargetSubstitutionDeniedByDurableIdentityPin",
              "tamperWrongPassphraseAndV3ArchiveDeniedBeforeAnyRestore",
              "foreignFinance9DataCannotBeOverwritten",
              "activePointerAbaWrongDescriptorAndSidecarsAreRejected",
          }
          names=[(c.get("name") or "").removesuffix("()")
                 for c in node.findall("testcase")]
          if counts!=(10,0,0,0) or len(names)!=10 or set(names)!=expected:
              raise SystemExit("W01_M0C2B2B_XML_FAIL "+str((counts,names)))
          print("S4_W01_M0C2B2B_FINANCE9_FULL_FBS2V4_PASS 10/10")
          print("NOT_CERTIFIED: interprocess M1, active cutover, Android, W01 UI, W02")
          PY
      - name: Preserve full Finance9 FBS2v4 JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-v5-w01-m0c2b2b-finance9-full-fbs2v4-junit
          path: v5/store/generation/build/test-results/test/TEST-*FaroV5Finance9FullArchiveCoordinatorTest.xml
          if-no-files-found: warn
