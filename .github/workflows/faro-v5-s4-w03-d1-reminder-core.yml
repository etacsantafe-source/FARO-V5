name: FARO V5 W03-D1 Reminder Review Apply Core

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/owner/reminders/src/main/kotlin/ar/com/faro/v5/owner/reminders/api/ReminderMutationContract.kt
      - v5/owner/reminders/src/main/kotlin/ar/com/faro/v5/owner/reminders/api/S4W03ReminderMutationBinding.kt
      - v5/owner/reminders/src/main/kotlin/ar/com/faro/v5/owner/reminders/spi/ReminderPersistencePort.kt
      - v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityStore.kt
      - v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W03ReminderReviewHost.kt
      - v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W03ReminderReviewHostTest.kt
      - v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W03ReminderLocalNoticeProjection.kt
      - v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W03ReminderLocalNoticeProjectionTest.kt
      - .github/workflows/faro-v5-s4-w03-d1-reminder-core.yml

permissions:
  contents: read

jobs:
  reminder-review-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preflight exact nine paths against READY parent
        run: |
          set -euo pipefail
          unit=S4_W03_D1_REMINDER_MUTATION_CORE
          count=0
          while IFS= read -r p; do
            test -n "$p"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$unit" --path "$p"
            count=$((count + 1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -ge 1 && test "$count" -le 9
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK for JVM multi-project Gradle config
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Test real SQLite Reminder receipts and local Notice candidate isolation
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :app:testDebugUnitTest \
            --tests ar.com.faro.v5.app.S4W03ReminderReviewHostTest \
            --tests ar.com.faro.v5.app.S4W03ReminderLocalNoticeProjectionTest
      - name: Verify nine W03-D1 JUnit XML cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          base=Path('v5/app/build/test-results')
          for cls, expected in [('S4W03ReminderReviewHostTest',7),
                                ('S4W03ReminderLocalNoticeProjectionTest',2)]:
              reports=list(base.rglob('TEST-*'+cls+'.xml'))
              assert len(reports)==1,(cls,reports)
              suite=ElementTree.parse(reports[0]).getroot()
              totals=tuple(int(suite.attrib[x]) for x in ('tests','failures','errors','skipped'))
              assert totals==(expected,0,0,0),(cls,totals)
              print(cls,expected,'PASS')
          print('W03_D1_REMINDER_REVIEW_XML_PASS 9/9')
          PY
      - name: Upload directed JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-d1-reminder-core-xml
          if-no-files-found: error
          path: |
            v5/app/build/test-results/**/TEST-*S4W03ReminderReviewHostTest.xml
            v5/app/build/test-results/**/TEST-*S4W03ReminderLocalNoticeProjectionTest.xml
