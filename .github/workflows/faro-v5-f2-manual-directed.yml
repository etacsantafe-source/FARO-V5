name: FARO V5 F2 manual isolated activation/recovery
on:
  push:
    branches:
      - work/f2-manual-20261101
    paths:
      - "v5/app/src/androidTest/kotlin/ar/com/faro/v5/app/FaroV5F2IsolatedActivationRecoveryInstrumentationTest.kt"
      - ".github/workflows/faro-v5-f2-manual-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-f2-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  f2-android-isolated-activation-recovery:
    if: github.repository == 'etacsantafe-source/FARO-V5'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 37 compile platform
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Enable KVM for Android API 35 emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo KVM_UNAVAILABLE; fi
      - name: Android isolated five-owner crash/recovery and fail-closed gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cd v5 && ./gradlew -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ar.com.faro.v5.app.FaroV5F2IsolatedActivationRecoveryInstrumentationTest
      - name: Exact Android XML oracle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases=[]
          for p in Path('v5/app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'):
              for case in ET.parse(p).getroot().iter('testcase'):
                  if 'FaroV5F2IsolatedActivationRecoveryInstrumentationTest' in case.attrib.get('classname',''):
                      cases.append(case)
          expected={'crashAfterPointerPublishRecoversFiveStoresAndDoesNotReplayTwice',
                    'missingWorkspaceBlocksActivationWithoutMovingV1PointerOrAdmittingWrites'}
          names=[c.attrib.get('name') for c in cases]
          if len(names)!=2 or set(names)!=expected:
              raise SystemExit('F2_ANDROID_CASES_MISSING_OR_WRONG '+str(names))
          if any(c.find(x) is not None for c in cases for x in ('failure','error','skipped')):
              raise SystemExit('F2_ANDROID_TEST_FAILED')
          print('F2_ANDROID_ISOLATED_ACTIVATION_RECOVERY_PASS 2/2')
          print('F2 NOT CERTIFIED; physical T4 NOT_RUN; V2_ACTIVE_ENABLED false')
          PY
