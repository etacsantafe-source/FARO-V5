name: FARO V5 S3 A4 N033C2B1 host pointer ABA sequence fence

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5PreSwitchHostAdmission.kt"
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5V2RecoveryRuntimeHealthOwner.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5PreSwitchHostAdmissionT2Test.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5V2RecoveryRuntimeHealthOwnerT2Test.kt"
      - ".github/workflows/faro-v5-s3-a4-n033c2b1-host-pointer-aba-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-a4-n033c2b1-host-pointer-aba
  cancel-in-progress: false

jobs:
  host-pointer-aba:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK for Gradle configuration
        run: |
          set -eu
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Execute existing host admission and recovery tests with ABA negatives
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:testDebugUnitTest --tests "ar.com.faro.v5.app.FaroV5PreSwitchHostAdmissionT2Test" --tests "ar.com.faro.v5.app.FaroV5V2RecoveryRuntimeHealthOwnerT2Test"
      - name: Verify exact JUnit XML with no skipped or failed tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          folder=Path('v5/app/build/test-results/testDebugUnitTest')
          expected={'FaroV5PreSwitchHostAdmissionT2Test':9,
                    'FaroV5V2RecoveryRuntimeHealthOwnerT2Test':11}
          total=0
          for name,n in expected.items():
              matches=list(folder.glob('TEST-*'+name+'.xml'))
              if len(matches)!=1:
                  raise SystemExit('N033C2B1_XML_MISSING '+name)
              root=ET.parse(matches[0]).getroot()
              observed=tuple(int(root.attrib.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
              if observed!=(n,0,0,0):
                  raise SystemExit('N033C2B1_XML_FAIL '+name+' '+str(observed))
              print('N033C2B1_XML_PASS '+name+' '+str(n)+'/'+str(n))
              total+=n
          if total!=20:
              raise SystemExit('N033C2B1_TOTAL_FAIL '+str(total))
          print('N033C2B1_HOST_POINTER_ABA_PASS 20/20')
          PY
