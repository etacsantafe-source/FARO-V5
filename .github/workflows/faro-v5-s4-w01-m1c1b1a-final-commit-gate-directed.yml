name: FARO V5 S4 W01 M1C1B1A Apply post receipt final commit gate
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/kernel/apply/src/main/kotlin/ar/com/faro/v5/kernel/apply/ApplyTransactionExecutor.kt"
      - "v5/kernel/apply/src/test/kotlin/ar/com/faro/v5/kernel/apply/ApplyTransactionExecutorTest.kt"
      - ".github/workflows/faro-v5-s4-w01-m1c1b1a-final-commit-gate-directed.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faro-v5-w01-m1c1b1a-kernel-final-commit
  cancel-in-progress: false
jobs:
  post-receipt-rollback-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute six new final gate cases and all 13 existing executor regressions
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :kernel:apply:test --tests "ar.com.faro.v5.kernel.apply.ApplyTransactionExecutorTest"
      - name: Enforce exact new D01-D06 and 19 total real XML testcases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths=list(Path("v5/kernel/apply/build/test-results/test").glob(
              "TEST-*ApplyTransactionExecutorTest.xml"))
          if len(paths)!=1: raise SystemExit("M1C1B1A_XML_MISSING "+str(len(paths)))
          root=ET.parse(paths[0]).getroot()
          stats=tuple(int(root.get(x,"-1")) for x in ("tests","failures","errors","skipped"))
          expected={
              "d01FinalGateObservesMatchingReceiptAfterBindingsBeforeSqlCommit",
              "d02FinalGateDenialAfterReceiptRollsBackInsteadOfCommitting",
              "d03FinalGateDetectsRevocationAfterBindingsWithoutPublishingSuccess",
              "d04FinalGateExceptionForcesRecoveryAndTransactionRollback",
              "d05ReceiptIdentityMismatchNeverInvokesFinalCommitGate",
              "d06BindingRejectionNeverCreatesReceiptOrCallsFinalGate",
          }
          names=[(x.get("name") or "").removesuffix("()") for x in root.findall("testcase")]
          if stats!=(19,0,0,0) or len(names)!=19 or len(set(names))!=19 or not expected.issubset(set(names)):
              raise SystemExit("M1C1B1A_XML_FAIL "+str((stats,names)))
          print("W01_M1C1B1A_KERNEL_POST_RECEIPT_GATE_JVM_PASS_19_OF_19")
          print("M1C1B1A_DIRECTED_NEW_TESTS_PASS_6_OF_6")
          print("NOT_CERTIFIED: actual Finance9 Android host, biometric, durable principal, G15, shipping V2 or W2")
          PY
      - name: Save exact JUnit XML evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-v5-w01-m1c1b1a-kernel-final-commit-junit
          path: v5/kernel/apply/build/test-results/test/TEST-*ApplyTransactionExecutorTest.xml
          if-no-files-found: warn
