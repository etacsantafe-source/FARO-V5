name: FARO V5 S4 W01 M1C1B1A Apply post receipt final commit gate
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/kernel/apply/src/main/kotlin/ar/com/faro/v5/kernel/apply/ApplyTransactionExecutor.kt"
      - "v5/kernel/apply/src/test/kotlin/ar/com/faro/v5/kernel/apply/ApplyTransactionExecutorTest.kt"
      - ".github/workflows/faro-v5-s4-w01-m1c1b1a-final-commit-gate-directed.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faro-v5-w01-m1c1b1a-kernel-final-commit
  cancel-in-progress: false
jobs:
  post-receipt-rollback-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run legacy S3 A4 exact13 and new M1C1B1A exact6 separately
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :kernel:apply:test --tests "ar.com.faro.v5.kernel.apply.ApplyTransactionExecutorTest" --tests "ar.com.faro.v5.kernel.apply.ApplyTransactionFinalCommitGateTest"
      - name: Verify TWO independent JUnit XML suites (13 legacy plus 6 new)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          folder=Path("v5/kernel/apply/build/test-results/test")
          def suite(class_name,expected_count):
              files=list(folder.glob("TEST-*"+class_name+".xml"))
              if len(files)!=1: raise SystemExit("M1C1B1A_XML_MISSING "+class_name+" "+str(len(files)))
              root=ET.parse(files[0]).getroot()
              stats=tuple(int(root.get(x,"-1")) for x in ("tests","failures","errors","skipped"))
              if stats!=(expected_count,0,0,0): raise SystemExit("M1C1B1A_XML_FAIL "+class_name+" "+str(stats))
              names=[(x.get("name") or "").removesuffix("()") for x in root.findall("testcase")]
              if len(names)!=expected_count or len(set(names))!=expected_count:
                  raise SystemExit("M1C1B1A_TESTCASE_DUPLICATE "+class_name)
              return set(names)
          legacy=suite("ApplyTransactionExecutorTest",13)
          final=suite("ApplyTransactionFinalCommitGateTest",6)
          expected={
              "d01FinalGateObservesMatchingReceiptAfterBindingsBeforeSqlCommit",
              "d02FinalGateDenialAfterReceiptRollsBackInsteadOfCommitting",
              "d03FinalGateDetectsRevocationAfterBindingsWithoutPublishingSuccess",
              "d04FinalGateExceptionForcesRecoveryAndTransactionRollback",
              "d05ReceiptIdentityMismatchNeverInvokesFinalCommitGate",
              "d06BindingRejectionNeverCreatesReceiptOrCallsFinalGate",
          }
          if final!=expected or legacy.intersection(expected):
              raise SystemExit("M1C1B1A_MIXED_LEGACY_NEW_TEST_NAMES")
          print("S3_A4_LEGACY_TRANSACTION_HOOK_JVM_PASS_13_OF_13")
          print("W01_M1C1B1A_FINAL_COMMIT_GATE_NEW_JVM_PASS_6_OF_6")
          print("W01_M1C1B1A_COMBINED_TOTAL_PASS_19_OF_19")
          print("NOT_CERTIFIED: real Finance9 Android host, biometric G15, productive V2 or W2")
          PY
      - name: Save BOTH independent JUnit XML files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-v5-w01-m1c1b1a-kernel-final-commit-junit
          path: v5/kernel/apply/build/test-results/test/TEST-*ApplyTransaction*Test.xml
          if-no-files-found: warn
