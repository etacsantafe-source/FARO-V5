name: FARO V5 W05-A1B3B1 FBS2v8 H10 H11R Full STAGED Replay

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityHousehold11NeedsRowsPort.kt
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household11V8FullStageReplay.kt
      - v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Household11V8FullStageReplayTest.kt
      - .github/workflows/faro-v5-s4-w05-a1b3b1-h10-h11r-stage.yml

permissions:
  contents: read

jobs:
  h10-h11r-v8-stage-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact four-route READY preflight against parent
        shell: bash
        run: |
          set -euo pipefail
          UNIT=S4_W05_A1B3B1_FBS2V8_H10_H11R_STAGED_REPLAY_DEV
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count + 1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -eq 4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for Gradle project configuration
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run ten isolated H10 and H11R recovery JUnit5 tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:generation:test --tests ar.com.faro.v5.generation.FaroV5Household11V8FullStageReplayTest
      - name: Verify actual ten-case JUnit5 XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          matches=list(Path('v5/store/generation/build/test-results/test').glob(
            'TEST-*FaroV5Household11V8FullStageReplayTest.xml'))
          assert len(matches)==1, matches
          suite=ElementTree.parse(matches[0]).getroot()
          totals=tuple(int(suite.attrib[k]) for k in ('tests','failures','errors','skipped'))
          assert totals==(10,0,0,0), totals
          assert len(suite.findall('testcase'))==10
          print('FARO_W05_A1B3B1_FBS2V8_H10_H11R_STAGED_XML_PASS_10_10')
          PY
      - name: Preserve authentic JUnit5 XML for B7
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-a1b3b1-fbs2v8-h10-h11r-stage-xml
          if-no-files-found: error
          path: v5/store/generation/build/test-results/test/TEST-*FaroV5Household11V8FullStageReplayTest.xml
