name: FARO V5 W05-A2C1D stock consumption Undo admission DEV

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/owner/household/src/main/kotlin/ar/com/faro/v5/owner/household/api/HouseholdStockConsumptionUndoDevAdmission.kt
      - v5/owner/household/src/test/kotlin/ar/com/faro/v5/owner/household/api/HouseholdStockConsumptionUndoDevAdmissionTest.kt
      - .github/workflows/faro-v5-s4-w05-a2c1d-consumption-undo-admission.yml

permissions:
  contents: read

jobs:
  consumption-undo-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact three paths and READY parent permit
        shell: bash
        run: |
          set -euo pipefail
          unit=S4_W05_A2C1D_CONSUMPTION_UNDO_ADMISSION
          permit=docs/v5/FARO_PROTOCOL_WORK_PERMIT.json
          mapfile -t allowed < <(git show "HEAD^:$permit" | jq -r '.paths[]' | sort)
          mapfile -t changed < <(git diff --name-only --no-renames HEAD^ HEAD | sort)
          test "${#allowed[@]}" -eq 3
          diff -u <(printf '%s\n' "${allowed[@]}") <(printf '%s\n' "${changed[@]}")
          args=()
          for p in "${allowed[@]}"; do args+=(--path "$p"); done
          python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$unit" "${args[@]}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for Gradle
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Verify N-016 undo descriptor and N-035 stock consumption remain unchanged
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rows = [line.split('\t') for line in Path('v5/spec/generated/contract-baseline.tsv').read_text().splitlines()]
          for expected in (
              ['operation', 'N-016', 'undo.execute', 'undo-coordinator', 'REALITY_MUTATION', 'BINDABLE'],
              ['operation', 'N-035', 'stock.consume', 'household', 'REALITY_MUTATION', 'BINDABLE'],
          ):
              assert sum(row[:6] == expected for row in rows) == 1, expected
          PY
      - name: Test consumption Undo admission and existing receipt Undo admission regression
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :owner:household:test \
            --tests ar.com.faro.v5.owner.household.api.HouseholdStockConsumptionUndoDevAdmissionTest \
            --tests ar.com.faro.v5.owner.household.api.HouseholdStockUndoDevAdmissionTest
      - name: Verify original JUnit XML 9 new plus 10 old
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          base = Path('v5/owner/household/build/test-results/test')
          for name, expected in (
              ('HouseholdStockConsumptionUndoDevAdmissionTest', 9),
              ('HouseholdStockUndoDevAdmissionTest', 10),
          ):
              report, = base.glob('TEST-*' + name + '.xml')
              suite = ElementTree.parse(report).getroot()
              found = tuple(int(suite.attrib[k]) for k in ('tests','failures','errors','skipped'))
              assert found == (expected,0,0,0), (name,found)
              assert len({case.attrib['name'] for case in suite.findall('testcase')}) == expected
          PY
      - name: Preserve original Undo admission JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-a2c1d-consumption-undo-admission-xml
          if-no-files-found: error
          path: v5/owner/household/build/test-results/test/TEST-*UndoDevAdmissionTest.xml
