name: FARO V5 W01 D1B1C0 Finance9 DEV cutover preflight
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Finance9DevCutoverPreflight.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Finance9DevCutoverPreflightTest.kt"
      - ".github/workflows/faro-v5-s4-w01-d1b1c0-finance9-preflight.yml"
permissions:
  contents: read
concurrency:
  group: faro-w01-d1b1c0-finance9-preflight
  cancel-in-progress: false
jobs:
  finance9-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify READY permit in functional parent
        run: |
          set -euo pipefail
          parent="$RUNNER_TEMP/faro-d1b1c0-parent"
          git worktree add --detach "$parent" HEAD^
          python3 "$parent/scripts/quality/faro-protocol-gate.py" \
            --repo "$parent" --mode preflight \
            --unit S4_W01_D1B1C0_FINANCE9_DEV_CUTOVER_PREFLIGHT \
            --path v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Finance9DevCutoverPreflight.kt \
            --path v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Finance9DevCutoverPreflightTest.kt \
            --path .github/workflows/faro-v5-s4-w01-d1b1c0-finance9-preflight.yml
          git worktree remove "$parent"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run directed DEV preflight tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:generation:test --tests ar.com.faro.v5.generation.FaroV5Finance9DevCutoverPreflightTest
      - name: Verify exact D1B1C0 JUnit report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("v5/store/generation/build/test-results/test") / (
              "TEST-ar.com.faro.v5.generation.FaroV5Finance9DevCutoverPreflightTest.xml"
          )
          suite = ElementTree.parse(report).getroot()
          counts = tuple(int(suite.get(key, "-1")) for key in ("tests", "failures", "errors", "skipped"))
          expected = {
              "sealedNineWithValidatedRestoreIsInformativeAndReadOnly",
              "missingRootIsNotMaterialized",
              "stalePointerAndSameIdAbaAreDenied",
              "activeTargetIsDenied",
              "foreignPathAndDescriptorAreDenied",
              "invalidFormatMarkerIsDenied",
              "schemaEightAndUnknownAreDeniedWithoutMutation",
              "schemaSevenIsDenied",
              "realAndDanglingSidecarsAreDenied",
              "missingWrongPhaseAndCompetingJournalsAreDenied",
              "replayFenceDeniesPreviouslyActivatedTarget",
              "quiescenceFailureDoesNotChangeStageJournalOrPointer",
          }
          names = [case.attrib["name"].removesuffix("()") for case in suite.findall("testcase")]
          if counts != (len(expected), 0, 0, 0) or set(names) != expected or len(names) != len(expected):
              raise SystemExit(f"D1B1C0 unexpected JUnit evidence: {counts}, {names}")
          print(f"D1B1C0_FINANCE9_DEV_PREFLIGHT_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Preserve exact D1B1C0 JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-w01-d1b1c0-finance9-preflight-junit
          path: v5/store/generation/build/test-results/test/TEST-ar.com.faro.v5.generation.FaroV5Finance9DevCutoverPreflightTest.xml
          if-no-files-found: warn
