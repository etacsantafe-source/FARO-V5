name: FARO V5 S3 FBS2 G4 export safety fence directed

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5FiveStoreExportPreparation.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5FiveStoreExportPreparationT2Test.kt"
      - ".github/workflows/faro-v5-s3-fbs2-g4-export-fence-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-fbs2-g4-export-fence
  cancel-in-progress: false

jobs:
  reject-unsupported-g4-before-export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK for Gradle configuration
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Export fence plus existing capture and restore regressions
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:generation:test --tests "ar.com.faro.v5.generation.FaroV5FiveStoreExportPreparationT2Test" --tests "ar.com.faro.v5.generation.FaroV5FiveStoreBackupCaptureT2Test" --tests "ar.com.faro.v5.generation.FaroV5FiveStoreStagedRestoreT2Test"
      - name: Exact JUnit XML for exportability fence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path("v5/store/generation/build/test-results/test")
          for name,count in [("FaroV5FiveStoreExportPreparationT2Test",4),("FaroV5FiveStoreBackupCaptureT2Test",5),("FaroV5FiveStoreStagedRestoreT2Test",7)]:
              found=list(root.glob("TEST-*"+name+".xml"))
              if len(found)!=1:
                  raise SystemExit("G4_EXPORT_FENCE_XML_MISSING "+name)
              totals=tuple(int(ET.parse(found[0]).getroot().attrib.get(k,"-1")) for k in ("tests","failures","errors","skipped"))
              if totals!=(count,0,0,0):
                  raise SystemExit("G4_EXPORT_FENCE_XML_FAIL "+name+" "+str(totals))
              print("G4_EXPORT_FENCE_XML_PASS "+name+" "+str(count)+"/"+str(count))
          PY
