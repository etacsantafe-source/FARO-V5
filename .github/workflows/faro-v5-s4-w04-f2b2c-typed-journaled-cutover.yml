name: FARO V5 W04-F2B2C typed Evidence2 journaled DEV cutover recovery
on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5GenerationStoreGraph.kt"
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household10DevCutoverPreflight.kt"
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household10DevCutoverOwner.kt"
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household10DevCutoverRuntime.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Household10Evidence2CutoverRuntimeTest.kt"
      - ".github/workflows/faro-v5-s4-w04-f2b2c-typed-journaled-cutover.yml"
permissions:
  contents: read
jobs:
  f2b2c-journaled-typed-dev:
    if: contains(github.event.head_commit.message, 'FARO-UNIT:S4_W04_F2B2C_TYPED_JOURNALED_CUTOVER_DEV')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact READY parent and mandatory protocol
        run: |
          set -euo pipefail
          python3 scripts/quality/faro-protocol-gate.py --mode ci --head HEAD
          UNIT=S4_W04_F2B2C_TYPED_JOURNALED_CUTOVER_DEV
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count+1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -ge 1
          test "$count" -le 6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android compile SDK37
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Six SQLite real typed journal CAS recovery tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:generation:test --tests 'ar.com.faro.v5.generation.FaroV5Household10Evidence2CutoverRuntimeTest.t0*'
      - name: Verify JUnit XML six unique real cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports=list(Path("v5/store/generation/build/test-results").rglob(
              "TEST-*FaroV5Household10Evidence2CutoverRuntimeTest.xml"))
          assert len(reports)==1,reports
          root=ET.parse(reports[0]).getroot()
          counts=tuple(int(root.attrib[k]) for k in ("tests","failures","errors","skipped"))
          assert counts==(6,0,0,0),counts
          cases=root.findall(".//testcase")
          assert len(cases)==len({x.attrib.get("name") for x in cases})==6
          assert all(x.attrib.get("name","").startswith("t0") for x in cases)
          assert all(c.find(t) is None for c in cases for t in ("failure","error","skipped"))
          print("FARO_W04_F2B2C_TYPED_JOURNALED_CUTOVER_XML_PASS_6_6")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w04-f2b2c-typed-journal-cutover-xml
          if-no-files-found: warn
          path: v5/store/generation/build/test-results/**/TEST-*FaroV5Household10Evidence2CutoverRuntimeTest.xml
