name: FARO V5 W05-A2C1C stock consumption DEV Review Apply

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5GenerationStoreGraph.kt
      - v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W05StockConsumptionDevApplyHost.kt
      - v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W05StockConsumptionDevApplyHostTest.kt
      - .github/workflows/faro-v5-s4-w05-a2c1c-consume-apply-host.yml

permissions:
  contents: read

jobs:
  consumption-review-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preflight exact four routes on parent permit
        shell: bash
        run: |
          set -euo pipefail
          unit=S4_W05_A2C1C_STOCK_CONSUMPTION_REVIEW_APPLY_HOST
          permit=docs/v5/FARO_PROTOCOL_WORK_PERMIT.json
          test "$(git show HEAD^:"$permit" | jq -r '.status')" = READY
          test "$(git show HEAD^:"$permit" | jq '.paths | length')" -eq 4
          diff -u <(printf '%s\n' \
            'v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5GenerationStoreGraph.kt' \
            'v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W05StockConsumptionDevApplyHost.kt' \
            'v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W05StockConsumptionDevApplyHostTest.kt' \
            '.github/workflows/faro-v5-s4-w05-a2c1c-consume-apply-host.yml' | sort) \
            <(git diff --name-only --no-renames HEAD^ HEAD | sort)
          python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ \
            --unit "$unit" \
            --path v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5GenerationStoreGraph.kt \
            --path v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W05StockConsumptionDevApplyHost.kt \
            --path v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W05StockConsumptionDevApplyHostTest.kt \
            --path .github/workflows/faro-v5-s4-w05-a2c1c-consume-apply-host.yml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android compile platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Execute real SQL15 DEV Review Apply host tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache \
            -Pkotlin.compiler.execution.strategy=in-process \
            "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false \
            :app:testV2CoreDevUnitTest --tests ar.com.faro.v5.app.S4W05StockConsumptionDevApplyHostTest
      - name: Verify original five JUnit XML cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          root=Path('v5/app/build/test-results/testV2CoreDevUnitTest')
          paths=list(root.glob('TEST-*S4W05StockConsumptionDevApplyHostTest.xml'))
          assert len(paths)==1, paths
          suite=ElementTree.parse(paths[0]).getroot()
          actual=tuple(int(suite.attrib[k]) for k in ('tests','failures','errors','skipped'))
          assert actual==(5,0,0,0), actual
          names=[case.attrib['name'] for case in suite.findall('testcase')]
          assert len(set(names))==5, names
          PY
      - name: Preserve authentic JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-a2c1c-consumption-review-apply-xml
          if-no-files-found: error
          path: v5/app/build/test-results/testV2CoreDevUnitTest/TEST-*S4W05StockConsumptionDevApplyHostTest.xml
