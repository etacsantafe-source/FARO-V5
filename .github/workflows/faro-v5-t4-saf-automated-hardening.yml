name: FARO V5 T4 SAF hardened automated regression
on:
  push:
    branches: [work/t4-saf-automated-hardening-20261101]
    paths:
      - ".github/workflows/faro-v5-t4-saf-automated-hardening.yml"
permissions:
  contents: read
concurrency:
  group: faro-v5-t4-saf-auto-v1
  cancel-in-progress: false
jobs:
  t4-jvm-and-android-gates:
    if: github.repository == 'etacsantafe-source/FARO-V5'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify branch isolation, scope, V2 OFF
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 67f816b81a9c2ae7979b05448e38dff18ad5498c HEAD
          while read -r f; do
            case "$f" in
              docs/t4/*|.github/workflows/faro-v5-t4-saf-automated-hardening.yml|v5/app/src/debug/kotlin/ar/com/faro/v5/app/FaroV5T4SafIntegralActivity.kt|v5/app/src/debug/kotlin/ar/com/faro/v5/app/FaroV5T4SyntheticCleanup.kt|v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5T4SyntheticCleanupTest.kt|v5/app/src/androidTest/kotlin/ar/com/faro/v5/app/FaroV5T4SafHardeningInstrumentationTest.kt) ;;
              *) echo "UNAUTHORIZED_FUNCTIONAL_DIFF: $f"; exit 1 ;;
            esac
          done < <(git diff --name-only 67f816b81a9c2ae7979b05448e38dff18ad5498c HEAD)
          grep -q 'const val V2_ACTIVE_ENABLED: Boolean = false' v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5HostCertification.kt
          grep -q 'FaroV5T4SyntheticCleanup.deleteOrphans' v5/app/src/debug/kotlin/ar/com/faro/v5/app/FaroV5T4SafIntegralActivity.kt
          grep -q 'workspace == expected.workspace' v5/app/src/debug/kotlin/ar/com/faro/v5/app/FaroV5T4SafIntegralActivity.kt
          grep -q 'expected.fourStore.commercialEvidence.records.size == 1' v5/app/src/debug/kotlin/ar/com/faro/v5/app/FaroV5T4SafIntegralActivity.kt
          grep -q 'expected.fourStore.webEvidence.fetchRecords.size == 1' v5/app/src/debug/kotlin/ar/com/faro/v5/app/FaroV5T4SafIntegralActivity.kt
          grep -q 'expected.fourStore.auxiliary.notices.size == 1' v5/app/src/debug/kotlin/ar/com/faro/v5/app/FaroV5T4SafIntegralActivity.kt
          ! git diff --name-only 67f816b81a9c2ae7979b05448e38dff18ad5498c HEAD | grep -E '^v5/.*/src/main/'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 37 compile platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: JVM post-picker and orphan cleanup tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:testDebugUnitTest \
            --tests ar.com.faro.v5.app.FaroV5T4PostPickerGateTest \
            --tests ar.com.faro.v5.app.FaroV5T4SyntheticCleanupTest \
            -PfaroP6PhysicalApplicationId=ar.com.faro.alpha.t4saf5
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected={'FaroV5T4PostPickerGateTest':4, 'FaroV5T4SyntheticCleanupTest':3}
          for cls,count in expected.items():
              xml=list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*'+cls+'.xml'))
              assert len(xml)==1,xml
              node=ET.parse(xml[0]).getroot()
              assert (int(node.get('tests','0')),int(node.get('failures','0')),int(node.get('errors','0')),int(node.get('skipped','0')))==(count,0,0,0),node.attrib
              print(cls,'PASS',count)
          PY
      - name: Enable KVM for emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo KVM_UNAVAILABLE; fi
      - name: Emulator F2 F3 and T4 Activity lifecycle regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cd v5 && ./gradlew -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:connectedDebugAndroidTest -PfaroP6PhysicalApplicationId=ar.com.faro.alpha.t4saf5 -Pandroid.testInstrumentationRunnerArguments.class=ar.com.faro.v5.app.FaroV5F2IsolatedActivationRecoveryInstrumentationTest,ar.com.faro.v5.app.FaroV5F3SafConsentInstrumentationTest,ar.com.faro.v5.app.FaroV5F3QuarantinedSafRoundTripInstrumentationTest,ar.com.faro.v5.app.FaroV5T4SafHardeningInstrumentationTest
      - name: Exact Android XML oracle (not a physical human picker)
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected={
              'FaroV5F2IsolatedActivationRecoveryInstrumentationTest':5,
              'FaroV5F3SafConsentInstrumentationTest':6,
              'FaroV5F3QuarantinedSafRoundTripInstrumentationTest':8,
              'FaroV5T4SafHardeningInstrumentationTest':6,
          }
          counts={name:0 for name in expected}
          seen=set()
          for file in Path('v5/app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'):
              for case in ET.parse(file).getroot().iter('testcase'):
                  cls=case.get('classname','').split('.')[-1]
                  if cls not in counts: continue
                  key=(cls,case.get('name',''))
                  if key in seen: raise SystemExit(f'DUPLICATE_CASE {key}')
                  seen.add(key)
                  counts[cls]+=1
                  if any(case.find(k) is not None for k in ('failure','error','skipped')):
                      raise SystemExit(f'FAILED_CASE {key} in {file}')
          if counts!=expected: raise SystemExit(f'WRONG_CASE_COUNT: {counts}, expected {expected}')
          print('T4_F2_F3_ANDROID_AUTOMATED_PASS 25/25')
          print('SAF native picker human consent: NOT RUN; real F3 production gate: NOT CERTIFIED')
          PY
