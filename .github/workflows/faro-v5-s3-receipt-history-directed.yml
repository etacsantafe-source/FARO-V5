name: FARO V5 S3 Reality receipt history directed

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/reality/**"
      - ".github/workflows/faro-v5-s3-receipt-history-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-receipt-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reality-receipt-history:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android compile platform for Gradle configuration
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run Reality receipt query/backup regressions
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:reality:test --tests "ar.com.faro.v5.store.reality.RealityBackupFilteringT2Test" --tests "ar.com.faro.v5.store.reality.RealityFinanceActivityReadT2Test"
      - name: Check FBS1 and FBS2 timed receipt backup regressions
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :maintenance:test --tests "ar.com.faro.v5.maintenance.SemanticBackupRestoreT2Test" :store:generation:test --tests "ar.com.faro.v5.generation.FaroV5FiveStoreSemanticCodecT2Test"
      - name: Verify exact Reality receipt JUnit XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base = Path('v5/store/reality/build/test-results/test')
          xmls = sorted(base.glob('TEST-*RealityBackupFilteringT2Test.xml'))
          if len(xmls) != 1:
              raise SystemExit(f'S3_REALITY_XML_MISSING {len(xmls)}')
          root = ET.parse(xmls[0]).getroot()
          counts = tuple(int(root.attrib.get(k, '-1')) for k in ('tests','failures','errors','skipped'))
          if counts != (3, 0, 0, 0):
              raise SystemExit(f'S3_REALITY_XML_FAIL {counts}')
          print('S3_REALITY_RECEIPT_XML_PASS 3/3')
          activity = sorted(base.glob('TEST-*RealityFinanceActivityReadT2Test.xml'))
          if len(activity) != 1:
              raise SystemExit(f'S3_FINANCE_ACTIVITY_XML_MISSING {len(activity)}')
          activity_root = ET.parse(activity[0]).getroot()
          counts = tuple(int(activity_root.attrib.get(k, '-1')) for k in ('tests','failures','errors','skipped'))
          if counts != (3,0,0,0):
              raise SystemExit(f'S3_FINANCE_ACTIVITY_XML_FAIL {counts}')
          print('S3_FINANCE_ACTIVITY_XML_PASS 3/3')
          checks = [
              ('v5/maintenance/build/test-results/test/TEST-ar.com.faro.v5.maintenance.SemanticBackupRestoreT2Test.xml', 4, 'FBS1_RESTORE'),
              ('v5/store/generation/build/test-results/test/TEST-ar.com.faro.v5.generation.FaroV5FiveStoreSemanticCodecT2Test.xml', 7, 'FBS2_SEMANTIC'),
          ]
          for path, expected, label in checks:
              xml = Path(path)
              if not xml.is_file():
                  raise SystemExit(f'S3_{label}_XML_MISSING')
              counts = tuple(int(ET.parse(xml).getroot().attrib.get(k, '-1'))
                             for k in ('tests','failures','errors','skipped'))
              if counts != (expected,0,0,0):
                  raise SystemExit(f'S3_{label}_XML_FAIL {counts}')
              print(f'S3_{label}_XML_PASS {expected}/{expected}')
          PY
