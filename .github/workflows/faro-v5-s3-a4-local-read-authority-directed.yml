name: FARO V5 S3 A4 local single-install read authority core

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5LocalInstallReadAuthority.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5LocalInstallReadAuthorityT2Test.kt"
      - ".github/workflows/faro-v5-s3-a4-local-read-authority-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-a4-local-install-read-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-install-read:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK compile platform
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Compile and run new scoped T2 only
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:compileDebugKotlin :app:testDebugUnitTest --tests "ar.com.faro.v5.app.FaroV5LocalInstallReadAuthorityT2Test"
      - name: Verify exact JUnit XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          base=Path('v5/app/build/test-results/testDebugUnitTest')
          matches=list(base.glob('TEST-*FaroV5LocalInstallReadAuthorityT2Test.xml'))
          if len(matches)!=1: raise SystemExit('S3_A4_LOCAL_READ_XML_MISSING')
          root=ET.parse(matches[0]).getroot()
          values=tuple(int(root.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
          if values!=(10,0,0,0): raise SystemExit('S3_A4_LOCAL_READ_XML_FAIL '+str(values))
          print('S3_A4_LOCAL_INSTALL_READ_POLICY_XML_PASS 10/10')
          PY
