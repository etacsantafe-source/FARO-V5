name: FARO V5 S3 A4 N031 three owner real due federation

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5N031ThreeOwnerDueHostBinding.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5N031ThreeOwnerDueHostBindingT2Test.kt"
      - ".github/workflows/faro-v5-s3-a4-n031-three-owner-due-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-a4-n031-three-owner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  n031-three-owner-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android compile SDK
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Compile and execute only NEW three-owner real SQL integration test
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:compileDebugKotlin :app:testDebugUnitTest --tests "ar.com.faro.v5.app.FaroV5N031ThreeOwnerDueHostBindingT2Test"
      - name: Verify exact eight fresh JUnit cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          base=Path('v5/app/build/test-results/testDebugUnitTest')
          files=list(base.glob('TEST-*FaroV5N031ThreeOwnerDueHostBindingT2Test.xml'))
          if len(files)!=1: raise SystemExit('S3_A4_N031_THREE_OWNER_XML_MISSING')
          root=ET.parse(files[0]).getroot()
          vals=tuple(int(root.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
          if vals!=(8,0,0,0): raise SystemExit('S3_A4_N031_THREE_OWNER_XML_FAIL '+str(vals))
          print('S3_A4_N031_THREE_OWNER_REAL_SQLITE_XML_PASS 8/8')
          PY
