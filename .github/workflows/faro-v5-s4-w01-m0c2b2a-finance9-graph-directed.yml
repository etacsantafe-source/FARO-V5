name: FARO V5 S4 W01-M0C2B2A Finance9 staged five-store graph
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityStore.kt"
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5GenerationStoreGraph.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Finance9StageGraphAdmissionTest.kt"
      - ".github/workflows/faro-v5-s4-w01-m0c2b2a-finance9-graph-directed.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faro-v5-s4-w01-m0c2b2a
  cancel-in-progress: false
jobs:
  stage-finance9-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run exactly six stage9 graph admission tests
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:generation:test --tests "ar.com.faro.v5.generation.FaroV5Finance9StageGraphAdmissionTest"
      - name: Assert exactly six JUnit XML cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path("v5/store/generation/build/test-results/test").glob("TEST-*FaroV5Finance9StageGraphAdmissionTest.xml"))
          if len(files)!=1: raise SystemExit("W01_M0C2B2A_XML_MISSING "+str(len(files)))
          node=ET.parse(files[0]).getroot()
          counts=tuple(int(node.get(k,"-1")) for k in ("tests","failures","errors","skipped"))
          expected={
              "sealedNineGraphReadsFiveOwnersAndExistingG4PlanningSnapshots",
              "historicalDefaultSevenAndPlanningEightOpenersRefuseFinanceNine",
              "stagedEightNeverMigratesSilentlyFromFinanceNineGraphOpener",
              "forgedGenerationDescriptorAndDirectoryAreRejectedBeforeOpening",
              "activeTargetAndStalePointerSequenceCannotOpenFinanceNine",
              "uncheckpointedSidecarAndForeignFinanceColumnFailClosed",
          }
          names=[(c.get("name") or "").removesuffix("()") for c in node.findall("testcase")]
          if counts!=(6,0,0,0) or len(names)!=6 or set(names)!=expected:
              raise SystemExit("W01_M0C2B2A_XML_FAIL "+str((counts,names)))
          print("S4_W01_M0C2B2A_FINANCE9_STAGED_GRAPH_PASS 6/6")
          print("NOT_CERTIFIED: complete FBS2v4 capture/restore, cross-process ACL, Android, G15, shipping")
          PY
      - name: Preserve exact M0C2B2A JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-v5-w01-m0c2b2a-stage9-graph-junit
          path: v5/store/generation/build/test-results/test/TEST-*FaroV5Finance9StageGraphAdmissionTest.xml
          if-no-files-found: warn
