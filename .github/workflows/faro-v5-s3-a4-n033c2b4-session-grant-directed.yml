name: FARO V5 S3 A4 N033C2B4 local scoped Planning8 grant owner

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      # Kotlin owner/test changes now run the newer 44-test directed workflow.
      # This historical regression is retained for YAML revisions/manual checks.
      - ".github/workflows/faro-v5-s3-a4-n033c2b4-session-grant-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-a4-n033c2b4-scoped-grant-owner
  cancel-in-progress: false

jobs:
  session-object-grant:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK for directed JVM tests
        run: |
          set -eu
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run scoped object grants and three historical review and search suites
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:testDebugUnitTest --tests "ar.com.faro.v5.app.FaroV5Planning8ObjectGrantOwnerT2Test" --tests "ar.com.faro.v5.app.FaroV5Planning8ApprovedObjectGateT2Test" --tests "ar.com.faro.v5.app.FaroV5ActiveWorkspaceSearchGrantOwnerTest" --tests "ar.com.faro.v5.app.FaroV5ChatToReviewedApplyFlowT2Test"
      - name: Verify updated exact JUnit XML 18 plus 14 plus 10 plus 2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          directory=Path('v5/app/build/test-results/testDebugUnitTest')
          expected={
            'FaroV5Planning8ObjectGrantOwnerT2Test':18,
            'FaroV5Planning8ApprovedObjectGateT2Test':14,
            'FaroV5ActiveWorkspaceSearchGrantOwnerTest':10,
            'FaroV5ChatToReviewedApplyFlowT2Test':2,
          }
          total=0
          for name,n in expected.items():
              files=list(directory.glob('TEST-*'+name+'.xml'))
              if len(files)!=1:
                  raise SystemExit('N033C2B4_GRANT_XML_MISSING '+name)
              root=ET.parse(files[0]).getroot()
              actual=tuple(int(root.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
              if actual!=(n,0,0,0):
                  raise SystemExit('N033C2B4_GRANT_XML_FAIL '+name+' '+str(actual))
              print('N033C2B4_GRANT_XML_PASS '+name+' '+str(n)+'/'+str(n))
              total+=n
          if total!=44:
              raise SystemExit('N033C2B4_GRANT_TOTAL_BAD '+str(total))
          print('N033C2B4_SESSION_OBJECT_GRANT_PASS 44/44')
          PY
