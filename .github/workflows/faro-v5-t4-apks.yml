name: FARO V5 T4 APKs from frozen F1-F4 source

on:
  push:
    branches:
      - work/faro-t4-build-20261101
    paths:
      - .github/workflows/faro-v5-t4-apks.yml

permissions:
  contents: read

concurrency:
  group: faro-v5-t4-apks-once
  cancel-in-progress: false

jobs:
  build-t4-apks:
    if: github.repository == 'etacsantafe-source/FARO-V5'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
    steps:
      - name: Checkout isolated T4 build branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Verify exact frozen functional source and workflow-only delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = "0750ee530703141016c6cd59a5312758d915ad1c"
          test "$(git diff --name-only 0750ee530703141016c6cd59a5312758d915ad1c HEAD)" = ".github/workflows/faro-v5-t4-apks.yml"
          echo "SOURCE_SHA=0750ee530703141016c6cd59a5312758d915ad1c" >> "$GITHUB_ENV"
          echo "T4_DEBUG_ONLY_NO_RELEASE_SIGNATURE"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 37 and build tools 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build debug application and isolated Android instrumentation APKs
        working-directory: v5
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify and package BOTH APKs with identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t4-apks
          APP="v5/app/build/outputs/apk/debug/app-debug.apk"
          TEST="v5/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -s "$APP"
          test -s "$TEST"
          cp "$APP" t4-apks/FARO-V5-T4-app-debug.apk
          cp "$TEST" t4-apks/FARO-V5-T4-androidTest-debug.apk
          {
            echo "FARO_V5_T4_BUILD"
            echo "functional_source_sha=$SOURCE_SHA"
            echo "workflow_commit_sha=$GITHUB_SHA"
            echo "v2_active_enabled=false (must remain disabled at runtime)"
            echo "debug_only=true"
            echo "production_install_allowed=false"
            echo "application_id_expected=ar.com.faro.alpha.v5dev"
            echo "Android Test APK is an instrumentation runner, not a standalone app"
            echo
            echo "APK_SHA256:"
            sha256sum t4-apks/*.apk
            echo
            echo "APP_PACKAGE_VERSION:"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APP" | head -n 4
            echo
            echo "APP_SIGNING:"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APP"
            echo
            echo "TEST_SIGNING:"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$TEST"
          } | tee t4-apks/T4_APK_MANIFEST.txt
          grep -q "package: name='ar.com.faro.alpha.v5dev'" t4-apks/T4_APK_MANIFEST.txt
      - name: Publish one T4 paired APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FARO-V5-T4-F1-F4-paired-APKs
          path: t4-apks/
          if-no-files-found: error
          retention-days: 7
