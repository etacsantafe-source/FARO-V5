name: FARO V5 G5 Android real OS directed

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/androidTest/kotlin/ar/com/faro/v5/app/FaroV5G5AndroidHostIntegrationTest.kt"
      - ".github/workflows/faro-v5-g5-android-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-g5-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  g5-android-four-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Android SDK 37 for AGP compilation
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Assemble isolated V2 DEV and G5 instrumentation APKs
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            -PfaroG5AndroidTestV2CoreDev=true \
            :app:assembleV2CoreDev :app:assembleV2CoreDevAndroidTest
          test "$(find app/build/outputs/apk/v2CoreDev -name '*.apk' | wc -l)" -eq 1
          test "$(find app/build/outputs/apk/androidTest/v2CoreDev -name '*.apk' | wc -l)" -eq 1
          echo "G5_ANDROID_INSTRUMENTATION_COMPILED"
      - name: Enable Android VM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android API 35 real OS G5 host and security
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            APP="$(find v5/app/build/outputs/apk/v2CoreDev -type f -name '*.apk' -print -quit)"
            TEST="$(find v5/app/build/outputs/apk/androidTest/v2CoreDev -type f -name '*.apk' -print -quit)"
            test -n "$APP" && test -n "$TEST"
            adb install "$APP"
            adb install "$TEST"
            set +e
            OUT="$(adb shell am instrument -w -r -e class ar.com.faro.v5.app.FaroV5G5AndroidHostIntegrationTest ar.com.faro.alpha.v2coredev.test/androidx.test.runner.AndroidJUnitRunner 2>&1)"
            RC=$?
            set -e
            printf '%s\n' "$OUT"
            test "$RC" -eq 0
            echo "$OUT" | grep -F "OK (1 test)"
            echo "$OUT" | grep -F "INSTRUMENTATION_CODE: -1"
            echo "G5_ANDROID_REAL_OS_FOUR_OWNER_PASS 1/1"
