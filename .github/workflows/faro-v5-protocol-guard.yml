name: FARO V5 mandatory seven-block protocol guard

on:
  push:
    branches:
      - work/s3-night-20261102
  pull_request:
    branches:
      - work/s3-night-20261102
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-protocol-${{ github.ref }}
  cancel-in-progress: false

jobs:
  protocol-guard:
    name: seven-block-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Self-test fail-closed protocol gate (14 cases)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/quality -p 'test_faro_protocol_gate.py' -v
      - name: Enforce B1-B5 evidence before each functional commit and B7 before next
        run: |
          set -euo pipefail
          python3 scripts/quality/faro-protocol-gate.py --mode ci --baseline 197e68bc1d9c52917a9066a27e6a0fa235a28217 --head HEAD
      - name: Verify exact READY permit preflight on GitHub checkout
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess

          # The permission for a code commit lives in its parent. The history
          # gate above checks HEAD; the preflight checks the authorization base.
          changed = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
              text=True,
          ).splitlines()
          functional = any(
              path.startswith("v5/")
              or path.startswith("scripts/v5/")
              or (path.startswith(".github/workflows/")
                  and path != ".github/workflows/faro-v5-protocol-guard.yml")
              for path in changed
          )
          revision = "HEAD^" if functional else "HEAD"
          permit = json.loads(subprocess.check_output(
              ["git", "show", revision + ":docs/v5/FARO_PROTOCOL_WORK_PERMIT.json"],
              text=True,
          ))
          status = permit.get("status")
          if status == "BLOCKED":
              print("FARO_PROTOCOL_PREFLIGHT_BLOCKED_EXPECTED", revision)
          elif status == "READY":
              command = [
                  "python3", "scripts/quality/faro-protocol-gate.py",
                  "--mode", "preflight", "--head", revision,
                  "--unit", permit["unit_id"],
              ]
              for path in permit["paths"]:
                  command.extend(["--path", path])
              subprocess.run(command, check=True)
          else:
              raise SystemExit("FARO_PROTOCOL_PREFLIGHT_STOP unknown permit status")
          PY
