name: FARO V5 S3 A4 scoped transactional authorization hook

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/kernel/apply/src/main/kotlin/ar/com/faro/v5/kernel/apply/ApplyTransactionExecutor.kt"
      - "v5/kernel/apply/src/test/kotlin/ar/com/faro/v5/kernel/apply/ApplyTransactionExecutorTest.kt"
      - ".github/workflows/faro-v5-s3-a4-n033c2b4-txn-hook-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transaction-authorization-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Scoped ApplyTransactionExecutor JVM regression
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :kernel:apply:test --tests 'ar.com.faro.v5.kernel.apply.ApplyTransactionExecutorTest'
      - name: Check exact JUnit XML and zero failures/skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          folder=Path('v5/kernel/apply/build/test-results/test')
          files=list(folder.glob('TEST-*ApplyTransactionExecutorTest.xml'))
          if len(files)!=1: raise SystemExit('A4_TXN_HOOK_XML_MISSING')
          root=ET.parse(files[0]).getroot()
          state=tuple(int(root.get(x,'-1')) for x in ('tests','failures','errors','skipped'))
          if state!=(13,0,0,0): raise SystemExit('A4_TXN_HOOK_XML_FAIL '+str(state))
          print('A4_TXN_HOOK_XML_PASS 13/13')
          PY
