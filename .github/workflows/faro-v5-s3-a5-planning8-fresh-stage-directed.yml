name: FARO V5 S3 A5 fresh quarantined Planning8 stage directed

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5WorkspaceV2StageOwner.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5WorkspaceV2Planning8StageOwnerT2Test.kt"
      - ".github/workflows/faro-v5-s3-a5-planning8-fresh-stage-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-a5-fresh-stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fresh-staged-eight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform for Gradle configuration
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Five new real SQLite STAGED8 ownership tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:generation:test --tests "ar.com.faro.v5.generation.FaroV5WorkspaceV2Planning8StageOwnerT2Test"
      - name: Verify exact five JUnit XML cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          folder=Path('v5/store/generation/build/test-results/test')
          found=list(folder.glob('TEST-*FaroV5WorkspaceV2Planning8StageOwnerT2Test.xml'))
          if len(found)!=1: raise SystemExit('S3_A5_FRESH_STAGE8_XML_MISSING')
          root=ET.parse(found[0]).getroot()
          vals=tuple(int(root.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
          if vals!=(5,0,0,0): raise SystemExit('S3_A5_FRESH_STAGE8_XML_RED '+str(vals))
          print('S3_A5_FRESH_STAGE8_REAL_SQLITE_XML_PASS 5/5')
          PY
