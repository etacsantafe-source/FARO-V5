name: FARO V5 S3 N031 private planning section codec directed

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/generation/build.gradle.kts"
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5PlanningDomainSemanticCodec.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5PlanningDomainSemanticCodecTest.kt"
      - ".github/workflows/faro-v5-s3-n031-planning-codec-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-n031-private-planning-codec
  cancel-in-progress: false

jobs:
  planning-section-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK for multi-project Gradle
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Verify new standalone codec and old FBS2 G4/legacy codecs
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:generation:test --tests "ar.com.faro.v5.generation.FaroV5PlanningDomainSemanticCodecTest" --tests "ar.com.faro.v5.generation.FaroV5Fbs2G4CodecTest" --tests "ar.com.faro.v5.generation.FaroV5FiveStoreSemanticCodecT2Test"
      - name: Require exact JUnit XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path('v5/store/generation/build/test-results/test')
          cases=[('FaroV5PlanningDomainSemanticCodecTest',6),('FaroV5Fbs2G4CodecTest',5),('FaroV5FiveStoreSemanticCodecT2Test',7)]
          for name,num in cases:
              matches=list(root.glob('TEST-*'+name+'.xml'))
              if len(matches)!=1:
                  raise SystemExit('N031_PLANNING_CODEC_XML_MISSING '+name)
              result=ET.parse(matches[0]).getroot()
              observed=tuple(int(result.attrib.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
              if observed!=(num,0,0,0):
                  raise SystemExit('N031_PLANNING_CODEC_XML_FAIL '+name+' '+str(observed))
              print('N031_PLANNING_CODEC_XML_PASS '+name+' '+str(num)+'/'+str(num))
          print('N031_PRIVATE_PLANNING_CODEC_ONLY_PASS 18/18')
          PY
