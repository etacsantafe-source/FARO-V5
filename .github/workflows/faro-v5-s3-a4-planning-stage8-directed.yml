name: FARO V5 S3 A4 Planning Reality8 stage-only full FBS2v3 recovery

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/reality/build.gradle.kts"
      - "v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityPlanningBackupPort.kt"
      - "v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityDomainBackupPort.kt"
      - "v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityStore.kt"
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5GenerationStoreGraph.kt"
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5FiveStoreBackupCapture.kt"
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5FiveStoreStagedRestore.kt"
      - "v5/store/reality/src/test/kotlin/ar/com/faro/v5/store/reality/RealityPlanningStage8BackupT2Test.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Fbs2V3PlanningStageT2Test.kt"
      - ".github/workflows/faro-v5-s3-a4-planning-stage8-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-a4-planning-stage8
  cancel-in-progress: false

jobs:
  planning-stage8-full-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK for multi-project configuration
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Native SQLite stage8 migrations owners and FBS2v3 exact replay
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:reality:test --tests "ar.com.faro.v5.store.reality.RealityPlanningStage8BackupT2Test" --tests "ar.com.faro.v5.store.reality.RealityG4DomainRestoreT2Test" :store:generation:test --tests "ar.com.faro.v5.generation.FaroV5Fbs2V3PlanningStageT2Test" --tests "ar.com.faro.v5.generation.FaroV5Fbs2V3PlanningEnvelopeTest" --tests "ar.com.faro.v5.generation.FaroV5Fbs2G4StagedRestoreT2Test" --tests "ar.com.faro.v5.generation.FaroV5GenerationStoreGraphV2T2Test"
      - name: Verify real JUnit XML, no skipped or implicit empty tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          classes=[
            ('v5/store/reality/build/test-results/test','RealityPlanningStage8BackupT2Test',7),
            ('v5/store/reality/build/test-results/test','RealityG4DomainRestoreT2Test',5),
            ('v5/store/generation/build/test-results/test','FaroV5Fbs2V3PlanningStageT2Test',6),
            ('v5/store/generation/build/test-results/test','FaroV5Fbs2V3PlanningEnvelopeTest',6),
            ('v5/store/generation/build/test-results/test','FaroV5Fbs2G4StagedRestoreT2Test',7),
            ('v5/store/generation/build/test-results/test','FaroV5GenerationStoreGraphV2T2Test',17),
          ]
          total=0
          for folder,klass,n in classes:
            paths=list(Path(folder).glob('TEST-*'+klass+'.xml'))
            if len(paths)!=1: raise SystemExit('PLANNING8_XML_MISSING '+klass)
            root=ET.parse(paths[0]).getroot()
            actual=tuple(int(root.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
            if actual!=(n,0,0,0): raise SystemExit('PLANNING8_XML_FAIL '+klass+' '+str(actual))
            print('PLANNING8_XML_PASS '+klass+' '+str(n)+'/'+str(n))
            total+=n
          if total!=48: raise SystemExit('PLANNING8_XML_WRONG_TOTAL '+str(total))
          print('PLANNING8_STAGE_ONLY_FBS2V3_CAPTURE_RESTORE_PASS 48/48')
          PY
