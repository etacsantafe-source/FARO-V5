name: FARO V5 W01 F2 integrated Finance Android API35
on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - 'v5/app/src/v2CoreDev/kotlin/ar/com/faro/v5/app/FaroV5V2CoreDevAuthority.kt'
      - 'v5/app/src/v2CoreDev/kotlin/ar/com/faro/v5/app/S4W01F2FinanceSessionActions.kt'
      - 'v5/app/src/w01FinanceDev/kotlin/ar/com/faro/v5/app/FaroV5W01FinanceDevActivities.kt'
      - 'v5/app/src/w01FinanceDev/kotlin/ar/com/faro/v5/app/FaroV5W01FinanceForms.kt'
      - 'v5/app/src/w01AndroidTest/kotlin/ar/com/faro/v5/app/S4W01FinanceIntegratedAndroidTest.kt'
      - '.github/workflows/faro-v5-s4-w01-f2-finance-integration-android.yml'
permissions:
  contents: read
jobs:
  android-w01-finance-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate FARO protocol for this checkout
        run: python3 scripts/quality/faro-protocol-gate.py --mode ci --head HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 37 for project compile
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Allow KVM where present
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Validate W01 Finance9 on Android API35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 600
          script: >-
            adb shell settings put system font_scale 2.0 &&
            cd v5 && ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache
            -Pkotlin.compiler.execution.strategy=in-process
            "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
            -PfaroW01AndroidTest=true
            -Pandroid.testInstrumentationRunnerArguments.class=ar.com.faro.v5.app.S4W01FinanceIntegratedAndroidTest
            :app:connectedW01FinanceDevAndroidTest
      - name: Verify exact Android JUnit XML
        run: |
          python3 - <<'PY_TEST'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          reports = list(Path("v5/app/build/outputs/androidTest-results").rglob("TEST-*.xml"))
          cases = [case for path in reports for case in ET.parse(path).getroot().iter("testcase")]
          expected = {
              "nativeFinanceRecordsAccountsMovementTransferAndBudgetAndReopensReceipts",
          }
          assert len(cases) == 1 and {case.get("name") for case in cases} == expected
          assert all(case.get("classname") == "ar.com.faro.v5.app.S4W01FinanceIntegratedAndroidTest"
                     and all(case.find(tag) is None for tag in ("failure", "error", "skipped"))
                     for case in cases)
          print("W01_F2_ANDROID_API35_INTEGRATED_FINANCE_PASS")
          PY_TEST
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w01-f2-finance-android-junit
          path: v5/app/build/outputs/androidTest-results/**/TEST-*.xml
          if-no-files-found: error
