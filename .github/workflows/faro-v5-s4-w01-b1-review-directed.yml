name: FARO V5 S4 W01-B1 Finance canonical DEV Workspace Review
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W01B1FinanceReviewHost.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W01B1FinanceReviewHostTest.kt"
      - ".github/workflows/faro-v5-s4-w01-b1-review-directed.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faro-v5-s4-w01-b1
  cancel-in-progress: false
jobs:
  w01-b1-dev-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android compile SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Run 7 exact DEV Workspace Review cases
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:testDebugUnitTest --tests "ar.com.faro.v5.app.S4W01B1FinanceReviewHostTest"
      - name: Verify exact 7-case JUnit XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          found=list(Path("v5/app/build/test-results/testDebugUnitTest").glob("TEST-*S4W01B1FinanceReviewHostTest.xml"))
          if len(found)!=1: raise SystemExit("W01_B1_XML_MISSING "+str(len(found)))
          root=ET.parse(found[0]).getroot()
          counts=tuple(int(root.get(k,"-1")) for k in ("tests","failures","errors","skipped"))
          expected={
              "approvedHumanClickCreatesPendingReviewOnly",
              "deniedForegroundRequestNeverCreatesReview",
              "generationOrHostRevocationDeniesWithoutWrite",
              "staleFinanceSnapshotRejectsBeforeReview",
              "repeatSameIntentReturnsOnePendingReview",
              "sameIntentDifferentPayloadFailsClosed",
              "workspaceRevisionAndChatSelectionAreRechecked",
          }
          names=[(x.get("name") or "").removesuffix("()") for x in root.findall("testcase")]
          if counts!=(7,0,0,0) or len(names)!=7 or set(names)!=expected:
              raise SystemExit("W01_B1_XML_FAIL "+str((counts,names)))
          print("S4_W01_B1_WORKSPACE_PENDING_REVIEW_XML_PASS 7/7")
          print("NOT_CERTIFIED: Android human identity, Finance Apply/receipt, production, C/D/E")
          PY
      - name: Retain exact W01-B1 XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-v5-s4-w01-b1-junit
          path: v5/app/build/test-results/testDebugUnitTest/TEST-*S4W01B1FinanceReviewHostTest.xml
          if-no-files-found: warn
