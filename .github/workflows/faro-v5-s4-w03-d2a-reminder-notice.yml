name: FARO V5 W03-D2A Local Reminder Notice Auxiliary

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/auxiliary/src/main/kotlin/ar/com/faro/v5/store/auxiliary/AuxiliaryDeliveryStore.kt
      - v5/store/auxiliary/src/test/kotlin/ar/com/faro/v5/store/auxiliary/S4W03AuxiliaryReminderLocalNoticeTest.kt
      - v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W03ReminderNoticeReconcileHost.kt
      - v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W03ReminderNoticeReconcileHostTest.kt
      - .github/workflows/faro-v5-s4-w03-d2a-reminder-notice.yml

permissions:
  contents: read

jobs:
  w03-d2a-local-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preflight exact W03-D2A permitted paths
        run: |
          set -euo pipefail
          unit=S4_W03_D2A_SOURCE_TO_AUX_LOCAL_NOTICE
          count=0
          while IFS= read -r p; do
            test -n "$p"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$unit" --path "$p"
            count=$((count + 1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -ge 1 && test "$count" -le 5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK for app JVM compilation
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Test Auxiliary SQLite local Notice route and failure recovery
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:auxiliary:test \
            --tests ar.com.faro.v5.store.auxiliary.S4W03AuxiliaryReminderLocalNoticeTest
      - name: Test active Finance9 Reminder to Auxiliary DEV host
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :app:testDebugUnitTest \
            --tests ar.com.faro.v5.app.S4W03ReminderNoticeReconcileHostTest
      - name: Verify 9 of 9 JUnit XML and zero omitted
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          targets=[
              (Path('v5/store/auxiliary/build/test-results'),
               'S4W03AuxiliaryReminderLocalNoticeTest',5),
              (Path('v5/app/build/test-results'),
               'S4W03ReminderNoticeReconcileHostTest',4),
          ]
          for root,cls,n in targets:
              reports=list(root.rglob('TEST-*'+cls+'.xml'))
              assert len(reports)==1,(cls,reports)
              suite=ElementTree.parse(reports[0]).getroot()
              values=tuple(int(suite.attrib[k]) for k in
                  ('tests','failures','errors','skipped'))
              assert values==(n,0,0,0),(cls,values)
              print(cls,n,'PASS')
          print('W03_D2A_AUX_LOCAL_NOTICE_XML_PASS 9/9')
          PY
      - name: Upload exact directed JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w03-d2a-aux-local-notice-xml
          if-no-files-found: error
          path: |
            v5/store/auxiliary/build/test-results/**/TEST-*S4W03AuxiliaryReminderLocalNoticeTest.xml
            v5/app/build/test-results/**/TEST-*S4W03ReminderNoticeReconcileHostTest.xml
