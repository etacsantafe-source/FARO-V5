name: FARO V5 W01 B3B1B1B1B1B1B DEV private Android invalidation
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/build.gradle.kts"
      - "v5/app/src/v2CoreDev/AndroidManifest.xml"
      - "v5/app/src/w01FinanceDev/AndroidManifest.xml"
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W01FinanceReadPrivateInvalidationProvider.kt"
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W01FinanceReadPrivateInvalidation.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W01FinanceReadPrivateInvalidationTest.kt"
      - ".github/workflows/faro-v5-s4-w01-b3b1b1b1b1b1b-private-invalidation.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faro-w01-b3b1b1b1b1b1b-private-android-invalidation
  cancel-in-progress: false
jobs:
  private-invalidation:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'FARO-UNIT:S4_W01_B3B1B1B1B1B1B_ANDROID_PRIVATE_INVALIDATION_DEV')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify same-unit RED_FIX READY in parent exact4
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/faro-redfix-parent" HEAD^
          python3 "$RUNNER_TEMP/faro-redfix-parent/scripts/quality/faro-protocol-gate.py" \
            --repo "$RUNNER_TEMP/faro-redfix-parent" --mode preflight \
            --unit "S4_W01_B3B1B1B1B1B1B_ANDROID_PRIVATE_INVALIDATION_DEV" \
            --path "v5/app/build.gradle.kts" \
            --path "v5/app/src/v2CoreDev/AndroidManifest.xml" \
            --path "v5/app/src/w01FinanceDev/AndroidManifest.xml" \
            --path ".github/workflows/faro-v5-s4-w01-b3b1b1b1b1b1b-private-invalidation.yml"
          git worktree remove "$RUNNER_TEMP/faro-redfix-parent"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify 8 JVM tests and compile two isolated DEV variants
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache \
            :app:testDebugUnitTest --tests "ar.com.faro.v5.app.S4W01FinanceReadPrivateInvalidationTest"
          ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache \
            :app:compileV2CoreDevKotlin :app:processV2CoreDevMainManifest :app:processV2CoreDevManifestForPackage
          ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache \
            :app:compileW01FinanceDevKotlin :app:processW01FinanceDevMainManifest :app:processW01FinanceDevManifestForPackage
      - name: Verify test XML plus both merged and packaged manifests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          tests=list(Path("v5/app/build/test-results/testDebugUnitTest").glob("TEST-*S4W01FinanceReadPrivateInvalidationTest.xml"))
          if len(tests)!=1: raise SystemExit("W01_RED_FIX_JUNIT_MISSING")
          xml=ET.parse(tests[0]).getroot()
          vals=tuple(int(xml.get(k,"-1")) for k in ("tests","failures","errors","skipped"))
          if vals!=(8,0,0,0): raise SystemExit("W01_RED_FIX_JUNIT_RED "+str(vals))
          expected={"i01BeforeRegistrationNeverInvalidates","i02RegistrationClearsBeforeAnyRead",
            "i03NoticeTriggersAnotherClearNotPermission","i04CloseRejectsLateCallback",
            "i05FailingRegistrationClearPermanentlyPoisons",
            "i06FailedLaterNoticePermanentlyPoisons",
            "i07DoubleRegistrationDoesNotCreateNewSession",
            "i08CloseIdempotentAndCannotResurrect"}
          actual={n.get("name","").removesuffix("()") for n in xml.findall("testcase")}
          if actual!=expected: raise SystemExit("W01_RED_FIX_WRONG_TESTS "+str(actual))
          ns="{http://schemas.android.com/apk/res/android}"
          base=Path("v5/app/build/intermediates")
          expectedProvider="ar.com.faro.v5.app.S4W01FinanceReadPrivateInvalidationProvider"
          for variant,expectedPackage,count in [
            ("v2CoreDev","ar.com.faro.alpha.v2coredev",0),
            ("w01FinanceDev","ar.com.faro.alpha.w01financedev",1)]:
            for family in ("merged_manifest","packaged_manifests"):
              matches=sorted(p for p in base.rglob("AndroidManifest.xml")
                if family in str(p) and ("/"+variant+"/") in str(p))
              if not matches: raise SystemExit("W01_RED_FIX_MISSING_MANIFEST "+variant+" "+family)
              for path in matches:
                root=ET.parse(path).getroot()
                application=root.find("application")
                if application is None: raise SystemExit("W01_RED_FIX_NO_APPLICATION "+str(path))
                providers=application.findall("provider")
                if len(providers)!=count:
                  raise SystemExit("W01_RED_FIX_WRONG_PROVIDER_COUNT "+variant+" "+str(path)+" "+str(len(providers)))
                if any(x.get(ns+"name")=="android.permission.INTERNET" for x in root.findall("uses-permission")):
                  raise SystemExit("W01_RED_FIX_INTERNET "+variant+" "+str(path))
                if variant=="w01FinanceDev":
                  provider=providers[0]
                  if provider.get(ns+"name")!=expectedProvider or provider.get(ns+"exported")!="false" or provider.get(ns+"grantUriPermissions")!="false" or provider.get(ns+"authorities")!=expectedPackage+".finance9read":
                    raise SystemExit("W01_RED_FIX_BAD_PROVIDER "+str(path))
                if family=="packaged_manifests" and root.get("package")!=expectedPackage:
                  raise SystemExit("W01_RED_FIX_APP_ID "+variant+" "+str(path)+" "+str(root.get("package")))
          v2=Path("v5/app/src/v2CoreDev/AndroidManifest.xml").read_text()
          w01=Path("v5/app/src/w01FinanceDev/AndroidManifest.xml").read_text()
          main=Path("v5/app/src/main/AndroidManifest.xml").read_text()
          product=Path("v5/app/src/main/java/ar/com/faro/v5/app/FaroV5CompositionRoot.java").read_text()
          if expectedProvider in v2 or expectedProvider not in w01 or expectedProvider in main or expectedProvider in product:
            raise SystemExit("W01_RED_FIX_PROVIDER_DECLARED_OUTSIDE_ISOLATED_VARIANT")
          print("W01_RED_FIX_JVM_8_OF_8_PASS")
          print("V2_CORE_ZERO_PROVIDERS_PRESERVED")
          print("W01_FINANCE_DEV_ONE_PRIVATE_PROVIDER_OFFLINE")
          print("NO_SQL_COMMIT_PUBLISHER_OR_ANDROID_TWO_PID_CERTIFIED")
          PY
      - name: Keep exact JUnit8 XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-v5-w01-b3b1b1b1b1b1b-redfix-junit
          path: v5/app/build/test-results/testDebugUnitTest/TEST-*S4W01FinanceReadPrivateInvalidationTest.xml
          if-no-files-found: warn
