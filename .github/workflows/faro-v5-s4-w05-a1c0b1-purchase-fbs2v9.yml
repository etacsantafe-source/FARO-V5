name: FARO V5 W05-A1C0B1 FBS2v9 Authenticated Purchases

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household12Fbs2Codec.kt
      - v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Household12Fbs2CodecTest.kt
      - .github/workflows/faro-v5-s4-w05-a1c0b1-purchase-fbs2v9.yml

permissions:
  contents: read

jobs:
  authenticated-purchases-v9:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact scope and READY parent
        shell: bash
        run: |
          set -euo pipefail
          unit=S4_W05_A1C0B1_PURCHASE_FBS2V9_AUTHENTICATED_CODEC_DEV
          permit=docs/v5/FARO_PROTOCOL_WORK_PERMIT.json
          mapfile -t permitted < <(git show "HEAD^:$permit" | jq -r '.paths[]' | sort)
          mapfile -t changed < <(git diff --name-only --no-renames HEAD^ HEAD | sort)
          test "${#permitted[@]}" -eq 4
          for route in "${changed[@]}"; do
            grep -Fxq "$route" <(printf '%s\n' "${permitted[@]}")
          done
          for route in "${permitted[@]}"; do
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$unit" --path "$route"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for Gradle
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run ten FBS2v9 tests and ten FBS2v8 regressions
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:generation:test \
            --tests ar.com.faro.v5.generation.FaroV5Household12Fbs2CodecTest \
            --tests ar.com.faro.v5.generation.FaroV5Household11Fbs2CodecTest
      - name: Verify original JUnit XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          root = Path('v5/store/generation/build/test-results/test')
          for version in (11, 12):
              test_class = f'ar.com.faro.v5.generation.FaroV5Household{version}Fbs2CodecTest'
              suite = ElementTree.parse(root / f'TEST-{test_class}.xml').getroot()
              actual = tuple(int(suite.attrib[key]) for key in ('tests', 'failures', 'errors', 'skipped'))
              assert actual == (10, 0, 0, 0), (test_class, actual)
          PY
      - name: Preserve original FBS2v9 and FBS2v8 XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-a1c0b1-fbs2v9-and-v8-xml
          if-no-files-found: error
          path: v5/store/generation/build/test-results/test/TEST-*Fbs2CodecTest.xml
