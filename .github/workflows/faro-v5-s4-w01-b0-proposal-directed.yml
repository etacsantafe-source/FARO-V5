name: FARO V5 S4 W01-B0 canonical Finance proposal JVM
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/owner/finance/src/main/kotlin/ar/com/faro/v5/owner/finance/api/FinanceManualReviewedProposal.kt"
      - "v5/owner/finance/src/test/kotlin/ar/com/faro/v5/owner/finance/FinanceManualReviewedProposalTest.kt"
      - ".github/workflows/faro-v5-s4-w01-b0-proposal-directed.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faro-v5-s4-w01-b0
  cancel-in-progress: false
jobs:
  w01-b0-finance-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK for Gradle configuration
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Test W01-B0 exact 12 JVM cases
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :owner:finance:test --tests "ar.com.faro.v5.owner.finance.FinanceManualReviewedProposalTest"
      - name: Verify 12 JUnit XML methods
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          fs=list(Path("v5/owner/finance/build/test-results/test").glob("TEST-*FinanceManualReviewedProposalTest.xml"))
          if len(fs)!=1: raise SystemExit("W01_B0_XML_MISSING "+str(len(fs)))
          s=ET.parse(fs[0]).getroot()
          counts=tuple(int(s.get(k,"-1")) for k in ("tests","failures","errors","skipped"))
          expected={
              "validAccountProposalIsCanonicalButInert",
              "validEntryProposalPinsFinanceAccountAndRevision",
              "missingCatalogDenies",
              "spoofedCapabilityExecutorOrProfileDenies",
              "internalOnlyOrWrongMetadataVersionDenies",
              "revisionDriftOrChangedCatalogDuringRecheckDenies",
              "forgedAccountPreviewAndDuplicateAccountDenied",
              "missingEntryAccountDeniedWithoutMutation",
              "spoofedEntryCurrencyOrProjectedBalanceDenied",
              "invalidIntentKeysDenied",
              "forgedAmountOrOverflowCannotBePromoted",
              "repeatedIntentIsDeterministicAndSourceIsNeverMutated",
          }
          cases=[(t.get("name") or "").removesuffix("()") for t in s.findall("testcase")]
          if counts!=(12,0,0,0) or len(cases)!=12 or set(cases)!=expected:
              raise SystemExit("W01_B0_XML_FAIL "+str((counts,cases)))
          print("S4_W01_B0_FINANCE_CANONICAL_PROPOSAL_XML_PASS 12/12")
          print("NOT_CERTIFIED: Review creation, Apply, owner grants, financial transactions, Android UI")
          PY
      - name: Retain exact B0 XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-v5-s4-w01-b0-junit
          path: v5/owner/finance/build/test-results/test/TEST-*FinanceManualReviewedProposalTest.xml
          if-no-files-found: warn
