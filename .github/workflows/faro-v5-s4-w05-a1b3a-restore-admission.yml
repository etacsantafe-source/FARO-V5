name: FARO V5 W05-A1B3A Authenticated FBS2v8 Restore Admission

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household11V8RestoreAdmission.kt
      - v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Household11V8RestoreAdmissionTest.kt
      - .github/workflows/faro-v5-s4-w05-a1b3a-restore-admission.yml

permissions:
  contents: read

jobs:
  fbs2v8-restore-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact three-route READY preflight
        shell: bash
        run: |
          set -euo pipefail
          UNIT=S4_W05_A1B3A_AUTHENTICATED_RESTORE_ADMISSION_DEV
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count + 1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -eq 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for Gradle project configuration
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run eight A1B3A read-only admission JUnit tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:generation:test --tests ar.com.faro.v5.generation.FaroV5Household11V8RestoreAdmissionTest
      - name: Verify original JUnit5 XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          matches=list(Path('v5/store/generation/build/test-results/test').glob(
              'TEST-*FaroV5Household11V8RestoreAdmissionTest.xml'))
          assert len(matches)==1, matches
          suite=ElementTree.parse(matches[0]).getroot()
          counts=tuple(int(suite.attrib[k]) for k in ('tests','failures','errors','skipped'))
          assert counts==(8,0,0,0), counts
          print('FARO_W05_A1B3A_FBS2V8_RESTORE_ADMISSION_XML_PASS_8_8')
          PY
      - name: Preserve original JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-a1b3a-fbs2v8-restore-admission-xml
          if-no-files-found: error
          path: v5/store/generation/build/test-results/test/TEST-*FaroV5Household11V8RestoreAdmissionTest.xml
