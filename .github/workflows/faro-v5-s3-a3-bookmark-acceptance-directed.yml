name: FARO V5 S3 A3 Guardados integrated acceptance
on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5BookmarkA3AcceptanceT2Test.kt"
      - "v5/surface/src/test/kotlin/ar/com/faro/v5/surface/FaroV5BookmarkA3UiAcceptanceTest.kt"
      - ".github/workflows/faro-v5-s3-a3-bookmark-acceptance-directed.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faro-v5-a3-bookmark-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bookmark-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK compile platform
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Targeted owner and UI suites
        working-directory: v5
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:testDebugUnitTest --tests '*FaroV5BookmarkA3AcceptanceT2Test' :surface:testDebugUnitTest --tests '*FaroV5BookmarkA3UiAcceptanceTest'
          ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache -Dorg.gradle.jvmargs='-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false :app:assembleV2CoreDev
      - name: Verify exact XML and DEV APK
        run: |
          python3 - <<'PYXML'
          import hashlib,json,os,xml.etree.ElementTree as ET
          from pathlib import Path
          required={'FaroV5BookmarkA3AcceptanceT2Test':9,'FaroV5BookmarkA3UiAcceptanceTest':2}
          found={}
          for file in Path('v5').glob('**/build/test-results/*/TEST-*.xml'):
              suite=ET.parse(file).getroot()
              counts=tuple(int(suite.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
              assert counts[0]>0 and counts[1:]==(0,0,0),(str(file),counts)
              name=suite.get('name').split('.')[-1]
              assert name not in found,('duplicate',name)
              found[name]=counts[0]
          assert found==required,(found,required)
          apks=list(Path('v5/app/build/outputs/apk').glob('**/*v2CoreDev*.apk'))
          assert len(apks)==1,apks
          import subprocess
          sdk=Path(os.environ['ANDROID_HOME'])/'build-tools'/'36.0.0'
          package=subprocess.check_output([str(sdk/'aapt2'),'dump','packagename',str(apks[0])],text=True).strip()
          assert package=='ar.com.faro.alpha.v2coredev',package
          badging=subprocess.check_output([str(sdk/'aapt2'),'dump','badging',str(apks[0])],text=True)
          launchers=[line for line in badging.splitlines() if line.startswith('launchable-activity:')]
          assert len(launchers)==1 and "name='ar.com.faro.v5.app.FaroV5V2CoreDevActivity'" in launchers[0],launchers
          permissions=subprocess.check_output([str(sdk/'aapt2'),'dump','permissions',str(apks[0])],text=True)
          assert 'uses-permission' not in permissions.lower(),permissions
          subprocess.run([str(sdk/'apksigner'),'verify',str(apks[0])],check=True)
          proof={'package':package,'permissions':'NONE','launcher':'ar.com.faro.v5.app.FaroV5V2CoreDevActivity','sha':os.environ['GITHUB_SHA'],'suites':found,'total':sum(found.values()),'apk':str(apks[0]),'apk_sha256':hashlib.sha256(apks[0].read_bytes()).hexdigest()}
          Path('m05-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          print('S3_A3_ACCEPTANCE_PASS',json.dumps(proof))
          PYXML
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardados-acceptance-evidence
          path: |
            v5/**/build/test-results/**/TEST-*.xml
            v5/app/build/outputs/apk/**/*.apk
            m05-proof.json
