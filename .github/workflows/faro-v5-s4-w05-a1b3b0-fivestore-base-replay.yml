name: FARO V5 W05-A1B3B0 Authenticated Five-Store Base Replay

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5FiveStoreStagedRestore.kt
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household11V8BaseReplay.kt
      - v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Household11V8BaseReplayTest.kt
      - .github/workflows/faro-v5-s4-w05-a1b3b0-fivestore-base-replay.yml

permissions:
  contents: read

jobs:
  v8-five-owner-base:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preflight exact four W05-A1B3B0 paths
        shell: bash
        run: |
          set -euo pipefail
          UNIT=S4_W05_A1B3B0_FBS2V8_FIVE_STORE_BASE_REPLAY_DEV
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count + 1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          [[ "$count" -eq 4 || "$count" -eq 2 ]]
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for Gradle project configuration
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run eight W05-A1B3B0 JUnit5 targeted tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:generation:test --tests ar.com.faro.v5.generation.FaroV5Household11V8BaseReplayTest
      - name: Inspect original eight-case JUnit XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          files=list(Path('v5/store/generation/build/test-results/test').glob(
            'TEST-*FaroV5Household11V8BaseReplayTest.xml'))
          assert len(files)==1, files
          suite=ElementTree.parse(files[0]).getroot()
          counts=tuple(int(suite.attrib[k]) for k in ('tests','failures','errors','skipped'))
          assert counts==(8,0,0,0), counts
          print('FARO_W05_A1B3B0_FIVESTORE_BASE_REPLAY_XML_PASS_8_8')
          PY
      - name: Upload original XML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-a1b3b0-fbs2v8-fivestore-base-replay-xml
          if-no-files-found: error
          path: v5/store/generation/build/test-results/test/TEST-*FaroV5Household11V8BaseReplayTest.xml
