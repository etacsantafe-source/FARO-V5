name: FARO V5 S3 A5.7 X08 real owner interruption and ABA Android API35 directed

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/g5AndroidTest/kotlin/ar/com/faro/v5/app/FaroV5S3A57X08OwnerInterruptionUiTest.kt"
      - ".github/workflows/faro-v5-s3-a5-7-x08-owner-interruption-android-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-a5-7-x08-owner-interruption-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x08-owner-interruption:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK 37
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Compile isolated offline V2 DEV application and Android test
        working-directory: v5
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1800 \
            ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache \
              -Pkotlin.compiler.execution.strategy=in-process \
              "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
              -PfaroG5AndroidTestV2CoreDev=true \
              :app:assembleV2CoreDev :app:assembleV2CoreDevAndroidTest
          test "$(find app/build/outputs/apk/v2CoreDev -name '*.apk' | wc -l)" -eq 1
          test "$(find app/build/outputs/apk/androidTest/v2CoreDev -name '*.apk' | wc -l)" -eq 1
      - name: Inspect APK identities, offline manifest and signatures
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APP="$(find v5/app/build/outputs/apk/v2CoreDev -type f -name '*.apk' -print -quit)"
          TEST="$(find v5/app/build/outputs/apk/androidTest/v2CoreDev -type f -name '*.apk' -print -quit)"
          "$AAPT" dump badging "$APP" > x08-owner-dev-badging.txt
          "$AAPT" dump badging "$TEST" > x08-owner-test-badging.txt
          grep -Fq "package: name='ar.com.faro.alpha.v2coredev'" x08-owner-dev-badging.txt
          grep -Fq "package: name='ar.com.faro.alpha.v2coredev.test'" x08-owner-test-badging.txt
          "$AAPT" dump permissions "$APP" > x08-owner-dev-permissions.txt
          if grep -Fq 'android.permission.INTERNET' x08-owner-dev-permissions.txt; then exit 1; fi
          "$AAPT" dump xmltree "$APP" AndroidManifest.xml > x08-owner-dev-manifest.txt
          if grep -Fq 'FaroV5X03U02IsolatedAiActivity' x08-owner-dev-manifest.txt; then exit 1; fi
          "$SIGNER" verify --print-certs "$APP"
          "$SIGNER" verify --print-certs "$TEST"
          sha256sum "$APP" "$TEST" > x08-owner-apk-sha256.txt
          echo "${{ github.sha }}" > x08-owner-source-sha.txt
      - name: Enable emulator VM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run only X08 source interruption and ABA tests on offline API35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 600
          script: >-
            bash -euo pipefail -c '
            APP="$(find v5/app/build/outputs/apk/v2CoreDev -type f -name "*.apk" -print -quit)";
            TEST="$(find v5/app/build/outputs/apk/androidTest/v2CoreDev -type f -name "*.apk" -print -quit)";
            test -n "$APP" && test -n "$TEST";
            adb install "$APP";
            adb install "$TEST";
            adb shell svc wifi disable;
            adb shell svc data disable;
            OUT="$(adb shell am instrument -w -r -e class ar.com.faro.v5.app.FaroV5S3A57X08OwnerInterruptionUiTest ar.com.faro.alpha.v2coredev.test/androidx.test.runner.AndroidJUnitRunner 2>&1)" || { printf "%s\n" "$OUT" | tee x08-owner-android-instrumentation.log; exit 1; };
            printf "%s\n" "$OUT" | tee x08-owner-android-instrumentation.log;
            printf "%s\n" "$OUT" | grep -Fq "OK (3 tests)";
            printf "%s\n" "$OUT" | grep -Fq "INSTRUMENTATION_CODE: -1";
            echo "S3_A5_7_X08_OWNER_INTERRUPTION_ABA_PASS 3/3"
            '
      - name: Verify actual instrumentation events and produce traceable JUnit XML
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          result = Path("x08-owner-android-instrumentation.log").read_text()
          expected = {"x08FinanceGrantRevokedAfterCanonicalReadYieldsPartial",
                      "x08OwnerClosedAfterSnapshotCannotPublishOrNavigate",
                      "x08DurablePointerABARejectsRealityHitWithoutRegrant"}
          assert "OK (3 tests)" in result
          assert "INSTRUMENTATION_CODE: -1" in result
          assert set(re.findall(r"^INSTRUMENTATION_STATUS: test=(\w+)$", result, re.M)) == expected
          assert len(re.findall(r"^INSTRUMENTATION_STATUS_CODE: 0$", result, re.M)) == 3
          suite = ET.Element("testsuite", name="S3_A5_7_X08_OWNER_INTERRUPTION_ABA_Android_API35",
                             tests="3", failures="0", errors="0", skipped="0")
          # Every named start must have exactly one successful end, no skips/errors.
          events = []
          name = None
          for line in result.splitlines():
              if line.startswith("INSTRUMENTATION_STATUS: test="):
                  name = line.split("=", 1)[1]
              if line.startswith("INSTRUMENTATION_STATUS_CODE:"):
                  events.append((name, int(line.split(":", 1)[1])))
                  name = None
          assert sorted(events) == sorted((n, c) for n in expected for c in (1, 0)), events
          for name in sorted(expected):
              ET.SubElement(suite, "testcase", classname="FaroV5S3A57X08OwnerInterruptionUiTest",
                            name=name)
          ET.ElementTree(suite).write("x08-owner-android-junit.xml",
                                      encoding="utf-8", xml_declaration=True)
          print("S3_A5_7_X08_OWNER_INTERRUPTION_ABA_ANDROID_XML_VERIFIED 3/3")
          PY
      - name: Preserve source SHA, APKs, manifest and verified Android XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-v5-a5-7-x08-real-search-api35-${{ github.sha }}
          path: |
            v5/app/build/outputs/apk/v2CoreDev/*.apk
            v5/app/build/outputs/apk/androidTest/v2CoreDev/*.apk
            x08-owner-android-instrumentation.log
            x08-owner-android-junit.xml
            x08-owner-dev-badging.txt
            x08-owner-test-badging.txt
            x08-owner-dev-permissions.txt
            x08-owner-dev-manifest.txt
            x08-owner-apk-sha256.txt
            x08-owner-source-sha.txt
          if-no-files-found: warn
