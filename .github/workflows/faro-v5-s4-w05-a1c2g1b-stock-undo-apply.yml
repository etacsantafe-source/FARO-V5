name: FARO V5 W05-A1C2G1B Trusted N-016 SQL13 Stock Undo DEV

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W05StockUndoDevApplyHost.kt
      - v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W05StockUndoDevApplyHostTest.kt
      - .github/workflows/faro-v5-s4-w05-a1c2g1b-stock-undo-apply.yml

permissions:
  contents: read

jobs:
  g1b-stock-undo-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact3 B6 paths and READY parent
        shell: bash
        run: |
          set -euo pipefail
          unit=S4_W05_A1C2G1B_TRUSTED_STOCK_UNDO_APPLY
          permit=docs/v5/FARO_PROTOCOL_WORK_PERMIT.json
          mapfile -t permitted < <(git show "HEAD^:$permit" | jq -r '.paths[]' | sort)
          mapfile -t changed < <(git diff --name-only --no-renames HEAD^ HEAD | sort)
          test "${#permitted[@]}" -eq 3
          test "${#changed[@]}" -gt 0
          args=()
          for route in "${changed[@]}"; do
            grep -Fxq "$route" <(printf '%s\n' "${permitted[@]}")
          done
          for route in "${permitted[@]}"; do args+=(--path "$route"); done
          python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$unit" "${args[@]}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for Gradle
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Execute stock Undo host 9 tests and N-035 source 8 regressions
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false \
            :app:testDebugUnitTest \
            --tests ar.com.faro.v5.app.S4W05StockUndoDevApplyHostTest \
            --tests ar.com.faro.v5.app.S4W05StockReceiveDevApplyHostTest
      - name: Verify two original JUnit XML files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          root = Path('v5/app/build/test-results')
          for name, expected in (
              ('S4W05StockUndoDevApplyHostTest', 9),
              ('S4W05StockReceiveDevApplyHostTest', 8),
          ):
              matches = list(root.glob('**/TEST-ar.com.faro.v5.app.' + name + '.xml'))
              assert len(matches) == 1, (name, matches)
              suite = ElementTree.parse(matches[0]).getroot()
              observed = tuple(int(suite.attrib[k]) for k in ('tests', 'failures', 'errors', 'skipped'))
              assert observed == (expected, 0, 0, 0), (name, observed)
              assert len(suite.findall('testcase')) == expected, name
          PY
      - name: Preserve JUnit XML originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-a1c2g1b-stock-undo-xml
          if-no-files-found: warn
          path: v5/app/build/test-results/**/TEST-ar.com.faro.v5.app.S4W05Stock*DevApplyHostTest.xml
