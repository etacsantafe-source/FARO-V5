name: FARO V5 W05-A1C4 SQL13 Review verifier DEV

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household13Evidence2DevJournaledCutover.kt
      - v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Household13Evidence2DevJournaledCutoverTest.kt
      - .github/workflows/faro-v5-s4-w05-a1c4-sql13-review-verifier.yml

permissions:
  contents: read

jobs:
  sql13-journaled-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact three routes and READY parent
        shell: bash
        run: |
          set -euo pipefail
          unit=S4_W05_A1C4_SQL13_REVIEW_VERIFIER_DEV
          permit=docs/v5/FARO_PROTOCOL_WORK_PERMIT.json
          mapfile -t permitted < <(git show "HEAD^:$permit" | jq -r '.paths[]' | sort)
          mapfile -t changed < <(git diff --name-only --no-renames HEAD^ HEAD | sort)
          test "${#permitted[@]}" -eq 3
          test "${#changed[@]}" -gt 0
          args=()
          for route in "${changed[@]}"; do
            grep -Fxq "$route" <(printf '%s\n' "${permitted[@]}")
          done
          for route in "${permitted[@]}"; do args+=(--path "$route"); done
          python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$unit" "${args[@]}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for Gradle
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Run authenticated cutover with a committed Review
        working-directory: v5
        run: >
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache
          :store:generation:test
          --tests ar.com.faro.v5.generation.FaroV5Household13Evidence2DevJournaledCutoverTest.keepsVerifiedCommittedReviewThroughAuthorizationRecoveryAndReopen
      - name: Validate original JUnit XML
        run: |
          python3 - <<'XML_CHECK'
          from pathlib import Path
          from xml.etree import ElementTree

          result = Path('v5/store/generation/build/test-results/test')
          files = list(result.glob('TEST-*.xml'))
          assert len(files) == 1, files
          suite = ElementTree.parse(files[0]).getroot()
          assert tuple(int(suite.attrib[k]) for k in ('tests', 'failures', 'errors', 'skipped')) == (1, 0, 0, 0)
          cases = list(suite.iter('testcase'))
          assert len(cases) == 1
          assert cases[0].attrib['name'].removesuffix('()') == 'keepsVerifiedCommittedReviewThroughAuthorizationRecoveryAndReopen'
          assert all(cases[0].find(tag) is None for tag in ('failure', 'error', 'skipped'))
          XML_CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w05-a1c4-sql13-review-verifier-xml
          path: v5/store/generation/build/test-results/test/TEST-*.xml
          if-no-files-found: warn
