name: FARO V5 S3 A4 N033C2B4 real Reality8 transaction host

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/kernel/apply/src/main/kotlin/ar/com/faro/v5/kernel/apply/ReviewedConversationApplyCoordinator.kt"
      - "v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityStore.kt"
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5Planning8ReviewedApplyHost.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5Planning8ReviewedApplyHostT2Test.kt"
      - ".github/workflows/faro-v5-s3-a4-n033c2b4-reality8-transaction-host-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-a4-n033c2b4-reality8-host
  cancel-in-progress: false

jobs:
  reality8-trusted-host:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          set -eu
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: JVM real SQLite Workspace and Reality8 host integration
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:testDebugUnitTest --tests "ar.com.faro.v5.app.FaroV5Planning8ReviewedApplyHostT2Test"
      - name: JVM kernel Apply regressions
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :kernel:apply:test
      - name: Validate exact host XML and all kernel Apply XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          app=Path('v5/app/build/test-results/testDebugUnitTest')
          matches=list(app.glob('TEST-*FaroV5Planning8ReviewedApplyHostT2Test.xml'))
          if len(matches)!=1: raise SystemExit('A4_REALITY8_HOST_XML_MISSING')
          node=ET.parse(matches[0]).getroot()
          observed=tuple(int(node.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
          if observed!=(6,0,0,0): raise SystemExit('A4_REALITY8_HOST_XML_FAIL '+str(observed))
          print('A4_REALITY8_HOST_XML_PASS 6/6')
          kernel=Path('v5/kernel/apply/build/test-results/test')
          files=sorted(kernel.glob('TEST-*.xml'))
          if not files: raise SystemExit('A4_REALITY8_KERNEL_XML_MISSING')
          total=0
          for path in files:
              root=ET.parse(path).getroot()
              values=tuple(int(root.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
              if values[0] <= 0 or any(values[1:]):
                  raise SystemExit('A4_REALITY8_KERNEL_XML_FAIL '+path.name+' '+str(values))
              total+=values[0]
          if total < 13: raise SystemExit('A4_REALITY8_KERNEL_TOTAL_TOO_SMALL '+str(total))
          print('A4_REALITY8_KERNEL_XML_PASS '+str(total)+'/'+str(total))
          print('A4_REALITY8_TRANSACTION_HOST_PASS 6/6 PLUS_KERNEL')
          PY
