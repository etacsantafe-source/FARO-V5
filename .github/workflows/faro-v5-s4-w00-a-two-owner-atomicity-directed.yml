name: FARO V5 S4 W00-A two-owner SQLite feasibility
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/reality/src/test/kotlin/ar/com/faro/v5/store/reality/S4W00TwoOwnerAtomicityFeasibilityTest.kt"
      - ".github/workflows/faro-v5-s4-w00-a-two-owner-atomicity-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s4-w00-a
  cancel-in-progress: false

jobs:
  w00-two-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure Android 37 compile platform for Gradle configuration
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-37.0' 'build-tools;36.0.0'
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Run W00-A real SQLite tests only
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:reality:test --tests "ar.com.faro.v5.store.reality.S4W00TwoOwnerAtomicityFeasibilityTest"
      - name: Verify W00-A exact JUnit XML 5 of 5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base=Path('v5/store/reality/build/test-results/test')
          found=list(base.glob('TEST-*S4W00TwoOwnerAtomicityFeasibilityTest.xml'))
          if len(found)!=1:
              raise SystemExit('S4_W00_A_XML_MISSING '+str(len(found)))
          root=ET.parse(found[0]).getroot()
          counts=tuple(int(root.attrib.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
          expected={
              'twoExistingOwnersCommitInOneSqliteScopeAndSurviveReopen',
              'exceptionAfterFinanceBeforeObjectivesRollsBackFirstOwner',
              'explicitRollbackAfterBothOwnersRevertsBoth',
              'staleSecondOwnerRejectsAndRollsBackNewFinanceWithoutDeletingOldObjective',
              'forbiddenNestedTransactionAfterFinanceRollsBackOuterScope',
          }
          names={v.attrib.get('name') for v in root.findall('testcase')}
          if counts!=(5,0,0,0) or names!=expected:
              raise SystemExit('S4_W00_A_XML_FAIL '+str((counts,names)))
          print('S4_W00_A_SQLITE_REAL_FEASIBILITY_PASS 5/5')
          print('NOT CERTIFIED: two-authority Apply/receipt/recovery; Household+Finance; W06/W07')
          PY
      - name: Save W00-A JUnit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-v5-s4-w00-a-junit
          path: v5/store/reality/build/test-results/test/TEST-*S4W00TwoOwnerAtomicityFeasibilityTest.xml
          if-no-files-found: warn
