name: FARO V5 S3 A4 N033C3 Undo NEW reviewed host Workspace4 Reality8
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5Planning8ApprovedObjectGate.kt"
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5Planning8ReviewedApplyHost.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5Planning8UndoReviewedApplyHostT2Test.kt"
      - ".github/workflows/faro-v5-s3-a4-n033c3-undo-execute-review-host-directed.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: faro-v5-s3-a4-n033c3-undo-reviewed-host
  cancel-in-progress: false

jobs:
  undo-new-human-reviewed-host:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          set -eu
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: NEW human approved Undo and original COMMITTED proof REAL SQLite
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:testDebugUnitTest --tests "ar.com.faro.v5.app.FaroV5Planning8UndoReviewedApplyHostT2Test"
      - name: Strict exact six new host tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path('v5/app/build/test-results/testDebugUnitTest').glob('TEST-*FaroV5Planning8UndoReviewedApplyHostT2Test.xml'))
          if len(files)!=1: raise SystemExit('N033C3_UNDO_HOST_XML_MISSING')
          node=ET.parse(files[0]).getroot()
          values=tuple(int(node.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
          if values!=(6,0,0,0): raise SystemExit('N033C3_UNDO_HOST_XML_FAIL '+str(values))
          print('N033C3_UNDO_NEW_HUMAN_REVIEW_HOST_XML_PASS 6/6')
          PY
