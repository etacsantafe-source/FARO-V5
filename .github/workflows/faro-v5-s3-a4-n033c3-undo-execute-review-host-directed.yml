name: FARO V5 S3 A4 N033C3 Undo NEW reviewed host Workspace4 Reality8
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5Planning8ApprovedObjectGate.kt"
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5Planning8ReviewedApplyHost.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5Planning8UndoReviewedApplyHostT2Test.kt"
      - ".github/workflows/faro-v5-s3-a4-n033c3-undo-execute-review-host-directed.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: faro-v5-s3-a4-n033c3-undo-reviewed-host
  cancel-in-progress: false

jobs:
  undo-new-human-reviewed-host:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          set -eu
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Verify NEW Undo host 6 and existing Planning8 host 12 in same JVM run
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:testDebugUnitTest --tests "ar.com.faro.v5.app.FaroV5Planning8UndoReviewedApplyHostT2Test" --tests "ar.com.faro.v5.app.FaroV5Planning8ReviewedApplyHostT2Test"
      - name: Verify existing kernel Apply regression
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :kernel:apply:test
      - name: Strict NEW 6, old host 12 and kernel Apply 38 XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          app=Path('v5/app/build/test-results/testDebugUnitTest')
          for cls,expected in (
              ('FaroV5Planning8UndoReviewedApplyHostT2Test',6),
              ('FaroV5Planning8ReviewedApplyHostT2Test',12),
          ):
              paths=list(app.glob('TEST-*'+cls+'.xml'))
              if len(paths)!=1: raise SystemExit('N033C3_UNDO_HOST_XML_MISSING '+cls)
              node=ET.parse(paths[0]).getroot()
              values=tuple(int(node.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
              if values!=(expected,0,0,0):
                  raise SystemExit('N033C3_UNDO_HOST_XML_FAIL '+cls+' '+str(values))
              print('N033C3_UNDO_HOST_XML_PASS '+cls+' '+str(expected)+'/'+str(expected))
          directory=Path('v5/kernel/apply/build/test-results/test')
          files=sorted(directory.glob('TEST-*.xml'))
          if not files: raise SystemExit('N033C3_KERNEL_XML_MISSING')
          total=0
          for path in files:
              root=ET.parse(path).getroot()
              values=tuple(int(root.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
              if values[0]<=0 or any(values[1:]):
                  raise SystemExit('N033C3_KERNEL_XML_FAIL '+path.name+' '+str(values))
              total+=values[0]
          if total!=38: raise SystemExit('N033C3_KERNEL_XML_COUNT_FAIL '+str(total))
          print('N033C3_KERNEL_APPLY_XML_PASS 38/38')
          print('N033C3_UNDO_HOST_B7_CANDIDATE_PASS 6+12+38')
          PY
