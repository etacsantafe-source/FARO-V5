name: FARO V5 W05-A2C0C2 SQL15 journaled five-store cutover DEV

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household15Evidence2DevJournaledCutover.kt
      - v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Household15Evidence2DevJournaledCutoverTest.kt
      - .github/workflows/faro-v5-s4-w05-a2c0c2-sql15-journaled-cutover.yml

permissions:
  contents: read

jobs:
  sql15-journaled-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify independent exact3 permit and same-unit RED_FIX subset
        shell: bash
        run: |
          set -euo pipefail
          unit=S4_W05_A2C0C2_SQL15_JOURNALED_FIVESTORE_CUTOVER_DEV
          permit=docs/v5/FARO_PROTOCOL_WORK_PERMIT.json
          mapfile -t allowed < <(git show "HEAD^:$permit" | jq -r '.paths[]' | sort)
          mapfile -t changed < <(git diff --name-only --no-renames HEAD^ HEAD | sort)
          test "${#allowed[@]}" -eq 3
          test "${#changed[@]}" -gt 0
          test -z "$(comm -23 <(printf '%s\n' "${changed[@]}") <(printf '%s\n' "${allowed[@]}"))"
          # A first B6 must change exactly three new paths; RED_FIX can be scoped
          # only after the previous SHA has been explicitly reviewed RED_FIX.
          if [ "${#changed[@]}" -lt 3 ]; then
            test "$(git show HEAD^:docs/v5/FARO_PROTOCOL_WORK_PERMIT.json | jq -r '.last_code_review.result')" = RED_FIX
          fi
          args=()
          for path in "${changed[@]}"; do args+=(--path "$path"); done
          python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$unit" "${args[@]}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for Gradle
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Test journaled SQL15 transition and certified direct dependencies
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:generation:test \
            --tests ar.com.faro.v5.generation.FaroV5Household15Evidence2DevJournaledCutoverTest \
            --tests ar.com.faro.v5.generation.FaroV5Household14Evidence2DevJournaledCutoverTest \
            --tests ar.com.faro.v5.generation.FaroV5Household15V12StagedReplayTest \
            --tests ar.com.faro.v5.generation.FaroV5Household15ActiveDevReadTest
      - name: Verify original JUnit XML exact35 distinct tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          suites = (
              ('FaroV5Household15Evidence2DevJournaledCutoverTest', 9),
              ('FaroV5Household14Evidence2DevJournaledCutoverTest', 6),
              ('FaroV5Household15V12StagedReplayTest', 15),
              ('FaroV5Household15ActiveDevReadTest', 5),
          )
          assert sum(n for _, n in suites) == 35
          all_cases = set()
          for name, count in suites:
              directory = Path('v5/store/generation/build/test-results/test')
              reports = list(directory.glob(f'TEST-*{name}.xml'))
              assert len(reports) == 1, (name, reports)
              suite = ElementTree.parse(reports[0]).getroot()
              values = tuple(int(suite.attrib[key]) for key in ('tests','failures','errors','skipped'))
              assert values == (count,0,0,0), (name,values)
              cases = {(suite.attrib.get('name'), case.attrib['name']) for case in suite.findall('testcase')}
              assert len(cases) == count, (name, len(cases))
              assert not (all_cases & cases), name
              all_cases.update(cases)
          assert len(all_cases) == 35
          PY
      - name: Preserve original cutover and direct-dependency XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-a2c0c2-sql15-journaled-cutover-xml
          if-no-files-found: error
          path: |
            v5/store/generation/build/test-results/test/TEST-*FaroV5Household15Evidence2DevJournaledCutoverTest.xml
            v5/store/generation/build/test-results/test/TEST-*FaroV5Household14Evidence2DevJournaledCutoverTest.xml
            v5/store/generation/build/test-results/test/TEST-*FaroV5Household15V12StagedReplayTest.xml
            v5/store/generation/build/test-results/test/TEST-*FaroV5Household15ActiveDevReadTest.xml
