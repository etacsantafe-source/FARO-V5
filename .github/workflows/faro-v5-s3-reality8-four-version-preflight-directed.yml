name: FARO V5 S3 A4 Reality8 strict four-version SQLite preflight directed

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/StagedSqlitePreflight.kt"
      - "v5/store/reality/src/test/kotlin/ar/com/faro/v5/store/reality/StagedSqliteFourVersionPreflightT2Test.kt"
      - ".github/workflows/faro-v5-s3-reality8-four-version-preflight-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-reality8-four-version-preflight
  cancel-in-progress: false

jobs:
  reality8-strict-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare SDK for multi-project Gradle configuration only
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Four exact SQLite admission profiles and existing v7 graph regression
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:reality:test --tests "ar.com.faro.v5.store.reality.StagedSqliteFourVersionPreflightT2Test" :store:generation:test --tests "ar.com.faro.v5.generation.FaroV5GenerationStoreGraphV2T2Test"
      - name: Assert exact JUnit results and no skipped tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          cases=[
              ('v5/store/reality/build/test-results/test','StagedSqliteFourVersionPreflightT2Test',6),
              ('v5/store/generation/build/test-results/test','FaroV5GenerationStoreGraphV2T2Test',17)
          ]
          for folder, klass, count in cases:
              paths=list(Path(folder).glob('TEST-*'+klass+'.xml'))
              if len(paths)!=1: raise SystemExit('REALITY8_PREFLIGHT_XML_MISSING '+klass)
              x=ET.parse(paths[0]).getroot()
              actual=tuple(int(x.attrib.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
              if actual!=(count,0,0,0):
                  raise SystemExit('REALITY8_PREFLIGHT_XML_FAILURE '+klass+' '+str(actual))
              print('REALITY8_PREFLIGHT_XML_PASS '+klass+' '+str(count)+'/'+str(count))
          print('REALITY8_FOUR_VERSION_PREFLIGHT_ONLY_PASS 23/23')
          PY
