name: FARO V5 V1.4 F3 SAF directed

on:
  push:
    branches:
      - work/cierre-noche-v14-20261031
    paths:
      - "v5/platform/android/**"
      - "v5/app/**"
      - ".github/workflows/faro-v5-v14-f3-saf-directed.yml"

permissions:
  contents: read

concurrency:
  group: faro-v5-v14-f3-saf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  f3-saf-android-directed:
    if: github.repository == 'etacsantafe-source/FARO-V5'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 37 compile platform
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo KVM_UNAVAILABLE; fi
      - name: F3 SAF truncation and consent instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cd v5 && ./gradlew -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ar.com.faro.v5.app.FaroV5F3SafConsentInstrumentationTest,ar.com.faro.v5.app.FaroV5F3QuarantinedSafRoundTripInstrumentationTest
      - name: Exact F3 XML oracle
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('v5/app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'))
          matches=[]
          classes=('FaroV5F3SafConsentInstrumentationTest','FaroV5F3QuarantinedSafRoundTripInstrumentationTest')
          for p in files:
              root=ET.parse(p).getroot()
              for case in root.iter('testcase'):
                  if any(n in case.attrib.get('classname','') for n in classes): matches.append((p,case))
          expected={
              'noConsentOrV2CertificationCannotExportOrRestore',
              'invalidPassphrasesRevokeAllConsentBeforeOpeningSaf',
              'credentialsAndConsentAreDiscardedOnActivityRecreation',
              'destroyWipesQueuedOrInFlightBackupPassphrase',
              'fiveOwnerEncryptedQuarantineRoundTripThroughAndroidResolverKeepsV1',
              'restorePreparationCreatesDurableStagedJournalWithOneSharedGate',
              'interruptedRestorePreparationRechecksFiveOwnersAndAdvancesOnlyJournal',
              'journaledFiveStoreRestoreValidatesAuthenticatedOwnersWithoutV1Switch',
              'debugQuarantinedRestoreRequiresConsentWithoutOpeningPicker',
              'mutableContentProviderCannotSwapPinnedAuthenticatedRestoreArchive',
              'forgedRestoreIdentityCannotOpenSafWithoutDurableJournal',
          }
          actual={c.attrib.get('name') for _,c in matches}
          if len(matches)!=11 or actual!=expected: raise SystemExit(f'F3_V14_MISSING_OR_DUPLICATE_XML count={len(matches)} names={actual}')
          for p,c in matches:
              if any(c.find(k) is not None for k in ('failure','error','skipped')):
                  raise SystemExit(f'F3_V14_TEST_FAILED {p} {c.attrib.get("name")}')
          print('F3_V14_PINNED_PROVIDER_JOURNAL_PASS 11/11')
          print('Android emulator only; real user SAF picker and T4 physical NOT CERTIFIED')
          PY
