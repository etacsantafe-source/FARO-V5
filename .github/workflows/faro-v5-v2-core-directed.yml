name: FARO V5 V2 core M1 M2 directed

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/build.gradle.kts"
      - "v5/app/src/v2CoreDev/**"
      - "v5/app/src/testV2CoreDev/**"
      - ".github/workflows/faro-v5-v2-core-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-v2-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  v2-core-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK compile platform
        run: |
          set -eu
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Compile isolated V2 build and process both manifests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:processDebugManifestForPackage :app:processV2CoreDevManifestForPackage :app:compileV2CoreDevKotlin
      - name: M2 active five-owner JVM directed tests
        working-directory: v5
        run: |
          # AGP 9 defaults to only the debug UnitTest component. Explicitly enable
          # non-debug unit tests for this isolated CI invocation, not production.
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false :app:testV2CoreDevUnitTest --tests "ar.com.faro.v5.app.FaroV5V2CoreDevAuthorityTest"
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:testDebugUnitTest --tests "ar.com.faro.v5.app.FaroV5T4PostPickerGateTest" --tests "ar.com.faro.v5.app.FaroV5T4SyntheticCleanupTest"
      - name: Verify exact M2 JVM tests
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base=Path("v5/app/build/test-results/testV2CoreDevUnitTest")
          paths=list(base.glob("TEST-*FaroV5V2CoreDevAuthorityTest.xml"))
          if len(paths)!=1: raise SystemExit(f"V2_CORE_M2_TEST_XML_MISSING {len(paths)}")
          root=ET.parse(paths[0]).getroot()
          values=tuple(int(root.get(k,"-1")) for k in ("tests","failures","errors","skipped"))
          if values!=(4,0,0,0): raise SystemExit(f"V2_CORE_M2_TESTS_FAILED {values}")
          print("V2_CORE_M2_M3_LOCAL_CHAT_JVM_PASS 4/4")
          PY
      - name: Verify relocated historical debug-only T4 gate tests
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base=Path("v5/app/build/test-results/testDebugUnitTest")
          for cls,count in (("FaroV5T4PostPickerGateTest",4),("FaroV5T4SyntheticCleanupTest",3)):
              p=base / ("TEST-ar.com.faro.v5.app."+cls+".xml")
              if not p.exists(): raise SystemExit(f"M2_DEBUG_T4_XML_MISSING {cls}")
              r=ET.parse(p).getroot()
              c=tuple(int(r.get(k,"-1")) for k in ("tests","failures","errors","skipped"))
              if c!=(count,0,0,0): raise SystemExit(f"M2_DEBUG_T4_XML_FAIL {cls} {c}")
          print("M2_DEBUG_T4_RELOCATED_XML_PASS 7/7")
          PY
      - name: Verify package isolation, no backup and offline mode
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ns = '{http://schemas.android.com/apk/res/android}'
          base = Path('v5/app/build/intermediates')
          def read(variant):
              # Inspect the packaged output selected for the APK, never a
              # recursive search across merged-manifest intermediates.
              packaged = base / 'packaged_manifests' / variant
              found = sorted(packaged.rglob('AndroidManifest.xml')) if packaged.is_dir() else []
              if len(found) != 1:
                  raise SystemExit(
                      f'V2_CORE_M1_PACKAGED_MANIFEST_COUNT {variant} {len(found)}'
                      f' dir={packaged} candidates={[str(p) for p in found]}'
                  )
              print(f'V2_CORE_M1_PACKAGED_MANIFEST_SELECTED {variant} {found[0]}')
              return ET.parse(found[0]).getroot()
          old = read('debug')
          dev = read('v2CoreDev')
          if old.get('package') != 'ar.com.faro.alpha.v5dev': raise SystemExit('V2_CORE_OLD_ID_CHANGED')
          if dev.get('package') != 'ar.com.faro.alpha.v2coredev': raise SystemExit('V2_CORE_DEV_ID_NOT_ISOLATED')
          app = dev.find('application')
          if app is None or app.get(ns+'allowBackup') != 'false': raise SystemExit('V2_CORE_BACKUP_NOT_DISABLED')
          if 'android.permission.INTERNET' in {e.get(ns+'name') for e in dev.findall('uses-permission')}: raise SystemExit('V2_CORE_NETWORK_GRANTED')
          if app.get(ns+'name') != 'ar.com.faro.v5.app.FaroV5V2CoreDevApplication':
              raise SystemExit('V2_CORE_M2B_SHIPPING_APP_STARTUP_NOT_REPLACED')
          activities=[node.get(ns+'name') for node in app.findall('activity')]
          if activities != ['ar.com.faro.v5.app.FaroV5V2CoreDevActivity']:
              raise SystemExit(f'V2_CORE_M2B_EXTRA_LAUNCHERS {activities}')
          providers={node.get(ns+'name') for node in app.findall('provider')}
          if providers:
              raise SystemExit(f'V2_CORE_M2B_UNEXPECTED_PROVIDERS {sorted(providers)}')
          for tag in ('receiver', 'service', 'activity-alias'):
              extras = sorted(x.get(ns+'name') or '<unnamed>' for x in app.findall(tag))
              if extras:
                  raise SystemExit(f'V2_CORE_M2B_UNEXPECTED_{tag.upper()} {extras}')
          forbidden_os = {'android.permission.POST_NOTIFICATIONS', 'android.permission.SCHEDULE_EXACT_ALARM', 'android.permission.REQUEST_INSTALL_PACKAGES'}
          permissions = {x.get(ns+'name') for x in dev.findall('uses-permission')}
          if permissions & forbidden_os:
              raise SystemExit(f'V2_CORE_M2B_OS_PERMISSIONS_PRESENT {sorted(permissions & forbidden_os)}')
          if 'androidx.startup.InitializationProvider' in providers:
              raise SystemExit('V2_CORE_M2B_STARTUP_PROVIDER_PRESENT')
          launcher=app.find('activity')
          filters=launcher.findall('intent-filter') if launcher is not None else []
          if len(filters)!=1: raise SystemExit('V2_CORE_M2B_LAUNCHER_FILTER_MISSING')
          actions={n.get(ns+'name') for n in filters[0].findall('action')}
          categories={n.get(ns+'name') for n in filters[0].findall('category')}
          if 'android.intent.action.MAIN' not in actions or 'android.intent.category.LAUNCHER' not in categories:
              raise SystemExit('V2_CORE_M2B_LAUNCHER_NOT_MAIN')
          print('V2_CORE_M2B_DEV_APP_ISOLATED_PASS 4/4')
          print('V2_CORE_M1_ISOLATION_PASS 4/4')
          PY
