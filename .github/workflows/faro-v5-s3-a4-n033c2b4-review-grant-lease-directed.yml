name: FARO V5 S3 A4 N033C2B4 exact Review and grant lease bridge

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5Planning8ApprovedObjectGate.kt"
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5Planning8ReviewGrantLeaseBridge.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5Planning8ReviewGrantLeaseBridgeT2Test.kt"
      - ".github/workflows/faro-v5-s3-a4-n033c2b4-review-grant-lease-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-a4-n033c2b4-review-grant-lease
  cancel-in-progress: false

jobs:
  exact-reviewed-grant-lease:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK for JVM Gradle configuration only
        run: |
          set -eu
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Exact canonical approved scope bridge and previous grant/Review suites
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:testDebugUnitTest --tests "ar.com.faro.v5.app.FaroV5Planning8ReviewGrantLeaseBridgeT2Test" --tests "ar.com.faro.v5.app.FaroV5Planning8ObjectGrantOwnerT2Test" --tests "ar.com.faro.v5.app.FaroV5Planning8ApprovedObjectGateT2Test" --tests "ar.com.faro.v5.app.FaroV5ActiveWorkspaceSearchGrantOwnerTest" --tests "ar.com.faro.v5.app.FaroV5ChatToReviewedApplyFlowT2Test"
      - name: Require exact XML 51 tests, zero failed skipped or errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          folder=Path('v5/app/build/test-results/testDebugUnitTest')
          expected={
            'FaroV5Planning8ReviewGrantLeaseBridgeT2Test':7,
            'FaroV5Planning8ObjectGrantOwnerT2Test':18,
            'FaroV5Planning8ApprovedObjectGateT2Test':14,
            'FaroV5ActiveWorkspaceSearchGrantOwnerTest':10,
            'FaroV5ChatToReviewedApplyFlowT2Test':2,
          }
          total=0
          for cls,n in expected.items():
              files=list(folder.glob('TEST-*'+cls+'.xml'))
              if len(files)!=1: raise SystemExit('N033_REVIEW_LEASE_XML_MISSING '+cls)
              root=ET.parse(files[0]).getroot()
              actual=tuple(int(root.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
              if actual!=(n,0,0,0): raise SystemExit('N033_REVIEW_LEASE_XML_FAIL '+cls+' '+str(actual))
              print('N033_REVIEW_LEASE_XML_PASS '+cls+' '+str(n)+'/'+str(n))
              total+=n
          if total!=51: raise SystemExit('N033_REVIEW_LEASE_TOTAL_BAD '+str(total))
          print('N033_REVIEW_GRANT_LEASE_BRIDGE_PASS 51/51')
          PY
