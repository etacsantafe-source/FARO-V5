name: FARO V5 S3 Matter attention policy directed

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/kernel/contracts/src/main/kotlin/ar/com/faro/v5/kernel/contracts/MatterAttentionReadProjection.kt"
      - "v5/kernel/contracts/src/test/kotlin/ar/com/faro/v5/kernel/contracts/MatterAttentionReadProjectionTest.kt"
      - ".github/workflows/faro-v5-s3-matter-attention-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-attention-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attention-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android platform for Gradle configuration
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run N031 matter policy regression
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :kernel:contracts:test --tests "ar.com.faro.v5.kernel.contracts.MatterAttentionReadProjectionTest"
      - name: Verify exact N031 JUnit XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = sorted(Path('v5/kernel/contracts/build/test-results/test').glob('TEST-*MatterAttentionReadProjectionTest.xml'))
          if len(files) != 1:
              raise SystemExit(f'S3_N031_XML_MISSING {len(files)}')
          root = ET.parse(files[0]).getroot()
          values = tuple(int(root.attrib.get(k, '-1')) for k in ('tests', 'failures', 'errors', 'skipped'))
          if values != (4, 0, 0, 0):
              raise SystemExit(f'S3_N031_XML_FAIL {values}')
          print('S3_N031_MATTER_POLICY_XML_PASS 4/4')
          PY
