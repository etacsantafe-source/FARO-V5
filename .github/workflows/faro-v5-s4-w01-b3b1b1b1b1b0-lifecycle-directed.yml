name: FARO V5 W01 B3B1B1B1B1B0 DEV READ host lifecycle
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W01FinanceReadSessionLifecycle.kt"
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W01FinanceReadAuthHost.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W01FinanceReadSessionLifecycleTest.kt"
      - ".github/workflows/faro-v5-s4-w01-b3b1b1b1b1b0-lifecycle-directed.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faro-v5-w01-b3b1b1b1b1b0-dev-lifecycle
  cancel-in-progress: false
jobs:
  dev-read-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact READY preflight at unmodified parent
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/faro-ready-parent" HEAD^
          python3 "$RUNNER_TEMP/faro-ready-parent/scripts/quality/faro-protocol-gate.py" \
            --repo "$RUNNER_TEMP/faro-ready-parent" --mode preflight \
            --unit "S4_W01_B3B1B1B1B1B0_DEV_READ_HOST_LIFECYCLE_ABORT" \
            --path "v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W01FinanceReadSessionLifecycle.kt" \
            --path "v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W01FinanceReadAuthHost.kt" \
            --path "v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W01FinanceReadSessionLifecycleTest.kt" \
            --path ".github/workflows/faro-v5-s4-w01-b3b1b1b1b1b0-lifecycle-directed.yml"
          git worktree remove "$RUNNER_TEMP/faro-ready-parent"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: New eight JVM tests plus Android DEV compile
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache \
            :app:testDebugUnitTest --tests "ar.com.faro.v5.app.S4W01FinanceReadSessionLifecycleTest"
          ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache :app:compileV2CoreDevKotlin
      - name: Exact JUnit and dormant Android host lifecycle wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          base=Path("v5/app/build/test-results/testDebugUnitTest")
          paths=list(base.glob("TEST-*S4W01FinanceReadSessionLifecycleTest.xml"))
          if len(paths)!=1: raise SystemExit("W01_DEV_READ_LIFECYCLE_XML_MISSING")
          root=ET.parse(paths[0]).getroot()
          counters=tuple(int(root.get(k,"-1")) for k in ("tests","failures","errors","skipped"))
          if counters!=(8,0,0,0): raise SystemExit("W01_DEV_READ_LIFECYCLE_XML_RED "+str(counters))
          expected={
            "r01StopClosesAndCallsTerminalOnce",
            "r02DestroyClosesAndCallsTerminalOnce",
            "r03ExplicitCloseDoesNotCallTerminator",
            "r04StopDestroyAndRepeatCannotDuplicateCallback",
            "r05ResumeDoesNotReviveTerminatedSession",
            "r06ConcurrentStopDestroyOnlyOneTerminalCallback",
            "r07TerminatorExceptionStillPoisoned",
            "r08ClosedBeforeLateStopCannotNotifyOrReopen",
          }
          names={e.get("name","").removesuffix("()") for e in root.findall("testcase")}
          if names!=expected: raise SystemExit("W01_DEV_READ_LIFECYCLE_XML_NAMES_RED "+str(names))
          host=Path("v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W01FinanceReadAuthHost.kt").read_text()
          for key in ("LifecycleEventObserver", "Lifecycle.Event.ON_STOP",
                      "Lifecycle.Event.ON_DESTROY", "lifecycleFence.onStop()",
                      "lifecycleFence.onDestroy()", "activity.lifecycle.removeObserver"):
            if key not in host: raise SystemExit("W01_LIFECYCLE_NO_HOST_WIRING "+key)
          product=Path("v5/app/src/main/java/ar/com/faro/v5/app/FaroV5CompositionRoot.java").read_text()
          if "S4W01FinanceReadSessionLifecycle" in product:
            raise SystemExit("W01_READ_LIFECYCLE_PRODUCT_MOUNT")
          print("W01_B3B1B1B1B1B0_LIFECYCLE_JVM_8_OF_8_PASS")
          print("W01_B3B1B1B1B1B0_DEV_ANDROID_COMPILE_AND_WIRING_PASS")
          print("NO_ANDROID_G15_BIOMETRIC_OR_UI_REVOCATION_ATTESTED")
          PY
      - name: Preserve exact JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-v5-w01-b3b1b1b1b1b0-lifecycle-junit
          path: v5/app/build/test-results/testDebugUnitTest/TEST-*S4W01FinanceReadSessionLifecycleTest.xml
          if-no-files-found: warn
