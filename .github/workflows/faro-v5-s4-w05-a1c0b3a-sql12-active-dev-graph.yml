name: FARO V5 W05-A1C0B3A SQL12 Read-Only ACTIVE DEV Graph

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household12ActiveDevReadHost.kt
      - v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Household12ActiveDevGraphTest.kt
      - .github/workflows/faro-v5-s4-w05-a1c0b3a-sql12-active-dev-graph.yml

permissions:
  contents: read

jobs:
  active-sql12-dev-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact scope and READY parent
        shell: bash
        run: |
          set -euo pipefail
          unit=S4_W05_A1C0B3A_SQL12_ACTIVE_DEV_READ_GRAPH
          permit=docs/v5/FARO_PROTOCOL_WORK_PERMIT.json
          mapfile -t permitted < <(git show "HEAD^:$permit" | jq -r '.paths[]' | sort)
          mapfile -t changed < <(git diff --name-only --no-renames HEAD^ HEAD | sort)
          test "${#permitted[@]}" -eq 6
          test "${#changed[@]}" -gt 0
          args=()
          for route in "${changed[@]}"; do
            grep -Fxq "$route" <(printf '%s\n' "${permitted[@]}")
          done
          for route in "${permitted[@]}"; do
            args+=(--path "$route")
          done
          python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$unit" "${args[@]}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for Gradle
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Test SQL12 ACTIVE graph with SQL10 directed regressions
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:generation:test \
            --tests ar.com.faro.v5.generation.FaroV5Household12ActiveDevGraphTest \
            --tests ar.com.faro.v5.generation.FaroV5Household10ActiveGraphTest \
            --tests ar.com.faro.v5.generation.FaroV5Household10Evidence2ActiveReadSessionTest
      - name: Verify original JUnit XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          root = Path('v5/store/generation/build/test-results/test')
          for cls, count in (
              ('FaroV5Household12ActiveDevGraphTest', 8),
              ('FaroV5Household10ActiveGraphTest', 5),
              ('FaroV5Household10Evidence2ActiveReadSessionTest', 6),
          ):
              suite = ElementTree.parse(root / f'TEST-ar.com.faro.v5.generation.{cls}.xml').getroot()
              actual = tuple(int(suite.attrib[k]) for k in ('tests', 'failures', 'errors', 'skipped'))
              assert actual == (count, 0, 0, 0), (cls, actual)
              assert len(suite.findall('testcase')) == count
          PY
      - name: Preserve original graph XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-a1c0b3a-sql12-active-dev-graph-xml
          if-no-files-found: error
          path: |
            v5/store/generation/build/test-results/test/TEST-*ActiveDevGraphTest.xml
            v5/store/generation/build/test-results/test/TEST-*Household10ActiveGraphTest.xml
            v5/store/generation/build/test-results/test/TEST-*Household10Evidence2ActiveReadSessionTest.xml
