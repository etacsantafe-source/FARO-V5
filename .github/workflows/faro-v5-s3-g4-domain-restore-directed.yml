name: FARO V5 S3 G4 domain restore primitive directed

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityDomainBackupPort.kt"
      - "v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityStore.kt"
      - "v5/store/reality/src/test/kotlin/ar/com/faro/v5/store/reality/RealityG4DomainRestoreT2Test.kt"
      - ".github/workflows/faro-v5-s3-g4-domain-restore-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-g4-domain-restore-s3
  cancel-in-progress: false

jobs:
  g4-domain-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android compile platform for Gradle configuration
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: G4 primitive and prior G4 owner unit tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:reality:test --tests "ar.com.faro.v5.store.reality.RealityG4DomainRestoreT2Test" --tests "ar.com.faro.v5.store.reality.RealityDomainOwnersT2Test"
      - name: Verify exact G4 restore and previous owner JUnit XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          base=Path('v5/store/reality/build/test-results/test')
          for name,count in [('RealityG4DomainRestoreT2Test',5),('RealityDomainOwnersT2Test',9)]:
              xmls=list(base.glob('TEST-*'+name+'.xml'))
              if len(xmls)!=1:
                  raise SystemExit('G4_DOMAIN_XML_MISSING '+name+' '+str(len(xmls)))
              node=ET.parse(xmls[0]).getroot()
              counts=tuple(int(node.attrib.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
              if counts!=(count,0,0,0):
                  raise SystemExit('G4_DOMAIN_XML_FAIL '+name+' '+str(counts))
              print('G4_DOMAIN_XML_PASS '+name+' '+str(count)+'/'+str(count))
          PY
