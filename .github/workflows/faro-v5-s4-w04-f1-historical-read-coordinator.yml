name: FARO V5 W04-F1 authorized historical read coordinator JVM DEV
on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W04HistoricalAuthorizedReadCoordinator.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W04HistoricalAuthorizedReadCoordinatorTest.kt"
      - ".github/workflows/faro-v5-s4-w04-f1-historical-read-coordinator.yml"
permissions:
  contents: read
jobs:
  f1-historical-reads:
    if: contains(github.event.head_commit.message, 'FARO-UNIT:S4_W04_F1_AUTHORIZED_HISTORICAL_READ_COORDINATOR_DEV')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce FARO protocol and exact READY parent
        run: |
          set -euo pipefail
          python3 scripts/quality/faro-protocol-gate.py --mode ci --head HEAD
          UNIT=S4_W04_F1_AUTHORIZED_HISTORICAL_READ_COORDINATOR_DEV
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count+1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -ge 1
          test "$count" -le 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android compile SDK 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: F1 JVM tests exact eight
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache
            :app:testDebugUnitTest --tests ar.com.faro.v5.app.S4W04HistoricalAuthorizedReadCoordinatorTest
      - name: Verify XML eight distinct cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path("v5/app/build/test-results").rglob("TEST-*S4W04HistoricalAuthorizedReadCoordinatorTest.xml"))
          assert len(files)==1, files
          suite=ET.parse(files[0]).getroot()
          counts=tuple(int(suite.attrib[k]) for k in ("tests","failures","errors","skipped"))
          assert counts==(8,0,0,0), counts
          cases=suite.findall(".//testcase")
          assert len(cases)==8 and len({c.attrib["name"] for c in cases})==8
          assert all(c.find(x) is None for c in cases for x in ("failure","error","skipped"))
          print("W04_F1_JVM_EXPLICIT_OBSERVATION_8_8_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w04-f1-historical-read-xml
          if-no-files-found: warn
          path: v5/app/build/test-results/**/TEST-*S4W04HistoricalAuthorizedReadCoordinatorTest.xml
