name: FARO V5 S3 A4 N033C3 internal Undo owner cancellation Reality8
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityPlanningStageMutationPort.kt"
      - "v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityStore.kt"
      - "v5/owner/reminders/src/main/kotlin/ar/com/faro/v5/owner/reminders/spi/ReminderPersistencePort.kt"
      - "v5/owner/monthlyplan/src/main/kotlin/ar/com/faro/v5/owner/monthlyplan/spi/MonthlyPlanPersistencePort.kt"
      - "v5/store/reality/src/test/kotlin/ar/com/faro/v5/store/reality/RealityPlanningUndoCancelT2Test.kt"
      - ".github/workflows/faro-v5-s3-a4-n033c3-undo-owner-cancel-directed.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: faro-v5-s3-a4-n033c3-undo-owner-cancel
  cancel-in-progress: false

jobs:
  undo-reality8-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          set -eu
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Real SQLite Undo owner CAS, reversal, receipts and rollback
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:reality:test --tests "ar.com.faro.v5.store.reality.RealityPlanningUndoCancelT2Test"
      - name: Validate exact six Undo owner XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths=list(Path('v5/store/reality/build/test-results/test').glob('TEST-*RealityPlanningUndoCancelT2Test.xml'))
          if len(paths)!=1: raise SystemExit('N033C3_UNDO_SQL_XML_MISSING')
          root=ET.parse(paths[0]).getroot()
          values=tuple(int(root.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
          if values!=(6,0,0,0): raise SystemExit('N033C3_UNDO_SQL_XML_FAIL '+str(values))
          print('N033C3_UNDO_SQL_OWNER_XML_PASS 6/6')
          PY
