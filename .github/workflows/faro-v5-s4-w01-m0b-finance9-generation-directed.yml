name: FARO V5 S4 W01-M0B Finance9 staged generation JVM
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityFinance9StagedFilePort.kt"
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Finance9StagedMigration.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Finance9StagedMigrationTest.kt"
      - ".github/workflows/faro-v5-s4-w01-m0b-finance9-generation-directed.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: faro-v5-s4-w01-m0b
  cancel-in-progress: false
jobs:
  staged-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run directed generation tests
        working-directory: v5
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:generation:test --tests "ar.com.faro.v5.generation.FaroV5Finance9StagedMigrationTest"
      - name: Verify exact seven cases in JUnit XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path("v5/store/generation/build/test-results/test").glob("TEST-*FaroV5Finance9StagedMigrationTest.xml"))
          if len(files)!=1: raise SystemExit("W01_M0B_XML_MISSING "+str(len(files)))
          node=ET.parse(files[0]).getroot()
          counts=tuple(int(node.get(k,"-1")) for k in ("tests","failures","errors","skipped"))
          expected={
              "canonicalSealedEightUpgradesToNineWithoutSwitchingPointer",
              "activeTargetIsRejectedBeforeAnyRealityWrite",
              "forgedDescriptorOrNoncanonicalDirectoryIsRejected",
              "sourceSevenOrUnknownSchemaIsRejectedBeforeMigration",
              "uncheckpointedSidecarIsRejectedBeforeMigration",
              "pointerAbaDuringWindowLeavesUnactivatedNineQuarantined",
              "secondStageNineMigrationIsRejectedWithoutImplicitReapply",
          }
          names=[(x.get("name") or "").removesuffix("()") for x in node.findall("testcase")]
          if counts!=(7,0,0,0) or set(names)!=expected or len(names)!=7:
              raise SystemExit("W01_M0B_XML_FAIL "+str((counts,names)))
          print("S4_W01_M0B_FINANCE9_GENERATION_STAGE_PASS 7/7")
          print("NOT_CERTIFIED: active cutover, backup9, cross-process policy, Android, G15")
          PY
      - name: Preserve M0B exact JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-v5-w01-m0b-generation-junit
          path: v5/store/generation/build/test-results/test/TEST-*FaroV5Finance9StagedMigrationTest.xml
          if-no-files-found: warn
