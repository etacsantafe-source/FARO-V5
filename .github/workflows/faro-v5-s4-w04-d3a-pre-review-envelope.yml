name: FARO V5 W04-D3A commercial pre-review envelope JVM DEV

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/app/src/main/kotlin/ar/com/faro/v5/app/S4W04CommercialPreReviewEnvelope.kt
      - v5/app/src/test/kotlin/ar/com/faro/v5/app/S4W04CommercialPreReviewEnvelopeTest.kt
      - .github/workflows/faro-v5-s4-w04-d3a-pre-review-envelope.yml

permissions:
  contents: read

jobs:
  d3a-pre-review-envelope-dev:
    if: contains(github.event.head_commit.message, 'FARO-UNIT:S4_W04_D3A_PRE_REVIEW_ENVELOPE_DEV')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: D3A per-route protocol preflight against READY parent
        run: |
          set -euo pipefail
          UNIT=S4_W04_D3A_PRE_REVIEW_ENVELOPE_DEV
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count + 1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          # Original B6 changes all three; RED_FIX may change a safe subset.
          test "$count" -ge 1
          test "$count" -le 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK for Gradle configuration
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: D3A commercial pre-review envelope JVM directed
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:testDebugUnitTest --tests ar.com.faro.v5.app.S4W04CommercialPreReviewEnvelopeTest
      - name: Require exactly eight D3A XML testcases zero failure error skip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          reports = list(Path("v5/app/build/test-results").rglob(
              "TEST-*S4W04CommercialPreReviewEnvelopeTest.xml"))
          assert len(reports) == 1, reports
          suite = ElementTree.parse(reports[0]).getroot()
          counts = tuple(int(suite.attrib[k]) for k in ("tests","failures","errors","skipped"))
          assert counts == (8,0,0,0), counts
          cases = suite.findall(".//testcase")
          assert len(cases) == 8 and len(set(c.attrib["name"] for c in cases)) == 8, cases
          assert not suite.findall(".//failure") and not suite.findall(".//error")
          assert not suite.findall(".//skipped")
          print("W04_D3A_PRE_REVIEW_ENVELOPE_JVM_XML_PASS 8/8")
          PY
      - name: Preserve D3A JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-d3a-pre-review-envelope-xml
          if-no-files-found: error
          path: v5/app/build/test-results/**/TEST-*S4W04CommercialPreReviewEnvelopeTest.xml
