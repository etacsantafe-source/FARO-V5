name: FARO V5 S3 A4 N033C2B4 local user request policy

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5Planning8ApprovedObjectGate.kt"
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5Planning8LocalUserRequestPolicy.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5Planning8LocalUserRequestPolicyT2Test.kt"
      - ".github/workflows/faro-v5-s3-a4-n033c2b4-local-user-request-policy-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-a4-n033c2b4-local-request-policy
  cancel-in-progress: false

jobs:
  local-user-request-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK for directed JVM suite
        run: |
          set -eu
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run local request policy plus scope and lease historical suites
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:testDebugUnitTest --tests "ar.com.faro.v5.app.FaroV5Planning8LocalUserRequestPolicyT2Test" --tests "ar.com.faro.v5.app.FaroV5Planning8ReviewGrantLeaseBridgeT2Test" --tests "ar.com.faro.v5.app.FaroV5Planning8ObjectGrantOwnerT2Test" --tests "ar.com.faro.v5.app.FaroV5Planning8ApprovedObjectGateT2Test" --tests "ar.com.faro.v5.app.FaroV5ActiveWorkspaceSearchGrantOwnerTest" --tests "ar.com.faro.v5.app.FaroV5ChatToReviewedApplyFlowT2Test"
      - name: Validate exact JUnit XML with no failure error skip
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          folder=Path('v5/app/build/test-results/testDebugUnitTest')
          expected={
            'FaroV5Planning8LocalUserRequestPolicyT2Test':12,
            'FaroV5Planning8ReviewGrantLeaseBridgeT2Test':7,
            'FaroV5Planning8ObjectGrantOwnerT2Test':18,
            'FaroV5Planning8ApprovedObjectGateT2Test':14,
            'FaroV5ActiveWorkspaceSearchGrantOwnerTest':10,
            'FaroV5ChatToReviewedApplyFlowT2Test':2,
          }
          total=0
          for cls,n in expected.items():
              files=list(folder.glob('TEST-*'+cls+'.xml'))
              if len(files)!=1: raise SystemExit('A4_LOCAL_REQUEST_XML_MISSING '+cls)
              x=ET.parse(files[0]).getroot()
              observed=tuple(int(x.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
              if observed!=(n,0,0,0):
                  raise SystemExit('A4_LOCAL_REQUEST_XML_FAIL '+cls+' '+str(observed))
              print('A4_LOCAL_REQUEST_XML_PASS '+cls+' '+str(n)+'/'+str(n))
              total+=n
          if total!=63: raise SystemExit('A4_LOCAL_REQUEST_TOTAL_BAD '+str(total))
          print('A4_LOCAL_USER_REQUEST_POLICY_PASS 63/63')
          PY
