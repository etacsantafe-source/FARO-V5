name: FARO V5 W04-B1B Household10 needs SQL CAS

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/owner/household/src/main/kotlin/ar/com/faro/v5/owner/household/spi/HouseholdNeedPersistencePort.kt
      - v5/store/reality/build.gradle.kts
      - v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityHouseholdNeedPersistence.kt
      - v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityStore.kt
      - v5/store/reality/src/test/kotlin/ar/com/faro/v5/store/reality/RealityHouseholdNeedPersistenceTest.kt
      - .github/workflows/faro-v5-s4-w04-b1b-needs-sql-cas.yml

permissions:
  contents: read

jobs:
  household10-needs-sql:
    if: contains(github.event.head_commit.message, 'FARO-UNIT:S4_W04_B1B_NEEDS_SQL_CAS_DEV')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: W04-B1B exact-route protocol preflight against parent
        run: |
          set -euo pipefail
          UNIT=S4_W04_B1B_NEEDS_SQL_CAS_DEV
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count + 1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -eq 6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for multi-project Gradle config
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Test Household10 needs persistence on JVM
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:reality:test --tests ar.com.faro.v5.store.reality.RealityHouseholdNeedPersistenceTest
      - name: Verify W04-B1B JUnit XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          directory = Path("v5/store/reality/build/test-results/test")
          reports = list(directory.glob("TEST-*RealityHouseholdNeedPersistenceTest.xml"))
          assert len(reports) == 1, reports
          suite = ElementTree.parse(reports[0]).getroot()
          totals = tuple(int(suite.attrib[k]) for k in ("tests", "failures", "errors", "skipped"))
          assert totals == (6, 0, 0, 0), totals
          print("W04_B1B_NEEDS_SQL_CAS_XML_PASS 6/6")
          PY
      - name: Preserve W04-B1B JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-b1b-household10-needs-sql-cas-xml
          if-no-files-found: error
          path: v5/store/reality/build/test-results/test/TEST-*RealityHouseholdNeedPersistenceTest.xml
