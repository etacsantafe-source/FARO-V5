name: FARO V5 W04-C1b2G five-store STAGED Evidence2 DEV

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5GenerationStoreGraph.kt
      - v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5FiveStoreBackupCaptureT2Test.kt
      - .github/workflows/faro-v5-s4-w04-c1b2g-staged-five-store.yml

permissions:
  contents: read

jobs:
  c1b2g-staged-five-store:
    if: contains(github.event.head_commit.message, 'FARO-UNIT:S4_W04_C1B2G_STAGED_FIVE_STORE_EVIDENCE2_DEV')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: C1b2G exact3 protocol preflight at parent
        run: |
          set -euo pipefail
          UNIT=S4_W04_C1B2G_STAGED_FIVE_STORE_EVIDENCE2_DEV
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count+1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -ge 1
          test "$count" -le 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK for Gradle configuration
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Run five-store staged Evidence2 graph and existing generation JVM regression
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:generation:test
      - name: Verify C1b2G 5 of 5 and unchanged legacy capture 5 of 5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          root = Path('v5/store/generation/build/test-results')
          for classname in ('FaroV5FiveStoreBackupCaptureT2Test', 'FaroV5CommercialEvidence2StageTest'):
              reports = list(root.rglob('TEST-*'+classname+'.xml'))
              assert len(reports) == 1, (classname, reports)
              suite = ElementTree.parse(reports[0]).getroot()
              counts = tuple(int(suite.attrib[k]) for k in ('tests','failures','errors','skipped'))
              assert counts == (5,0,0,0), (classname, counts)
          print('W04_C1B2G_STAGED_FIVE_STORE_EVIDENCE2_JVM_XML_PASS NEW_5/5_LEGACY_5/5')
          PY
      - name: Preserve generation JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-c1b2g-five-store-evidence2-xml
          if-no-files-found: error
          path: v5/store/generation/build/test-results/**/TEST-*.xml
