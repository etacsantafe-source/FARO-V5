name: FARO V5 S3 A5 certified active Reality8 host open directed

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5GenerationStoreGraph.kt"
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5ActiveGenerationGraphOwner.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5ActiveGenerationGraphOwnerPlanning8OpenT2Test.kt"
      - ".github/workflows/faro-v5-s3-a5-active8-open-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-a5-active8-host-${{ github.ref }}
  cancel-in-progress: false

jobs:
  active8-host-open:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android platform
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Execute six NEW real five-store active8 host tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache \
            -Pkotlin.compiler.execution.strategy=in-process \
            "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            :app:testDebugUnitTest --tests "ar.com.faro.v5.app.FaroV5ActiveGenerationGraphOwnerPlanning8OpenT2Test"
      - name: Verify exact new JUnit XML six of six
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          base=Path('v5/app/build/test-results/testDebugUnitTest')
          found=list(base.glob('TEST-*FaroV5ActiveGenerationGraphOwnerPlanning8OpenT2Test.xml'))
          if len(found)!=1: raise SystemExit('S3_A5_ACTIVE8_HOST_XML_MISSING')
          x=ET.parse(found[0]).getroot()
          nums=tuple(int(x.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
          if nums!=(6,0,0,0): raise SystemExit('S3_A5_ACTIVE8_HOST_XML_RED '+str(nums))
          print('S3_A5_ACTIVE8_REAL_SQLITE_HOST_XML_PASS 6/6')
          PY
