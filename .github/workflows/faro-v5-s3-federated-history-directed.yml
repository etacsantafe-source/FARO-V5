name: FARO V5 S3 N015 two-owner federated history directed

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5FederatedHistoryReadSource.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5FederatedHistoryReadSourceTest.kt"
      - ".github/workflows/faro-v5-s3-federated-history-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-n015-federation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  federated-history:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK compile platform
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile app and run N015 federated history tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:compileDebugKotlin :app:testDebugUnitTest --tests "ar.com.faro.v5.app.FaroV5FederatedHistoryReadSourceTest"
      - name: Verify exact N015 federated history JUnit XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          base=Path('v5/app/build/test-results/testDebugUnitTest')
          xmls=list(base.glob('TEST-*FaroV5FederatedHistoryReadSourceTest.xml'))
          if len(xmls)!=1:
              raise SystemExit('S3_N015_FEDERATED_XML_MISSING '+str(len(xmls)))
          suite=ET.parse(xmls[0]).getroot()
          counts=tuple(int(suite.attrib.get(k,'-1'))
                       for k in ('tests','failures','errors','skipped'))
          if counts!=(6,0,0,0):
              raise SystemExit('S3_N015_FEDERATED_XML_FAIL '+str(counts))
          print('S3_N015_FEDERATED_HISTORY_XML_PASS 6/6')
          PY
