name: FARO V5 S2 isolated Chat directed
on:
  push:
    branches: [work/s2-chat-finish-night-20261102]
    paths:
      - 'v5/app/**'
      - 'v5/surface/**'
      - 'v5/kernel/contracts/**'
      - 'v5/platform/**'
      - '.github/workflows/faro-v5-s2-chat-isolated.yml'
permissions:
  contents: read
concurrency:
  group: faro-v5-s2-chat-night
  cancel-in-progress: false
jobs:
  compile-and-directed-jvm:
    if: github.repository == 'etacsantafe-source/FARO-V5'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android compile platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      # CI recovery: 41390549337 exhausted the Gradle JVM heap in :app:compileDebugJavaWithJavac.
      # Bound workers and give the compiler a 3 GiB heap; keep emulator job at 1.5 GiB.
      - name: Assemble isolated Chat (no credentials)
        working-directory: v5
        run: ./gradlew -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx1536m --no-daemon --max-workers=1 --no-parallel --no-configuration-cache :app:assembleDebug -PfaroP6PhysicalApplicationId=ar.com.faro.alpha.s2isolated
      - name: Assert debug identity and shipping V2 OFF
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FaroV5F1IsolatedChatActivity' v5/app/src/debug/AndroidManifest.xml
          grep -q 'const val V2_ACTIVE_ENABLED: Boolean = false' v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5HostCertification.kt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging v5/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='ar.com.faro.alpha.s2isolated.v5dev'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs v5/app/build/outputs/apk/debug/app-debug.apk
          sha256sum v5/app/build/outputs/apk/debug/app-debug.apk
      - name: Directed F1 JVM
        working-directory: v5
        run: ./gradlew -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx1536m --no-daemon --max-workers=1 --no-parallel --no-configuration-cache :app:testDebugUnitTest --tests 'ar.com.faro.v5.app.FaroV5QuarantinedV2ChatHostBindingT2Test' --tests 'ar.com.faro.v5.app.FaroV5ChatToReviewedApplyFlowT2Test'
      - name: Directed A5 explicit-consent contract JVM
        working-directory: v5
        run: ./gradlew -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx1536m --no-daemon --max-workers=1 --no-parallel --no-configuration-cache :kernel:contracts:test --tests 'ar.com.faro.v5.kernel.contracts.ConversationAttachmentDraftConsentPolicyTest'
      - name: Exact A5 consent XML oracle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path('v5/kernel/contracts/build/test-results/test/TEST-ar.com.faro.v5.kernel.contracts.ConversationAttachmentDraftConsentPolicyTest.xml')
          if not p.is_file(): raise SystemExit('MISSING_A5_XML '+str(p))
          r=ET.parse(p).getroot()
          got=tuple(int(r.attrib.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
          if got!=(9,0,0,0): raise SystemExit('RED_A5_XML '+str(got))
          print('A5_TEXT_DRAFT_CONSENT_PASS 9/9; PHYSICAL_T4_NOT_RUN')
          PY
      - name: Exact XML oracle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name, count in [('FaroV5QuarantinedV2ChatHostBindingT2Test',2),('FaroV5ChatToReviewedApplyFlowT2Test',2)]:
              p=Path('v5/app/build/test-results/testDebugUnitTest/TEST-ar.com.faro.v5.app.'+name+'.xml')
              if not p.is_file(): raise SystemExit('MISSING_XML '+str(p))
              r=ET.parse(p).getroot()
              got=tuple(int(r.attrib.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
              if got!=(count,0,0,0): raise SystemExit('RED_XML '+str((name,got)))
              print('PASS',name,count)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FARO-S2-CHAT-ISOLATED-DEBUG-NOT-PHYSICALLY-VERIFIED
          path: v5/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-debug-chat-entry:
    needs: compile-and-directed-jvm
    if: github.repository == 'etacsantafe-source/FARO-V5'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android compile platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo KVM_UNAVAILABLE; fi
      - name: Test real debug launcher, no consent and Keystore-only admission
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cd v5 && ./gradlew -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" --no-daemon --max-workers=1 --no-parallel --no-configuration-cache :app:connectedDebugAndroidTest -PfaroP6PhysicalApplicationId=ar.com.faro.alpha.s2isolated '-Pandroid.testInstrumentationRunnerArguments.class=ar.com.faro.v5.app.FaroV5F1IsolatedEntryInstrumentationTest,ar.com.faro.v5.app.FaroV5F1QuarantinedComposeInstrumentationTest#composeHumanReviewAppliesOnlyToQuarantinedRealityWithCanonicalReceipt,ar.com.faro.v5.app.FaroV5A5TextReaderInstrumentationTest'
      - name: Exact integrated Android XML (entry + reviewed Apply/Delivery/restart)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected={
              ('FaroV5F1IsolatedEntryInstrumentationTest',
               'deniedConsentCreatesNoStoreThenConsentedChatMountsWithoutRemoteCall'),
              ('FaroV5F1QuarantinedComposeInstrumentationTest',
               'composeHumanReviewAppliesOnlyToQuarantinedRealityWithCanonicalReceipt'),
              ('FaroV5A5TextReaderInstrumentationTest',
               'syntheticContentProviderReadIsBoundedAndWipedOnClose'),
              ('FaroV5A5TextReaderInstrumentationTest',
               'duplicatePickedBytesFailClosedBeforeAnyDraftMutation'),
              ('FaroV5A5TextReaderInstrumentationTest',
               'nonContentUriIsRejectedWithoutOpeningProvider'),
          }
          found=[]
          for p in Path('v5/app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'):
              for case in ET.parse(p).getroot().iter('testcase'):
                  cls=case.attrib.get('classname','').split('.')[-1]
                  name=case.attrib.get('name','')
                  if (cls,name) in expected:
                      if any(case.find(k) is not None for k in ('failure','error','skipped')):
                          raise SystemExit('ANDROID_F1_INTEGRATED_RED '+str((cls,name)))
                      found.append((cls,name))
          if set(found)!=expected or len(found)!=len(expected):
              raise SystemExit('ANDROID_F1_INTEGRATED_MISSING '+str(found))
          print('F1_A5_ANDROID_CHAT_REVIEW_APPLY_DELIVERY_RESTART_AND_READER_PASS 5/5; LIVE_GROQ_T4_NOT_RUN')
          PY
