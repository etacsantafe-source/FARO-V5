name: FARO V5 W04-C1b2H2A local Evidence2 typed JSON DEV

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/maintenance/src/main/kotlin/ar/com/faro/v5/maintenance/CommercialTypedPortabilityJsonCodec.kt
      - v5/maintenance/src/test/kotlin/ar/com/faro/v5/maintenance/CommercialTypedPortabilityJsonCodecTest.kt
      - .github/workflows/faro-v5-s4-w04-c1b2h2a-local-typed-json.yml

permissions:
  contents: read

jobs:
  c1b2h2a-local-json:
    if: contains(github.event.head_commit.message, 'FARO-UNIT:S4_W04_C1B2H2A_LOCAL_TYPED_JSON_CODEC_DEV')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: H2A EXACT3 gate from parent READY
        run: |
          set -euo pipefail
          UNIT=S4_W04_C1B2H2A_LOCAL_TYPED_JSON_CODEC_DEV
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count+1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -eq 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK for Gradle configuration
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Local typed JSON plus legacy maintenance regression JVM
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :maintenance:test
      - name: Verify H2A exact eight JUnit tests with no skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          reports = list(Path('v5/maintenance/build/test-results').rglob('TEST-*CommercialTypedPortabilityJsonCodecTest.xml'))
          assert len(reports) == 1, reports
          suite = ElementTree.parse(reports[0]).getroot()
          counts = tuple(int(suite.attrib[k]) for k in ('tests','failures','errors','skipped'))
          assert counts == (8,0,0,0), counts
          print('W04_C1B2H2A_LOCAL_TYPED_JSON_JVM_XML_PASS 8/8')
          PY
      - name: Preserve maintenance test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w04-c1b2h2a-typed-json-xml
          if-no-files-found: error
          path: v5/maintenance/build/test-results/**/TEST-*.xml
