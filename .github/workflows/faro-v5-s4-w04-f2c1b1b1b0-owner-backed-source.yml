name: FARO V5 W04-F2C1B1B1B0 real leased DEV owner sources
on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5GenerationStoreGraph.kt"
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household10Evidence2DevSelectionReadPort.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Household10Evidence2DevSelectionReadPortTest.kt"
      - ".github/workflows/faro-v5-s4-w04-f2c1b1b1b0-owner-backed-source.yml"
permissions:
  contents: read
jobs:
  real-owner-backend:
    if: contains(github.event.head_commit.message, 'FARO-UNIT:S4_W04_F2C1B1B1B0_LEASED_OWNER_REAL_SOURCE_DEV')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mandatory exact four READY paths
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/faro-protocol-gate.py --mode ci --head HEAD
          UNIT=S4_W04_F2C1B1B1B0_LEASED_OWNER_REAL_SOURCE_DEV
          count=0
          while IFS= read -r route; do
            test -n "$route"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$route"
            count=$((count+1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -eq 4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Four NEW real ACTIVE store/owner lease tests ONLY
        shell: bash
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache \
            -Pkotlin.compiler.execution.strategy=in-process \
            "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            ":store:generation:test" \
            --tests "ar.com.faro.v5.generation.FaroV5Household10Evidence2DevSelectionReadPortTest.t07*" \
            --tests "ar.com.faro.v5.generation.FaroV5Household10Evidence2DevSelectionReadPortTest.t08*" \
            --tests "ar.com.faro.v5.generation.FaroV5Household10Evidence2DevSelectionReadPortTest.t09*" \
            --tests "ar.com.faro.v5.generation.FaroV5Household10Evidence2DevSelectionReadPortTest.t10*"
      - name: Verify exact four new JUnit5 XML cases
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          p = Path("v5/store/generation/build/test-results/test/TEST-ar.com.faro.v5.generation.FaroV5Household10Evidence2DevSelectionReadPortTest.xml")
          assert p.is_file(),p
          cases=list(ET.parse(p).getroot().iter("testcase"))
          names={c.attrib.get("name","").removesuffix("()") for c in cases}
          expected={
            "t07RealOwnerSourcesShareOneActiveLeaseAndExactTypedSelection",
            "t08DeniedHumanDecisionNeverLeavesAnActiveRootLease",
            "t09LegacyTermsOrMissingSelectedProductAreNeverGranted",
            "t10HostEpochConsentAndPointerAbaCannotResurrectOwnerGrants",
          }
          assert len(cases)==len(names)==4,(names,p)
          assert names==expected,(names,expected)
          assert all(c.find(k) is None for c in cases for k in ("failure","error","skipped"))
          print("FARO_W04_F2C1B1B1B0_REAL_LEASED_OWNER_XML_PASS_4_4")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w04-f2c1b1b1b0-real-leased-owner-junit-xml
          if-no-files-found: warn
          path: v5/store/generation/build/test-results/test/TEST-*FaroV5Household10Evidence2DevSelectionReadPortTest.xml
