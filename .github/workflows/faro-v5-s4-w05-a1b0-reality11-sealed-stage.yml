name: FARO V5 W05-A1B0 Reality11 Sealed Generation Migration

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityHousehold11StagedFilePort.kt
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household11StagedMigration.kt
      - v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Household11StagedMigrationTest.kt
      - .github/workflows/faro-v5-s4-w05-a1b0-reality11-sealed-stage.yml

permissions:
  contents: read

jobs:
  household11-sealed-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: W05-A1B0 exact-four-path protocol preflight
        shell: bash
        run: |
          set -euo pipefail
          UNIT=S4_W05_A1B0_REALITY11_SEALED_STAGE_DEV
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count + 1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -eq 4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for Gradle multi-project configuration
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Exercise sealed five-store Reality11 migration
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:generation:test --tests ar.com.faro.v5.generation.FaroV5Household11StagedMigrationTest
      - name: Verify original eight JUnit XML tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          reports = list(Path('v5/store/generation/build/test-results/test').glob(
              'TEST-*FaroV5Household11StagedMigrationTest.xml'))
          assert len(reports) == 1, reports
          suite = ElementTree.parse(reports[0]).getroot()
          totals = tuple(int(suite.attrib[k]) for k in ('tests','failures','errors','skipped'))
          assert totals == (8,0,0,0), totals
          print('FARO_W05_A1B0_SEALED_GENERATION_XML_PASS_8_8')
          PY
      - name: Preserve W05-A1B0 original JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-a1b0-reality11-sealed-generation-xml
          if-no-files-found: error
          path: v5/store/generation/build/test-results/test/TEST-*FaroV5Household11StagedMigrationTest.xml
