name: FARO V5 W05-A1C0B0 staged confirmed purchase schema

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityHousehold12PurchaseSchema.kt
      - v5/store/reality/src/test/kotlin/ar/com/faro/v5/store/reality/RealityHousehold12PurchaseSchemaTest.kt
      - .github/workflows/faro-v5-s4-w05-a1c0b0-purchase-schema.yml

permissions:
  contents: read

jobs:
  staged-household12:
    if: contains(github.event.head_commit.message, 'FARO-UNIT:S4_W05_A1C0B0_PURCHASE_STAGED_SCHEMA_DEV')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify W05-A1C0B0 exact three path preflight on parent
        shell: bash
        run: |
          set -euo pipefail
          UNIT=S4_W05_A1C0B0_PURCHASE_STAGED_SCHEMA_DEV
          count=0
          while IFS= read -r ROUTE; do
            test -n "$ROUTE"
            python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$UNIT" --path "$ROUTE"
            count=$((count + 1))
          done < <(git diff --name-only --no-renames HEAD^ HEAD)
          test "$count" -eq 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for Gradle multi-project config
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Exactly six W05-A1C0B0 staged SQL tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:reality:test --tests ar.com.faro.v5.store.reality.RealityHousehold12PurchaseSchemaTest
      - name: Verify original six JUnit XML cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          reports = list(Path('v5/store/reality/build/test-results/test').glob(
              'TEST-*RealityHousehold12PurchaseSchemaTest.xml'))
          assert len(reports) == 1, reports
          suite = ElementTree.parse(reports[0]).getroot()
          totals = tuple(int(suite.attrib[k]) for k in ('tests','failures','errors','skipped'))
          assert totals == (6,0,0,0), totals
          print('FARO_W05_A1C0B0_REALITY12_STAGED_XML_PASS_6_6')
          PY
      - name: Preserve original W05-A1C0B0 XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-a1c0b0-reality12-staged-xml
          if-no-files-found: error
          path: v5/store/reality/build/test-results/test/TEST-*RealityHousehold12PurchaseSchemaTest.xml
