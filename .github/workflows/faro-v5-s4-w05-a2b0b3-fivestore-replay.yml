name: FARO V5 W05-A2B0B3 authenticated five-store SQL14 replay DEV

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household14V11StagedReplay.kt
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household13V10StagedReplay.kt
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5GenerationStoreGraph.kt
      - v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityHousehold14StagedFilePort.kt
      - v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Household14V11StagedReplayTest.kt
      - .github/workflows/faro-v5-s4-w05-a2b0b3-fivestore-replay.yml
      - v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityStore.kt
      - v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityFinance9SealedReadPort.kt
      - v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityHousehold11NeedsRowsPort.kt

permissions:
  contents: read

jobs:
  sql14-five-store-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact scope and READY parent
        shell: bash
        run: |
          set -euo pipefail
          unit=S4_W05_A2B0B3_FBS2V11_FIVESTORE_SQL14_REPLAY_DEV
          permit=docs/v5/FARO_PROTOCOL_WORK_PERMIT.json
          mapfile -t permitted < <(git show "HEAD^:$permit" | jq -r '.paths[]' | sort)
          mapfile -t changed < <(git diff --name-only --no-renames HEAD^ HEAD | sort)
          test "${#permitted[@]}" -eq 9
          if git show "HEAD^:$permit" | jq -e --arg unit "$unit" \
              '.last_code_review.result == "RED_FIX" and .last_code_review.unit_id == $unit' >/dev/null; then
            test "${#changed[@]}" -gt 0
            for route in "${changed[@]}"; do
              grep -Fxq "$route" <(printf '%s\n' "${permitted[@]}")
            done
          else
            diff -u <(printf '%s\n' "${permitted[@]}") <(printf '%s\n' "${changed[@]}")
          fi
          args=()
          for route in "${permitted[@]}"; do
            args+=(--path "$route")
          done
          python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$unit" "${args[@]}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for Gradle
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Test SQL14 FBS2v11 replay and exact v10 regression
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:generation:test --tests ar.com.faro.v5.generation.FaroV5Household14V11StagedReplayTest \
              --tests ar.com.faro.v5.generation.FaroV5Household13V10StagedReplayTest
      - name: Verify original JUnit XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          directory = Path('v5/store/generation/build/test-results/test')
          for fixture, expected in (('Household14V11', 5), ('Household13V10', 8)):
              reports = list(directory.glob(f'TEST-*FaroV5{fixture}StagedReplayTest.xml'))
              assert len(reports) == 1, reports
              suite = ElementTree.parse(reports[0]).getroot()
              actual = tuple(int(suite.attrib[key]) for key in ('tests', 'failures', 'errors', 'skipped'))
              assert actual == (expected, 0, 0, 0), actual
              assert len({case.attrib['name'] for case in suite.findall('testcase')}) == expected
          PY
      - name: Preserve original five-store replay XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-a2b0b3-sql14-fivestore-replay-xml
          if-no-files-found: error
          path: |
            v5/store/generation/build/test-results/test/TEST-*FaroV5Household14V11StagedReplayTest.xml
            v5/store/generation/build/test-results/test/TEST-*FaroV5Household13V10StagedReplayTest.xml
