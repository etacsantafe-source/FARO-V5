name: FARO V5 W05-A2C0B3 authenticated FBS2v12 five-store SQL15 staged replay DEV

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household13V10StagedReplay.kt
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household14V11StagedReplay.kt
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household15V12StagedReplay.kt
      - v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Household15V12StagedReplayTest.kt
      - .github/workflows/faro-v5-s4-w05-a2c0b3-fbs2v12-staged-replay.yml

permissions:
  contents: read

jobs:
  sql15-v12-five-store-staged-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact5 scope and parent protocol preflight
        shell: bash
        run: |
          set -euo pipefail
          unit=S4_W05_A2C0B3_AUTH_FBS2V12_FIVESTORE_SQL15_STAGED_REPLAY_DEV
          permit=docs/v5/FARO_PROTOCOL_WORK_PERMIT.json
          mapfile -t allowed < <(git show "HEAD^:$permit" | jq -r '.paths[]' | sort)
          mapfile -t changed < <(git diff --name-only --no-renames HEAD^ HEAD | sort)
          test "${#allowed[@]}" -eq 5
          # B7 RED_FIX only: changed paths must be a nonempty subset of the exact5 READY permit.
          test "${#changed[@]}" -ge 1
          for path in "${changed[@]}"; do
            printf '%s\n' "${allowed[@]}" | grep -Fxq -- "$path"
          done
          args=()
          for path in "${changed[@]}"; do args+=(--path "$path"); done
          python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$unit" "${args[@]}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for Gradle
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Test five-store replay V12 and V11 plus authenticated V12 codec
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:generation:test \
            --tests ar.com.faro.v5.generation.FaroV5Household15V12StagedReplayTest \
            --tests ar.com.faro.v5.generation.FaroV5Household14V11StagedReplayTest \
            --tests ar.com.faro.v5.generation.FaroV5Household15Fbs2CodecTest
      - name: Test SQL15 sealed consumption rows regression
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:reality:test \
            --tests ar.com.faro.v5.store.reality.RealityHousehold15ConsumptionRowsPortTest
      - name: Verify original JUnit XML test vectors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          suites = (
              ('generation', 'FaroV5Household15V12StagedReplayTest', 8),
              ('generation', 'FaroV5Household14V11StagedReplayTest', 5),
              ('generation', 'FaroV5Household15Fbs2CodecTest', 8),
              ('reality', 'RealityHousehold15ConsumptionRowsPortTest', 7),
          )
          for module, name, count in suites:
              directory = Path('v5/store')/module/'build/test-results/test'
              reports = list(directory.glob(f'TEST-*{name}.xml'))
              assert len(reports) == 1, (name, reports)
              suite = ElementTree.parse(reports[0]).getroot()
              values = tuple(int(suite.attrib[key]) for key in ('tests','failures','errors','skipped'))
              assert values == (count,0,0,0), (name,values)
              assert len({case.attrib['name'] for case in suite.findall('testcase')}) == count
          PY
      - name: Preserve original FBS2v12 replay and SQL15 JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-a2c0b3-fbs2v12-five-store-staged-replay-xml
          if-no-files-found: error
          path: |
            v5/store/generation/build/test-results/test/TEST-*FaroV5Household15V12StagedReplayTest.xml
            v5/store/generation/build/test-results/test/TEST-*FaroV5Household14V11StagedReplayTest.xml
            v5/store/generation/build/test-results/test/TEST-*FaroV5Household15Fbs2CodecTest.xml
            v5/store/reality/build/test-results/test/TEST-*RealityHousehold15ConsumptionRowsPortTest.xml
