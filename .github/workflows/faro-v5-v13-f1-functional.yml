name: FARO V5 V1.3 F1 functional bridge

on:
  push:
    branches:
      - work/cierre-noche-v13-20261030
    paths:
      - "v5/app/**"
      - "v5/surface/**"
      - ".github/workflows/faro-v5-v13-f1-functional.yml"

permissions:
  contents: read

concurrency:
  group: faro-v5-v13-f1-functional-${{ github.ref }}
  cancel-in-progress: false

jobs:
  f1-quarantined-bridge:
    if: github.repository == 'etacsantafe-source/FARO-V5'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 37 compile platform
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compose surface and staged host compile plus two functional owner tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            --tests 'ar.com.faro.v5.app.FaroV5QuarantinedV2ChatHostBindingT2Test' \
            --tests 'ar.com.faro.v5.app.FaroV5ChatToReviewedApplyFlowT2Test'
      - name: Focused XML oracle (does not certify complete Android UI E2E)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          names=[
              'FaroV5QuarantinedV2ChatHostBindingT2Test',
              'FaroV5ChatToReviewedApplyFlowT2Test',
          ]
          for name in names:
              p=Path('v5/app/build/test-results/testDebugUnitTest/TEST-ar.com.faro.v5.app.'+name+'.xml')
              if not p.is_file(): raise SystemExit('F1_V13_MISSING_XML '+name)
              root=ET.parse(p).getroot()
              values=tuple(int(root.attrib.get(k,'-1')) for k in
                           ('tests','failures','errors','skipped'))
              if values!=(1,0,0,0): raise SystemExit(f'F1_V13_FAIL {name} {values}')
              print('F1_V13_DIRECTED_PASS',name,'1/1')
          print('Android UI E2E and physical T4 NOT_RUN; S2.A6 unchanged.')
          PY

  f1-android-compose-quarantine:
    if: github.repository == 'etacsantafe-source/FARO-V5'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 37 compile platform
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo KVM_UNAVAILABLE; fi
      - name: Android Compose F1 quarantined five-owner UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cd v5 && ./gradlew -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ar.com.faro.v5.app.FaroV5F1QuarantinedComposeInstrumentationTest
      - name: Exact Android Compose XML oracle
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('v5/app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'))
          matches=[]
          for p in files:
              root=ET.parse(p).getroot()
              for case in root.iter('testcase'):
                  if 'FaroV5F1QuarantinedComposeInstrumentationTest' in case.attrib.get('classname',''):
                      matches.append((p,case))
          if len(matches)!=2: raise SystemExit(f'F1_V13_COMPOSE_NOT_EXECUTED count={len(matches)}')
          p,case=matches[0]
          if any(case.find(x) is not None for x in ('failure','error','skipped')):
              raise SystemExit(f'F1_V13_COMPOSE_FAILED {p}')
          print('FARO_V13_F1_COMPOSE_QUARANTINE_EXECUTED_PASS 2/2')
          print('Staged Reality Apply tested, OS Delivery and physical T4 NOT_RUN; F1 criterion remains OPEN.')
          PY
