name: FARO V5 W05-A2C0C1A SQL15 all-five-store semantic staged readback DEV

on:
  push:
    branches: [work/s3-night-20261102]
    paths:
      - v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityFinance9SealedReadPort.kt
      - v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityHousehold11NeedsRowsPort.kt
      - v5/store/reality/src/main/kotlin/ar/com/faro/v5/store/reality/RealityStore.kt
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5GenerationStoreGraph.kt
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household13V10StagedReplay.kt
      - v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Household15PreCutoverReadback.kt
      - v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Household15V12StagedReplayTest.kt
      - .github/workflows/faro-v5-s4-w05-a2c0c1a-sql15-fivestore-semantic-readback.yml

permissions:
  contents: read

jobs:
  sql15-fivestore-semantic-readback-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact8 scope and parent protocol preflight
        shell: bash
        run: |
          set -euo pipefail
          unit=S4_W05_A2C0C1A_SQL15_FIVESTORE_SEMANTIC_SEALED_DEV
          permit=docs/v5/FARO_PROTOCOL_WORK_PERMIT.json
          mapfile -t allowed < <(git show "HEAD^:$permit" | jq -r '.paths[]' | sort)
          mapfile -t changed < <(git diff --name-only --no-renames HEAD^ HEAD | sort)
          test "${#allowed[@]}" -eq 8
          diff -u <(printf '%s\n' "${allowed[@]}") <(printf '%s\n' "${changed[@]}")
          args=()
          for path in "${allowed[@]}"; do args+=(--path "$path"); done
          python3 scripts/quality/faro-protocol-gate.py --mode preflight --head HEAD^ --unit "$unit" "${args[@]}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK for Gradle
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Test full SQL15 five-store semantic equality plus historical replay and codec
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:generation:test \
            --tests ar.com.faro.v5.generation.FaroV5Household15V12StagedReplayTest \
            --tests ar.com.faro.v5.generation.FaroV5Household14V11StagedReplayTest \
            --tests ar.com.faro.v5.generation.FaroV5Household15Fbs2CodecTest
      - name: Test SQL15 sealed consumption rows regression
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:reality:test \
            --tests ar.com.faro.v5.store.reality.RealityHousehold15ConsumptionRowsPortTest
      - name: Verify original JUnit XML test vectors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          suites = (
              ('generation', 'FaroV5Household15V12StagedReplayTest', 15),
              ('generation', 'FaroV5Household14V11StagedReplayTest', 5),
              ('generation', 'FaroV5Household15Fbs2CodecTest', 8),
              ('reality', 'RealityHousehold15ConsumptionRowsPortTest', 7),
          )
          for module, name, count in suites:
              directory = Path('v5/store')/module/'build/test-results/test'
              reports = list(directory.glob(f'TEST-*{name}.xml'))
              assert len(reports) == 1, (name, reports)
              suite = ElementTree.parse(reports[0]).getroot()
              values = tuple(int(suite.attrib[key]) for key in ('tests','failures','errors','skipped'))
              assert values == (count,0,0,0), (name,values)
              assert len({case.attrib['name'] for case in suite.findall('testcase')}) == count
          PY
      - name: Preserve original SQL15 full semantic and historical JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w05-a2c0c1a-sql15-fivestore-semantic-readback-xml
          if-no-files-found: error
          path: |
            v5/store/generation/build/test-results/test/TEST-*FaroV5Household15V12StagedReplayTest.xml
            v5/store/generation/build/test-results/test/TEST-*FaroV5Household14V11StagedReplayTest.xml
            v5/store/generation/build/test-results/test/TEST-*FaroV5Household15Fbs2CodecTest.xml
            v5/store/reality/build/test-results/test/TEST-*RealityHousehold15ConsumptionRowsPortTest.xml
