name: FARO V5 S3 A4 N033C2B2 host Reality8 readiness-only

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5GenerationStoreGraph.kt"
      - "v5/app/src/main/kotlin/ar/com/faro/v5/app/FaroV5ActiveGenerationGraphOwner.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5ActiveReality8ReopenT2Test.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5ActiveReality8HostReadinessT2Test.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5ActiveGenerationGraphOwnerT2Test.kt"
      - "v5/app/src/test/kotlin/ar/com/faro/v5/app/FaroV5ActiveGenerationGraphOwnerPlanning8ReadinessT2Test.kt"
      - ".github/workflows/faro-v5-s3-a4-n033c2b2-host-reality8-readiness-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-a4-n033c2b2-host-reality8
  cancel-in-progress: false

jobs:
  host-reality8-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK for Gradle configuration
        run: |
          set -eu
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Directed generation and Android JVM host gates
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :store:generation:test --tests "ar.com.faro.v5.generation.FaroV5ActiveReality8ReopenT2Test" --tests "ar.com.faro.v5.generation.FaroV5ActiveReality8HostReadinessT2Test" :app:testDebugUnitTest --tests "ar.com.faro.v5.app.FaroV5ActiveGenerationGraphOwnerT2Test" --tests "ar.com.faro.v5.app.FaroV5ActiveGenerationGraphOwnerPlanning8ReadinessT2Test"
      - name: Require exact JUnit XML without skips/failures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          cases=[
            (Path('v5/store/generation/build/test-results/test'), 'FaroV5ActiveReality8ReopenT2Test', 6),
            (Path('v5/store/generation/build/test-results/test'), 'FaroV5ActiveReality8HostReadinessT2Test', 2),
            (Path('v5/app/build/test-results/testDebugUnitTest'), 'FaroV5ActiveGenerationGraphOwnerT2Test', 3),
            (Path('v5/app/build/test-results/testDebugUnitTest'), 'FaroV5ActiveGenerationGraphOwnerPlanning8ReadinessT2Test', 3),
          ]
          count=0
          for folder,name,expected in cases:
              files=list(folder.glob('TEST-*'+name+'.xml'))
              if len(files)!=1:
                  raise SystemExit('N033C2B2_XML_MISSING '+name)
              root=ET.parse(files[0]).getroot()
              observed=tuple(int(root.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
              if observed!=(expected,0,0,0):
                  raise SystemExit('N033C2B2_XML_FAIL '+name+' '+str(observed))
              print('N033C2B2_XML_PASS '+name+' '+str(expected)+'/'+str(expected))
              count+=expected
          if count!=14:
              raise SystemExit('N033C2B2_TOTAL_FAIL '+str(count))
          print('N033C2B2_HOST_REALITY8_READINESS_PASS 14/14')
          PY
