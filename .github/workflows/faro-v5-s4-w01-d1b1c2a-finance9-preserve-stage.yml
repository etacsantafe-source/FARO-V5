name: FARO V5 W01 D1B1C2A Finance9 DEV data-preserving stage
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/store/generation/src/main/kotlin/ar/com/faro/v5/generation/FaroV5Finance9DevStagePreparation.kt"
      - "v5/store/generation/src/test/kotlin/ar/com/faro/v5/generation/FaroV5Finance9DevStagePreparationTest.kt"
      - ".github/workflows/faro-v5-s4-w01-d1b1c2a-finance9-preserve-stage.yml"
permissions:
  contents: read
concurrency:
  group: faro-w01-d1b1c2a-finance9-preserve-stage
  cancel-in-progress: false
jobs:
  finance9-stage-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify FARO protocol for this checkout
        run: python3 scripts/quality/faro-protocol-gate.py --mode ci --head HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run directed DEV stage preparation tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache \
            :store:generation:test --tests ar.com.faro.v5.generation.FaroV5Finance9DevStagePreparationTest
      - name: Verify exact D1B1C2A JUnit report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("v5/store/generation/build/test-results/test") / (
              "TEST-ar.com.faro.v5.generation.FaroV5Finance9DevStagePreparationTest.xml"
          )
          suite = ElementTree.parse(report).getroot()
          counts = tuple(int(suite.get(key, "-1")) for key in ("tests", "failures", "errors", "skipped"))
          expected = {
              "copiesFiveStoresAndPreservesAccountAndMovementBeforeCutover",
              "samePointerWithNewSourceBytesInvalidatesPreparedCopy",
              "activePointerAbaDeniesBeforeStageCreation",
              "danglingWalPreventsAnyStageCopy",
              "interruptedCopyDoesNotPublishAValidatedJournal",
              "foreignPendingJournalPreventsPreparation",
              "missingExclusiveLeasePreventsPreparation",
          }
          names = [case.attrib["name"].removesuffix("()") for case in suite.findall("testcase")]
          if counts != (len(expected), 0, 0, 0) or set(names) != expected or len(names) != len(expected):
              raise SystemExit(f"D1B1C2A unexpected JUnit evidence: {counts}, {names}")
          print(f"D1B1C2A_FINANCE9_DEV_STAGE_PREPARATION_PASS {len(expected)}/{len(expected)}")
          PY
      - name: Preserve exact D1B1C2A JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faro-w01-d1b1c2a-finance9-preserve-stage-junit
          path: v5/store/generation/build/test-results/test/TEST-ar.com.faro.v5.generation.FaroV5Finance9DevStagePreparationTest.xml
          if-no-files-found: warn
