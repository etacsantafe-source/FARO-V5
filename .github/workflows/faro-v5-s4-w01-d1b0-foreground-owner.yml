name: FARO V5 W01 D1B0 real Android foreground Finance read shell
on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/src/w01FinanceDev/kotlin/ar/com/faro/v5/app/FaroV5W01FinanceDevActivities.kt"
      - "v5/app/src/w01FinanceDev/AndroidManifest.xml"
      - "v5/app/src/w01AndroidTest/kotlin/ar/com/faro/v5/app/S4W01FinanceForegroundOwnerAndroidTest.kt"
      - ".github/workflows/faro-v5-s4-w01-d1b0-foreground-owner.yml"
permissions:
  contents: read
concurrency:
  group: faro-w01-d1b0-foreground
  cancel-in-progress: false
jobs:
  android-w01-foreground:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate FARO protocol for this checkout
        run: python3 scripts/quality/faro-protocol-gate.py --mode ci --head HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 37 for project compile
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"; fi
      - name: Compile only W01 isolated app and Android test
        working-directory: v5
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 2400 \
            ./gradlew --no-daemon --max-workers=1 --no-parallel --no-configuration-cache \
            -Pkotlin.compiler.execution.strategy=in-process \
            "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            -PfaroW01AndroidTest=true \
            :app:assembleW01FinanceDev :app:assembleW01FinanceDevAndroidTest \
            :app:processV2CoreDevManifestForPackage
      - name: Check manifest W01 only, no exported Finance reader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ns="{http://schemas.android.com/apk/res/android}"
          base=Path("v5/app/build/intermediates/packaged_manifests")
          def read(bt):
              files=sorted((base/bt).rglob("AndroidManifest.xml"))
              if len(files)!=1: raise SystemExit(f"MANIFEST_COUNT_{bt}: {len(files)}")
              return ET.parse(files[0]).getroot()
          w=read("w01FinanceDev"); core=read("v2CoreDev")
          app=w.find("application")
          if w.get("package")!="ar.com.faro.alpha.w01financedev" or app is None: raise SystemExit("WRONG_W01_PACKAGE")
          acts=app.findall("activity")
          launch=[a for a in acts if a.get(ns+"name")=="ar.com.faro.v5.app.FaroV5W01FinanceDevLauncherActivity"]
          private=[a for a in acts if a.get(ns+"name")=="ar.com.faro.v5.app.FaroV5W01FinanceReadDevActivity"]
          if len(launch)!=1 or launch[0].get(ns+"exported")!="true": raise SystemExit("W01_CHAT_LAUNCHER_LOST")
          if len(private)!=1 or private[0].get(ns+"exported")!="false": raise SystemExit("W01_READER_EXPORTED_OR_ABSENT")
          if core.find("application").findall("provider") or core.find("application").findall("service"):
              raise SystemExit("V2_CORE_CONTAMINATED")
          if any(x.get(ns+"name")=="android.permission.INTERNET" for x in w.findall("uses-permission")):
              raise SystemExit("W01_HAS_INTERNET")
          src=Path("v5/app/src/w01FinanceDev/kotlin/ar/com/faro/v5/app/FaroV5W01FinanceDevActivities.kt").read_text()
          if "newObservedFence" not in src or "throw SecurityException" not in src: raise SystemExit("D1B0_MUST_DENY_SQL")
          if "requestAfterExplicitForegroundReadRequest" in src or "Finance9TrustedReadPolicyIssuerPort" in src:
              raise SystemExit("D1B0_NO_REAL_CONSENT_OR_ISSUER")
          print("W01_D1B0_PRIVATE_FRAGMENTACTIVITY_ISOLATED_MANIFEST_PASS")
          PY
      - name: Allow KVM where present
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android API35 real foreground lifecycle and no SQL data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 600
          script: >-
            bash -euo pipefail -c '
            APP="$(find v5/app/build/outputs/apk/w01FinanceDev -type f -name "*.apk" -print -quit)";
            TEST="$(find v5/app/build/outputs/apk/androidTest/w01FinanceDev -type f -name "*.apk" -print -quit)";
            test -n "$APP" && test -n "$TEST";
            adb install "$APP";
            adb install "$TEST";
            OUT="$(adb shell am instrument -w -r -e class ar.com.faro.v5.app.S4W01FinanceForegroundOwnerAndroidTest ar.com.faro.alpha.w01financedev.test/androidx.test.runner.AndroidJUnitRunner 2>&1)" || { printf "%s\n" "$OUT"; exit 1; };
            printf "%s\n" "$OUT";
            printf "%s\n" "$OUT" | grep -Fq "OK (2 tests)";
            printf "%s\n" "$OUT" | grep -Fq "INSTRUMENTATION_CODE: -1";
            echo "W01_D1B0_ANDROID_API35_REAL_FOREGROUND_2_OF_2_PASS_NO_SQL_OR_BIOMETRIC"
            '
