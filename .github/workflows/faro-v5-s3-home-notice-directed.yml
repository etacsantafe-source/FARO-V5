name: FARO V5 S3 Home notice directed

on:
  push:
    branches:
      - work/s3-night-20261102
    paths:
      - "v5/app/**"
      - "v5/store/auxiliary/**"
      - ".github/workflows/faro-v5-s3-home-notice-directed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-v5-s3-home-notice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app-home-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK compile platform
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Compile app and run Home notice tests
        working-directory: v5
        run: |
          ./gradlew --no-daemon --max-workers=2 --no-parallel --no-configuration-cache :app:compileDebugKotlin :app:testDebugUnitTest --tests "ar.com.faro.v5.app.FaroV5HomeNoticeBindingFactoryTest" --tests "ar.com.faro.v5.app.FaroV5WorkspaceSearchReadSourceTest" --tests "ar.com.faro.v5.app.FaroV5FinanceSearchReadSourceTest" --tests "ar.com.faro.v5.app.FaroV5WorkspaceSearchSurfaceAdapterTest" --tests "ar.com.faro.v5.app.FaroV5ActiveAvisosBindingFactoryTest" --tests "ar.com.faro.v5.app.FaroV5ActiveChatReadSessionT2Test" --tests "ar.com.faro.v5.app.FaroV5ActiveHostPointerABATest" --tests "ar.com.faro.v5.app.FaroV5ActiveWorkspaceSearchGrantOwnerTest" --tests "ar.com.faro.v5.app.FaroV5SearchHostPortAdmissionTest"
      - name: Verify exact Home notice JUnit XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base = Path('v5/app/build/test-results/testDebugUnitTest')
          xmls = sorted(base.glob('TEST-*FaroV5HomeNoticeBindingFactoryTest.xml'))
          if len(xmls) != 1:
              raise SystemExit(f'S3_HOME_XML_MISSING {len(xmls)}')
          root = ET.parse(xmls[0]).getroot()
          vals = tuple(int(root.attrib.get(k, '-1')) for k in ('tests','failures','errors','skipped'))
          if vals != (11,0,0,0):
              raise SystemExit(f'S3_HOME_XML_FAIL {vals}')
          print('S3_HOME_NOTICE_XML_PASS 11/11')
          related = sorted(base.glob('TEST-*FaroV5WorkspaceSearchReadSourceTest.xml'))
          if len(related) != 1:
              raise SystemExit(f'S3_WORKSPACE_SEARCH_XML_MISSING {len(related)}')
          result = ET.parse(related[0]).getroot()
          cases = tuple(int(result.attrib.get(k, '-1')) for k in ('tests','failures','errors','skipped'))
          if cases != (7,0,0,0):
              raise SystemExit(f'S3_WORKSPACE_SEARCH_XML_FAIL {cases}')
          print('S3_WORKSPACE_SEARCH_XML_PASS 7/7')
          finance = sorted(base.glob('TEST-*FaroV5FinanceSearchReadSourceTest.xml'))
          if len(finance) != 1:
              raise SystemExit(f'S3_G4_FINANCE_SOURCE_XML_MISSING {len(finance)}')
          froot = ET.parse(finance[0]).getroot()
          fcounts = tuple(int(froot.attrib.get(k, '-1')) for k in ('tests','failures','errors','skipped'))
          if fcounts != (6,0,0,0):
              raise SystemExit(f'S3_G4_FINANCE_SOURCE_XML_FAIL {fcounts}')
          print('S3_G4_FINANCE_SOURCE_XML_PASS 6/6_UNMOUNTED')
          bridge = sorted(base.glob('TEST-*FaroV5WorkspaceSearchSurfaceAdapterTest.xml'))
          if len(bridge) != 1:
              raise SystemExit(f'S3_SEARCH_BRIDGE_XML_MISSING {len(bridge)}')
          bridge_root = ET.parse(bridge[0]).getroot()
          bridge_count = tuple(int(bridge_root.attrib.get(k, '-1')) for k in ('tests','failures','errors','skipped'))
          if bridge_count != (7,0,0,0):
              raise SystemExit(f'S3_SEARCH_BRIDGE_XML_FAIL {bridge_count}')
          print('S3_SEARCH_BRIDGE_XML_PASS 7/7')
          print('S3_G3_CANONICAL_ANCHOR_XML_PASS 2/2_ADDED')
          notices = sorted(base.glob('TEST-*FaroV5ActiveAvisosBindingFactoryTest.xml'))
          if len(notices) != 1:
              raise SystemExit(f'S3_AVISOS_XML_MISSING {len(notices)}')
          notices_root = ET.parse(notices[0]).getroot()
          notice_counts = tuple(int(notices_root.attrib.get(k, '-1')) for k in ('tests','failures','errors','skipped'))
          if notice_counts != (4,0,0,0):
              raise SystemExit(f'S3_AVISOS_XML_FAIL {notice_counts}')
          print('S3_AVISOS_XML_PASS 4/4')
          chat = sorted(base.glob('TEST-*FaroV5ActiveChatReadSessionT2Test.xml'))
          if len(chat) != 1:
              raise SystemExit(f'S3_CHAT_POINTER_ABA_XML_MISSING {len(chat)}')
          chat_root = ET.parse(chat[0]).getroot()
          chat_counts = tuple(int(chat_root.attrib.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
          if chat_counts != (6,0,0,0):
              raise SystemExit(f'S3_CHAT_POINTER_ABA_XML_FAIL {chat_counts}')
          print('S3_CHAT_POINTER_ABA_XML_PASS 6/6')
          host = sorted(base.glob('TEST-*FaroV5ActiveHostPointerABATest.xml'))
          if len(host) != 1:
              raise SystemExit(f'S3_ACTIVE_HOST_ABA_XML_MISSING {len(host)}')
          host_root = ET.parse(host[0]).getroot()
          host_counts = tuple(int(host_root.attrib.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
          if host_counts != (1,0,0,0):
              raise SystemExit(f'S3_ACTIVE_HOST_ABA_XML_FAIL {host_counts}')
          print('S3_ACTIVE_HOST_ABA_XML_PASS 1/1')
          grant = sorted(base.glob('TEST-*FaroV5ActiveWorkspaceSearchGrantOwnerTest.xml'))
          if len(grant) != 1:
              raise SystemExit(f'S3_SEARCH_HOST_GRANT_XML_MISSING {len(grant)}')
          grant_root = ET.parse(grant[0]).getroot()
          grant_counts = tuple(int(grant_root.attrib.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
          if grant_counts != (10,0,0,0):
              raise SystemExit(f'S3_SEARCH_HOST_GRANT_XML_FAIL {grant_counts}')
          print('S3_SEARCH_HOST_GRANT_XML_PASS 10/10')
          g2 = sorted(base.glob('TEST-*FaroV5SearchHostPortAdmissionTest.xml'))
          if len(g2) != 1:
              raise SystemExit(f'S3_G2_HOST_PORT_XML_MISSING {len(g2)}')
          g2_root = ET.parse(g2[0]).getroot()
          g2_counts = tuple(int(g2_root.attrib.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
          if g2_counts != (10,0,0,0):
              raise SystemExit(f'S3_G2_HOST_PORT_XML_FAIL {g2_counts}')
          print('S3_G2_HOST_PORT_XML_PASS 10/10')
          PY
      - name: Verify supported single-process Search host in merged manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('v5/app/build/intermediates')
          manifests = sorted(
              p for p in root.rglob('AndroidManifest.xml')
              if ('merged_manifest' in p.parts or 'merged_manifests' in p.parts)
              and 'debug' in p.parts
          )
          if not manifests:
              raise SystemExit('S3_G1_MERGED_MANIFEST_MISSING')
          android = '{http://schemas.android.com/apk/res/android}'
          for file in manifests:
              xml = ET.parse(file).getroot()
              app = xml.find('application')
              if app is None or app.attrib.get(android+'allowBackup') != 'false':
                  raise SystemExit('S3_G1_MANIFEST_BACKUP_BOUNDARY_FAIL')
              for component in [app, *list(app)]:
                  if android+'process' in component.attrib:
                      raise SystemExit(
                          'S3_G1_MULTIPROCESS_OUTSIDE_AUTHORIZED_SCOPE ' + str(file)
                      )
          print('S3_G1_SINGLE_PROCESS_MERGED_MANIFEST_PASS', len(manifests))
          PY
